    this.copyMat.uniforms.tColor.value = this.rtWorld.texture;
    this.copyMat.uniforms.tDepth.value = this.rtWorld.depthTexture;
    this.blit(this.copyMat, this.rtCopy);

    // pass 3 — interfaces (no clear: keeps the world colour and depth for occlusion)
    this.updateOpticOrder();
    cam.layers.set(LAYER_OPTIC);
    r.setRenderTarget(this.rtWorld);
    r.render(this.scene, cam);
    cam.layers.set(LAYER_WORLD);

    // pass 4 — bloom and output
    const finalU = this.finalMat.uniforms;
    if (this.useBloom) {
      const t = this.bloomTexel;
      this.brightMat.uniforms.tSrc.value = this.rtWorld.texture;
      this.blit(this.brightMat, this.rtBloomA);
      this.blurMat.uniforms.tSrc.value = this.rtBloomA.texture;
      this.blurMat.uniforms.uDir.value.set(t.x, 0);
      this.blit(this.blurMat, this.rtBloomB);
      this.blurMat.uniforms.tSrc.value = this.rtBloomB.texture;
      this.blurMat.uniforms.uDir.value.set(0, t.y);
      this.blit(this.blurMat, this.rtBloomA);
      this.blurMat.uniforms.tSrc.value = this.rtBloomA.texture;
      this.blurMat.uniforms.uDir.value.set(t.x * 2.0, 0);
      this.blit(this.blurMat, this.rtBloomB);
      this.blurMat.uniforms.tSrc.value = this.rtBloomB.texture;
      this.blurMat.uniforms.uDir.value.set(0, t.y * 2.0);
      this.blit(this.blurMat, this.rtBloomA);
      finalU.tBloom.value = this.rtBloomA.texture;
    } else {
      finalU.tBloom.value = this.rtBloomB.texture;   // an empty target: adds nothing
    }
    finalU.tColor.value = this.rtWorld.texture;
    this.blit(this.finalMat, null);
  }

  dispose() {
    for (const rt of [this.rtWorld, this.rtCopy, this.rtBloomA, this.rtBloomB]) rt.dispose();
    this.tri.geometry.dispose();
    for (const m of [this.copyMat, this.brightMat, this.blurMat, this.finalMat]) m.dispose();
  }
}


// ─────────────────────────── 50_tank.js ───────────────────────────
// The glass box: five panes, silicone seams, bottom frame, upper rim, the water surface and its waterline.

const PANE_VS = /* glsl */`
varying vec3 vWorld;
varying vec3 vNormalW;
varying vec3 vView;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  vNormalW = normal;                       // panes are axis-aligned and unscaled: object normal == world normal
  vec4 vp = viewMatrix * wp;
  vView = vp.xyz;
  gl_Position = projectionMatrix * vp;
}`;

const PANE_FS = /* glsl */`
uniform vec3 uMainNormal;
uniform float uEntry;                      // 1: camera on the outside of this pane (entry interface)
uniform float uThickness;
${WATER_GLSL}
${OPTIC_COMMON_GLSL}
varying vec3 vWorld;
varying vec3 vNormalW;
varying vec3 vView;

void main() {
  vec2 suv = gl_FragCoord.xy / uResolution;
  vec3 N = normalize(vNormalW);
  vec3 V = normalize(cameraPosition - vWorld);
  float mainFace = step(0.985, abs(dot(N, uMainNormal)));
  // An exit face seen from inside the water is optically negligible: the near pane / surface already
  // carried the absorption and reflection for that path.
  if (mainFace > 0.5 && uEntry < 0.5) discard;
  float cosI = clamp(dot(N, V), 1e-3, 1.0);
  vec3 col;
  if (mainFace < 0.5) {
    // Glass edge: light pipes along the thickness and picks up the green cast real edges have.
    vec3 env = textureLod(uEnvCube, reflect(-V, N), 1.6).rgb * uEnvIntensity;
    float f = fresnelDielectric(cosI, 1.0 / ${GLASS_IOR.toFixed(2)});
    col = vec3(0.028, 0.082, 0.064) + env * vec3(0.35, 0.80, 0.68) * (0.45 + 0.55 * f);
  } else {
    float r = fresnelDielectric(cosI, 1.0 / ${GLASS_IOR.toFixed(2)});
    float R = 2.0 * r / (1.0 + r);                       // two parallel interfaces, incoherent
    vec3 env = textureLod(uEnvCube, reflect(-V, N), 0.6).rgb * uEnvIntensity;
    vec3 dir = -V;
    vec3 T;
    // Does the eye ray cross the water surface beyond this pane (dry pane above the waterline,
    // or a wet pane looked through from below the surface)?
    vec3 S = vec3(0.0);
    bool waterBehind = false;
    if (abs(dir.y) > 1e-4) {
      float th = (uWaterLevel - vWorld.y) / dir.y;
      if (th > 0.0) {
        S = vWorld + dir * th;
        waterBehind = S.x > uInner.x && S.x < uInner.y && S.z > uInner.z && S.z < uInner.w;
      }
    }
    if (waterBehind) {
      float sDepth = -((viewMatrix * vec4(S, 1.0)).z);
      T = shadeWaterSurface(S, V, suv, sDepth);
    } else {
      float paneDepth = -vView.z;
      float bgDepth = texture2D(uSceneCopy, suv).a;
      // Thin-pane refraction: the ray bends inside the glass, then continues straight.
      vec3 R = refract(-V, N, 1.0 / ${GLASS_IOR.toFixed(2)});
      vec3 Rv = normalize((viewMatrix * vec4(R, 0.0)).xyz);
      vec3 dv = (viewMatrix * vec4(dir, 0.0)).xyz;
      float path = clamp(bgDepth - paneDepth, 0.0, uMaxPath);
      float tIn = min(uThickness / max(-dv.z, 0.15), path);
      vec3 q = vView + Rv * (tIn / max(-Rv.z, 0.1)) + dv * ((path - tIn) / max(-dv.z, 0.15));
      vec4 cp = uProj * vec4(q, 1.0);
      vec2 cand = cp.xy / cp.w * 0.5 + 0.5;
      vec2 m = edgeFade(cand, 0.01);
      cand = mix(suv, cand, m.x * m.y);
      if (texture2D(uSceneCopy, cand).a < paneDepth + 0.02) cand = suv;
      vec3 bg = texture2D(uSceneCopy, cand).rgb;
      // Light reached this pane through water when the pane is below the waterline.
      float wet = 1.0 - step(uWaterLevel, vWorld.y);
      vec3 atten = exp(-uAbsorb * (wet * path));
      T = bg * atten + uScatter * (1.0 - atten.r);
    }
    col = T * (1.0 - R) * vec3(0.972, 0.998, 0.988) + env * R;
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const WATER_VS = /* glsl */`
${WATER_GLSL}
varying vec3 vWorld;
varying vec3 vView;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  wp.y += waveHeight(wp.xz, uTime);
  vWorld = wp.xyz;
  vec4 vp = viewMatrix * wp;
  vView = vp.xyz;
  gl_Position = projectionMatrix * vp;
}`;

const WATER_FS = /* glsl */`
${WATER_GLSL}
${OPTIC_COMMON_GLSL}
varying vec3 vWorld;
varying vec3 vView;
void main() {
  vec2 suv = gl_FragCoord.xy / uResolution;
  vec3 V = normalize(cameraPosition - vWorld);
  gl_FragColor = vec4(shadeWaterSurface(vWorld, V, suv, -vView.z), 1.0);
}`;

function paneMaterial(shared, mainNormal, thickness) {
  return new THREE.ShaderMaterial({
    uniforms: { ...shared, uMainNormal: { value: mainNormal.clone() }, uEntry: { value: 1 }, uThickness: { value: thickness } },
    vertexShader: PANE_VS,
    fragmentShader: PANE_FS,
    side: THREE.FrontSide,
    depthTest: true,
    depthWrite: true,
  });
}

function createTank(optics) {
  const group = new THREE.Group();
  group.name = 'tank';
  const shared = optics.shared;
  const { w, h, d, t } = TANK;
  const panes = [];

  // --- five glass panels ---------------------------------------------------------------------
  const addPane = (name, geo, pos, mainNormal, outward) => {
    const mesh = new THREE.Mesh(geo, paneMaterial(shared, mainNormal, t));
    mesh.name = name;
    mesh.position.copy(pos);
    mesh.renderOrder = 1;
    group.add(mesh);
    panes.push(mesh);
    optics.addOptic(mesh, pos.clone(), outward);
    return mesh;
  };
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  addPane('glass-front', new THREE.BoxGeometry(w, h, t), V3(0, h / 2, TANK.zMax - t / 2), V3(0, 0, 1), V3(0, 0, 1));
  addPane('glass-back', new THREE.BoxGeometry(w, h, t), V3(0, h / 2, TANK.zMin + t / 2), V3(0, 0, 1), V3(0, 0, -1));
  addPane('glass-left', new THREE.BoxGeometry(t, h, d - 2 * t), V3(TANK.xMin + t / 2, h / 2, 0), V3(1, 0, 0), V3(-1, 0, 0));
  addPane('glass-right', new THREE.BoxGeometry(t, h, d - 2 * t), V3(TANK.xMax - t / 2, h / 2, 0), V3(1, 0, 0), V3(1, 0, 0));
  addPane('glass-bottom', new THREE.BoxGeometry(w, t, d), V3(0, -t / 2, 0), V3(0, 1, 0), V3(0, -1, 0));

  // --- silicone seams in the inner vertical corners -----------------------------------------
  const seamMat = new THREE.MeshStandardMaterial({ color: 0x161c20, roughness: 0.55, metalness: 0.05, transparent: true, opacity: 0.92 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.045, h - 0.05, 0.045), seamMat);
    seam.position.set(sx * (Math.abs(TANK.ixMin) - 0.022), (h - 0.05) / 2, sz * (TANK.izMax - 0.022));
    seam.renderOrder = 4;
    group.add(seam);
  }

  // --- water surface ---------------------------------------------------------------------------
  const waterGeo = new THREE.PlaneGeometry(TANK.ixMax - TANK.ixMin, TANK.izMax - TANK.izMin, 180, 90);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.ShaderMaterial({
    uniforms: { ...shared },
    vertexShader: WATER_VS,
    fragmentShader: WATER_FS,
    side: THREE.DoubleSide,
    depthTest: true,
    depthWrite: true,
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.name = 'water-surface';
  water.position.set(0, TANK.waterLevel, 0);
  water.frustumCulled = false;
  water.renderOrder = 2;
  group.add(water);
  optics.addOptic(water, V3(0, TANK.waterLevel, 0), V3(0, 1, 0));

  // --- waterline: a thin bright meniscus line against each pane -----------------------------
  const lineMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.42, 0.66, 0.74), transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
  const lineH = 0.035;
  const lines = [
    [TANK.ixMax - TANK.ixMin, lineH, 0, TANK.waterLevel + 0.012, TANK.izMax - 0.004],
    [TANK.ixMax - TANK.ixMin, lineH, 0, TANK.waterLevel + 0.012, TANK.izMin + 0.004],
    [TANK.izMax - TANK.izMin, lineH, TANK.ixMin + 0.004, TANK.waterLevel + 0.012, 0, true],
    [TANK.izMax - TANK.izMin, lineH, TANK.ixMax - 0.004, TANK.waterLevel + 0.012, 0, true],
  ];
  for (const [lw, lh, x, y, z, rotY] of lines) {
    const line = new THREE.Mesh(new THREE.PlaneGeometry(lw, lh), lineMat);
    line.position.set(x, y, z);
    if (rotY) line.rotation.y = Math.PI / 2;
    line.renderOrder = 5;
    group.add(line);
  }

  // --- bottom frame (matte black, slightly proud of the glass) and narrow upper rim ---------
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x121417, roughness: 0.72, metalness: 0.25, envMapIntensity: 0.5 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x0f1114, roughness: 0.5, metalness: 0.45, envMapIntensity: 0.7 });
  const frame = new THREE.Group();
  frame.name = 'frame';
  const fw = 0.16, fh = 0.44, fy = 0.07 - fh / 2;      // top of frame 0.07 above the inner floor
  const ox = w / 2 + 0.035, oz = d / 2 + 0.035;        // outer frame extents
  const bar = (sx, sy, sz, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), frameMat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; frame.add(m); };
  bar(w + 0.07, fh, fw, 0, fy, oz - fw / 2);
  bar(w + 0.07, fh, fw, 0, fy, -oz + fw / 2);
  bar(fw, fh, d + 0.07 - 2 * fw, ox - fw / 2, fy, 0);
  bar(fw, fh, d + 0.07 - 2 * fw, -ox + fw / 2, fy, 0);
  bar(w + 0.07, 0.05, d + 0.07, 0, fy - fh / 2 + 0.025, 0);   // plate under the bottom pane
  // upper rim: four slim bars capping the glass edges
  const rw = 0.14, rh = 0.16, ry = h - 0.06 + rh / 2;      // overlaps the top 0.06 of the glass
  const rbar = (sx, sy, sz, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), rimMat); m.position.set(x, y, z); m.castShadow = true; frame.add(m); };
  rbar(w + 0.06, rh, rw, 0, ry, d / 2 + 0.03 - rw / 2);
  rbar(w + 0.06, rh, rw, 0, ry, -d / 2 - 0.03 + rw / 2);
  rbar(rw, rh, d - 2 * rw + 0.06, w / 2 + 0.03 - rw / 2, ry, 0);
  rbar(rw, rh, d - 2 * rw + 0.06, -w / 2 - 0.03 + rw / 2, ry, 0);
  group.add(frame);

  return { group, panes, water, frame };
}


// ─────────────────────────── 55_enhance.js ───────────────────────────
// Shared material enhancements: caustic light from the water above, plus optional vertex
// deformation and procedural colour injected into any MeshStandard/Physical material.

let materialSeq = 0;
const CAUSTIC_STRENGTH_UNIFORMS = [];   // every uCausticStrength uniform object (dev tuning)

const CAUSTIC_INJECT = /* glsl */`
getDirectionalLightInfo( directionalLight, directLight );
#if ( UNROLLED_LOOP_INDEX == 0 )
{
  float causDepth = max( uWaterLevel - vCausWorld.y, 0.0 );
  float caus = causticLight( vCausWorld.xz, uTime, causDepth );
  vec3 causWorldN = inverseTransformDirection( geometryNormal, viewMatrix );     // geometryNormal is view-space
  float causUp = 0.12 + 0.88 * saturate( causWorldN.y );
  float causOn = step( vCausWorld.y, uWaterLevel );
  float causV = clamp( caus - 1.0, -0.25, 2.5 );
  directLight.color *= 1.0 + 1.1 * causV * causUp * causOn * uCausticStrength;
}
#endif`;

// opts: { id, uniforms, caustics, vertexHead, vertexNormal, vertexBody, fragmentHead,
//         fragmentColor, fragmentRough, fragmentEmissive, varyWorld }
function enhanceMaterial(material, opts = {}) {
  const id = opts.id || ('m' + (materialSeq++));
  const caustics = opts.caustics ?? 0;
  const wantWorld = caustics > 0 || !!opts.varyWorld;
  const uniforms = Object.assign({}, opts.uniforms || {});
  if (caustics > 0) { Object.assign(uniforms, SIM_UNIFORMS); uniforms.uCausticStrength = { value: caustics, base: caustics }; CAUSTIC_STRENGTH_UNIFORMS.push(uniforms.uCausticStrength); }

  const worldCode = /* glsl */`
{
  vec4 aqW = vec4( transformed, 1.0 );
  #ifdef USE_INSTANCING
    aqW = instanceMatrix * aqW;
  #endif
  vCausWorld = ( modelMatrix * aqW ).xyz;
}`;
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    let vs = shader.vertexShader;
    if (wantWorld) vs = vs.replace('#include <common>', '#include <common>\nvarying vec3 vCausWorld;');
    if (opts.vertexHead) vs = vs.replace('#include <common>', '#include <common>\n' + opts.vertexHead);
    if (opts.vertexNormal) vs = vs.replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n' + opts.vertexNormal);
    if (opts.vertexBody) vs = vs.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + opts.vertexBody);
    if (wantWorld) vs = vs.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n' + worldCode);
    shader.vertexShader = vs;

    let fs = shader.fragmentShader;
    if (wantWorld) fs = fs.replace('#include <common>', '#include <common>\nvarying vec3 vCausWorld;');
    if (caustics > 0) fs = fs.replace('#include <common>', '#include <common>\n' + WATER_GLSL + '\nuniform float uCausticStrength;');
    if (opts.fragmentHead) fs = fs.replace('#include <common>', '#include <common>\n' + opts.fragmentHead);
    if (opts.fragmentColor) fs = fs.replace('#include <color_fragment>', '#include <color_fragment>\n' + opts.fragmentColor);
    if (opts.fragmentRough) fs = fs.replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' + opts.fragmentRough);
    if (opts.fragmentEmissive) fs = fs.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + opts.fragmentEmissive);
    // Includes are still unexpanded at this point: splice the caustics into the light loop chunk.
    if (caustics > 0) fs = fs.replace('#include <lights_fragment_begin>', () => THREE.ShaderChunk.lights_fragment_begin.replace('getDirectionalLightInfo( directionalLight, directLight );', () => CAUSTIC_INJECT));
    shader.fragmentShader = fs;
  };
  material.customProgramCacheKey = () => 'aq-' + id;
  return material;
}

// Depth (shadow) material that applies the same vertex deformation as the surface material.
function deformedDepthMaterial(opts) {
  const m = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: opts.side ?? THREE.FrontSide });
  const uniforms = Object.assign({}, opts.uniforms || {});
  m.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    let vs = shader.vertexShader;
    if (opts.vertexHead) vs = vs.replace('#include <common>', '#include <common>\n' + opts.vertexHead);
    if (opts.vertexBody) vs = vs.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + opts.vertexBody);
    shader.vertexShader = vs;
  };
  m.customProgramCacheKey = () => 'aq-depth-' + (opts.id || (materialSeq++));
  return m;
}


// ─────────────────────────── 60_filter.js ───────────────────────────
// Stage 3 — black internal sponge filter with airlift, airline hose, and its bubble plume.

function buildSpongeGeometry(half, height, grooves = 7) {
  const rings = 48, radial = 56, n = 4.5;
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= rings; j++) {
    const v = j / rings, y = v * height;
    const groove = 1 - 0.05 * Math.pow(0.5 + 0.5 * Math.cos(v * Math.PI * 2 * grooves), 1.5);
    const taper = 1 - 0.10 * smoothstep(0.9, 1.0, v);
    for (let i = 0; i <= radial; i++) {
      const u = i / radial, a = u * TWO_PI;
      const ca = Math.cos(a), sa = Math.sin(a);
      const r = half * groove * taper / Math.pow(Math.pow(Math.abs(ca), n) + Math.pow(Math.abs(sa), n), 1 / n);
      pos.push(r * ca, y, r * sa); uv.push(u, v);
    }
  }
  for (let j = 0; j < rings; j++) for (let i = 0; i < radial; i++) {
    const a = j * (radial + 1) + i, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const center = pos.length / 3; pos.push(0, height, 0); uv.push(0.5, 1);
  const topStart = rings * (radial + 1);
  for (let i = 0; i < radial; i++) idx.push(center, topStart + i, topStart + i + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Rescales box / cylinder UVs so that one texture tile spans one world unit on every part.
function applyUnitUV(geometry, kind) {
  geometry.computeBoundingBox();
  const s = new THREE.Vector3(); geometry.boundingBox.getSize(s);
  const uv = geometry.attributes.uv;
  if (kind === 'cyl') {
    const circ = Math.PI * (s.x + s.z);
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * circ, uv.getY(i) * s.y);
  } else {
    // BoxGeometry vertex order: +x, -x, +y, -y, +z, -z (4 vertices each)
    const dims = [[s.z, s.y], [s.z, s.y], [s.x, s.z], [s.x, s.z], [s.x, s.y], [s.x, s.y]];
    for (let i = 0; i < uv.count; i++) { const f = Math.floor(i / 4) % 6; uv.setXY(i, uv.getX(i) * dims[f][0], uv.getY(i) * dims[f][1]); }
  }
  uv.needsUpdate = true;
  return geometry;
}

const FILTER_OUTLET_LOCAL = new THREE.Vector3(-0.33, 2.15, 0);

function createFilter(parent, env) {
  const group = new THREE.Group();
  group.name = 'filter';
  const plastic = new THREE.MeshStandardMaterial({ color: 0x1b1d21, roughness: 0.42, metalness: 0.2, envMapIntensity: 0.8 });
  const sponge = new THREE.MeshStandardMaterial({ color: 0x4a4a4e, roughness: 0.96, metalness: 0, map: spongeTexture(256, 5) });
  enhanceMaterial(plastic, { id: 'filter-plastic', caustics: 0.7 });
  enhanceMaterial(sponge, { id: 'filter-sponge', caustics: 0.9 });

  const add = (geo, mat, x, y, z, rot) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
    m.castShadow = true; m.receiveShadow = true;
    group.add(m); return m;
  };
  // weighted base, sponge body, top plate
  add(new THREE.BoxGeometry(0.64, 0.1, 0.64), plastic, 0, 0.05, 0);
  add(buildSpongeGeometry(0.25, 0.92), sponge, 0, 0.1, 0);
  add(new THREE.CylinderGeometry(0.27, 0.27, 0.06, 32), plastic, 0, 1.05, 0);
  // airlift tube + elbow + horizontal outlet
  add(new THREE.CylinderGeometry(0.055, 0.055, 1.0, 24), plastic, 0, 1.55, 0);
  add(new THREE.TorusGeometry(0.1, 0.055, 16, 18, Math.PI / 2), plastic, -0.1, 2.05, 0);
  add(new THREE.CylinderGeometry(0.055, 0.055, 0.22, 24), plastic, -0.21, 2.15, 0, [0, 0, Math.PI / 2]);
  const lip = add(new THREE.RingGeometry(0.036, 0.058, 24), plastic, -0.321, 2.15, 0, [0, -Math.PI / 2, 0]);
  lip.castShadow = false;
  const bore = new THREE.Mesh(new THREE.CircleGeometry(0.036, 24), new THREE.MeshBasicMaterial({ color: 0x040506 }));
  bore.rotation.y = -Math.PI / 2; bore.position.set(-0.30, 2.15, 0);
  group.add(bore);
  // airline nipple on the tube
  add(new THREE.CylinderGeometry(0.018, 0.018, 0.1, 10), plastic, 0.08, 1.12, 0, [0, 0, -Math.PI / 2 + 0.35]);

  const outlet = new THREE.Object3D();
  outlet.position.copy(FILTER_OUTLET_LOCAL);
  group.add(outlet);

  // placement
  const fx = LAYOUT.filter.x, fz = LAYOUT.filter.z;
  const baseY = substrateHeight(fx, fz) - 0.02;
  group.position.set(fx, baseY, fz);
  group.rotation.y = 0.35;
  group.updateMatrixWorld(true);
  parent.add(group);
  group.updateMatrixWorld(true);

  // airline hose routed in world space: up the tube, along the back glass, over the rear rim.
  const nipple = group.localToWorld(new THREE.Vector3(0.12, 1.12, 0));
  const glassZ = TANK.izMin + 0.022;          // hose radius 0.02 against the inner face
  const hx = nipple.x;
  const pts = [
    nipple,
    new THREE.Vector3(hx + 0.02, 1.45, nipple.z - 0.02),
    new THREE.Vector3(hx, 2.3, fz - 0.25),
    new THREE.Vector3(hx, 2.95, fz - 0.55),
    new THREE.Vector3(hx, 3.4, glassZ),
    new THREE.Vector3(hx, 4.3, glassZ),
    new THREE.Vector3(hx, 4.95, glassZ + 0.03),
    new THREE.Vector3(hx, 5.18, glassZ - 0.02),
    new THREE.Vector3(hx, 5.22, glassZ - 0.12),
    new THREE.Vector3(hx, 5.0, glassZ - 0.17),
    new THREE.Vector3(hx, 4.2, glassZ - 0.17),
  ];
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
  const hoseMat = new THREE.MeshStandardMaterial({ color: 0x6b737a, roughness: 0.35, metalness: 0.05, transparent: true, opacity: 0.9 });
  const hose = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 0.02, 10, false), hoseMat);
  hose.castShadow = true;
  parent.add(hose);
  // suction cups holding the hose to the glass
  const cupMat = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, roughness: 0.3, metalness: 0.0, transparent: true, opacity: 0.8 });
  for (const cy of [3.7, 4.5]) {
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.025, 20), cupMat);
    cup.rotation.x = Math.PI / 2;
    cup.position.set(hx, cy, TANK.izMin + 0.0125);
    parent.add(cup);
    const clip = new THREE.Mesh(new THREE.TorusGeometry(0.026, 0.008, 8, 16), cupMat);
    clip.position.set(hx, cy, glassZ);
    parent.add(clip);
  }

  // bubbles leave the outlet along its axis
  const outletWorld = new THREE.Vector3();
  outlet.getWorldPosition(outletWorld);
  const outletDir = new THREE.Vector3(-1, 0.25, 0).normalize().transformDirection(group.matrixWorld);
  PLUME.copy(outletWorld);
  SIM_UNIFORMS.uPlume.value.copy(PLUME);

  // collision volume for fish / crab
  const obstacle = new THREE.Box3().setFromObject(group).expandByScalar(0.12);

  return { group, outlet, outletWorld, outletDir, obstacle };
}



// ─────────────────────────── 61_bubbles.js ───────────────────────────
// --- bubbles ------------------------------------------------------------------------------------
// Instanced pool; inactive slots simply have radius 0 (degenerate, never rasterised).
const BUBBLE_VS = /* glsl */`
uniform float uTime;
attribute vec3 aInstPos;
attribute float aInstRad;
attribute float aInstSeed;
varying vec3 vN;
varying vec3 vWorld;
void main() {
  float wob = sin(uTime * 11.0 + aInstSeed * 37.0);
  vec3 p = position * aInstRad;
  p.x *= 1.0 + 0.07 * wob;
  p.z *= 1.0 - 0.07 * wob;
  vec3 wp = aInstPos + p;
  vN = normalize(position);
  vWorld = wp;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}`;

const BUBBLE_FS = /* glsl */`
uniform samplerCube uEnvCube;
uniform vec3 uKeyDir;
varying vec3 vN;
varying vec3 vWorld;
void main() {
  vec3 n = normalize(vN);
  vec3 v = normalize(cameraPosition - vWorld);
  float ndv = clamp(dot(n, v), 0.0, 1.0);
  float rim = pow(1.0 - ndv, 2.4);                      // thin film: bright curved rim, clear centre
  vec3 env = textureLod(uEnvCube, reflect(-v, n), 2.2).rgb;
  float spec = pow(clamp(dot(n, normalize(uKeyDir + v)), 0.0, 1.0), 140.0);   // key-light glint
  float spec2 = pow(clamp(dot(n, normalize(-uKeyDir * vec3(1.0, -1.0, 1.0) + v)), 0.0, 1.0), 40.0) * 0.45;  // refracted glint
  vec3 col = env * rim * 1.8 + vec3(0.72, 0.88, 1.0) * rim * 0.55 + vec3(1.0, 0.98, 0.95) * (spec * 2.2 + spec2);
  float alpha = clamp(rim * 0.95 + spec + spec2 * 0.7 + 0.08, 0.0, 1.0);
  gl_FragColor = vec4(col + vec3(0.02, 0.05, 0.07), alpha);
}`;

class BubbleSystem {
  constructor(parent, env, lights, count = 256) {
    this.count = count;
    this.pos = new Float32Array(count * 3);
    this.vel = new Float32Array(count * 3);
    this.rad = new Float32Array(count);
    this.age = new Float32Array(count);
    this.seed = new Float32Array(count);
    this.active = new Uint8Array(count);
    this.alive = 0;
    this.rng = new Rng(99);
    this.emitAcc = 0;
    this.nextEmit = 0.08;
    this.rate = 15;                  // bubbles per second
    this.source = new THREE.Vector3(0, 2, 0);
    this.dir = new THREE.Vector3(-1, 0.2, 0);
    this._cur = new THREE.Vector3();

    const base = new THREE.SphereGeometry(1, 12, 9);
    const geo = new THREE.InstancedBufferGeometry();
    geo.index = base.index;
    geo.setAttribute('position', base.attributes.position);
    geo.setAttribute('normal', base.attributes.normal);
    this.aPos = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3).setUsage(THREE.DynamicDrawUsage);
    this.aRad = new THREE.InstancedBufferAttribute(new Float32Array(count), 1).setUsage(THREE.DynamicDrawUsage);
    const aSeed = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
    for (let i = 0; i < count; i++) aSeed.setX(i, this.rng.float());
    geo.setAttribute('aInstPos', this.aPos);
    geo.setAttribute('aInstRad', this.aRad);
    geo.setAttribute('aInstSeed', aSeed);
    geo.instanceCount = count;

    const mat = new THREE.ShaderMaterial({
      uniforms: { ...SIM_UNIFORMS, uEnvCube: { value: env.cube }, uKeyDir: { value: lights.keyDir } },
      vertexShader: BUBBLE_VS,
      fragmentShader: BUBBLE_FS,
      transparent: true,
      depthWrite: false,
      depthTest: true,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.name = 'bubbles';
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 20;
    parent.add(this.mesh);
    SIM.add((dt, t) => this.update(dt, t));
  }

  setSource(origin, dir, rate) {
    this.source.copy(origin);
    this.dir.copy(dir).normalize();
    if (rate) this.rate = rate;
  }

  spawn() {
    let slot = -1;
    for (let i = 0; i < this.count; i++) { if (!this.active[i]) { slot = i; break; } }
    if (slot < 0) return;
    const r = this.rng.float() < 0.1 ? this.rng.range(0.04, 0.058) : this.rng.range(0.014, 0.034);
    const i3 = slot * 3;
    this.pos[i3] = this.source.x + this.rng.gauss() * 0.02;
    this.pos[i3 + 1] = this.source.y + this.rng.gauss() * 0.02;
    this.pos[i3 + 2] = this.source.z + this.rng.gauss() * 0.02;
    const kick = this.rng.range(0.35, 0.6);
    this.vel[i3] = this.dir.x * kick + this.rng.gauss() * 0.12;
    this.vel[i3 + 1] = this.dir.y * kick + this.rng.gauss() * 0.08;
    this.vel[i3 + 2] = this.dir.z * kick + this.rng.gauss() * 0.12;
    this.rad[slot] = r; this.age[slot] = 0; this.seed[slot] = this.rng.float(); this.active[slot] = 1;
    this.alive++;
  }

  update(dt, t) {
    // irregular emission: random inter-arrival times, occasional double releases
    this.emitAcc += dt;
    while (this.emitAcc >= this.nextEmit) {
      this.emitAcc -= this.nextEmit;
      this.nextEmit = this.rng.range(0.025, 1.6 / this.rate);
      this.spawn();
      if (this.rng.float() < 0.18) this.spawn();
    }
    const y0 = this.source.y, H = TANK.waterLevel - y0;
    for (let i = 0; i < this.count; i++) {
      if (!this.active[i]) continue;
      const i3 = i * 3;
      const r = this.rad[i];
      this.age[i] += dt;
      const x = this.pos[i3], y = this.pos[i3 + 1], z = this.pos[i3 + 2];
      // buoyancy: terminal rise grows with radius; the shared updraft accelerates the plume core
      const vTerm = 0.55 + 9.0 * r;
      currentField(x, y, z, t, this._cur);
      this.vel[i3 + 1] = damp(this.vel[i3 + 1], vTerm + this._cur.y, 3.0, dt);
      // lateral: initial kick decays, wobble widens with height, plus the ambient current
      const hFrac = clamp((y - y0) / H, 0, 1);
      const w = 0.05 + 0.16 * hFrac;
      const ph = this.seed[i] * 20.0;
      const om = 5.0 + 6.0 * this.seed[i];
      const wobX = Math.sin(this.age[i] * om + ph) * w, wobZ = Math.cos(this.age[i] * om * 1.17 + ph) * w;
      this.vel[i3] = damp(this.vel[i3], wobX + this._cur.x, 2.2, dt);
      this.vel[i3 + 2] = damp(this.vel[i3 + 2], wobZ + this._cur.z, 2.2, dt);
      let nx = x + this.vel[i3] * dt, ny = y + this.vel[i3 + 1] * dt, nz = z + this.vel[i3 + 2] * dt;
      const nr = r + dt * 0.0035;          // expand subtly on the way up, never shrink
      // the animated surface is the end of the journey
      const surf = waveHeightAt(nx, nz, t);
      if (ny + r * 0.5 >= surf) {
        this.active[i] = 0; this.alive--;
        spawnRipple(nx, nz, t, clamp(r / 0.03, 0.4, 1.8));
        this.aRad.setX(i, 0);
        continue;
      }
      // stay inside the glass
      nx = clamp(nx, TANK.ixMin + r, TANK.ixMax - r);
      nz = clamp(nz, TANK.izMin + r, TANK.izMax - r);
      this.pos[i3] = nx; this.pos[i3 + 1] = ny; this.pos[i3 + 2] = nz;
      this.rad[i] = nr;
      this.aPos.setXYZ(i, nx, ny, nz);
      this.aRad.setX(i, nr);
    }
    this.aPos.needsUpdate = true;
    this.aRad.needsUpdate = true;
  }
}


// ─────────────────────────── 80_pebbles.js ───────────────────────────
// Stage 4 — substrate layer, instanced pebble bed and larger accent stones.

function makePebbleGeometry(seed, detail = 2) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const noise = makeNoise2D(seed);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = fbm(noise, v.x * 1.2 + v.z * 0.6 + 4, v.y * 1.1 + v.z * 0.9 + 7, 3);
    const r = 1 + 0.13 * n;
    pos.setXYZ(i, v.x * r, v.y * r, v.z * r);
  }
  const merged = BufferGeometryUtils.mergeVertices(g, 1e-4);
  merged.computeVertexNormals();
  g.dispose();
  return merged;
}

function weightedPick(rng, items, weights) {
  let r = rng.float(), acc = 0;
  for (let i = 0; i < items.length; i++) { acc += weights[i]; if (r <= acc) return items[i]; }
  return items[items.length - 1];
}

const ACCENT_STONES = [];   // { x, z, cy, r, ry } — also used by the simplified ground query

function createPebbleBed(parent) {
  const rng = new Rng(4242);
  const innerW = TANK.ixMax - TANK.ixMin, innerD = TANK.izMax - TANK.izMin;

  // --- continuous substrate layer ---------------------------------------------------------------
  const subGeo = new THREE.PlaneGeometry(innerW, innerD, 150, 76);
  subGeo.rotateX(-Math.PI / 2);
  const sp = subGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) sp.setY(i, substrateHeight(sp.getX(i), sp.getZ(i)));
  subGeo.computeVertexNormals();
  const subMat = new THREE.MeshStandardMaterial({ map: gravelTexture(512, 3), color: 0xb8aa94, roughness: 0.95, metalness: 0 });
  enhanceMaterial(subMat, { id: 'substrate', caustics: 1.0 });
  const substrate = new THREE.Mesh(subGeo, subMat);
  substrate.name = 'substrate';
  substrate.receiveShadow = true;
  parent.add(substrate);

  // --- pebbles ------------------------------------------------------------------------------------
  const shapes = [];
  for (let i = 0; i < 6; i++) shapes.push(makePebbleGeometry(100 + i, 2));
  const mottle = mottleTexture(256, 3, { lo: 0.72, hi: 1.06 });
  const pebbleMat = new THREE.MeshStandardMaterial({ map: mottle, roughness: 0.8, metalness: 0.02 });
  enhanceMaterial(pebbleMat, {
    id: 'pebble', caustics: 1.0,
    vertexHead: 'varying float vLocalY;', vertexBody: 'vLocalY = position.y;',
    fragmentHead: 'varying float vLocalY;',
    // baked contact darkening toward each stone's underside
    fragmentColor: 'diffuseColor.rgb *= mix(0.42, 1.0, smoothstep(-1.0, 0.35, vLocalY));',
  });
  const palette = [[0.80, 0.72, 0.60], [0.54, 0.56, 0.59], [0.23, 0.24, 0.26], [0.50, 0.40, 0.31], [0.88, 0.86, 0.80], [0.66, 0.59, 0.50]];
  const weights = [0.28, 0.22, 0.12, 0.18, 0.08, 0.12];
  const target = 560, perShape = Math.ceil(target / shapes.length);
  const meshes = shapes.map((geo) => {
    const im = new THREE.InstancedMesh(geo, pebbleMat, perShape);
    im.castShadow = true; im.receiveShadow = true; im.name = 'pebbles';
    parent.add(im);
    return im;
  });
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), s = new THREE.Vector3(), c = new THREE.Color();
  const placed = [];
  const perMeshCount = new Array(shapes.length).fill(0);
  let count = 0, tries = 0;
  while (count < target && tries < 40000) {
    tries++;
    const x = rng.range(TANK.ixMin + 0.06, TANK.ixMax - 0.06), z = rng.range(TANK.izMin + 0.06, TANK.izMax - 0.06);
    const baseR = rng.float() < 0.12 ? rng.range(0.11, 0.15) : rng.range(0.045, 0.1);
    let ok = true;
    for (let k = 0; k < placed.length; k++) {
      const o = placed[k];
      if (Math.hypot(o.x - x, o.z - z) < (o.r + baseR) * 0.78) { ok = false; break; }
    }
    if (!ok) continue;
    placed.push({ x, z, r: baseR });
    const sy = baseR * rng.range(0.5, 0.75), sx = baseR * rng.range(0.85, 1.1), sz = baseR * rng.range(0.8, 1.1);
    p.set(x, substrateHeight(x, z) + sy * 0.32, z);     // settled into the substrate
    e.set(rng.range(0, Math.PI), rng.range(0, Math.PI), rng.range(0, Math.PI)); q.setFromEuler(e); s.set(sx, sy, sz);
    m.compose(p, q, s);
    const mi = count % shapes.length, idx = Math.floor(count / shapes.length);
    meshes[mi].setMatrixAt(idx, m);
    const col = weightedPick(rng, palette, weights);
    c.setRGB(col[0], col[1], col[2]).multiplyScalar(rng.range(0.85, 1.12));
    meshes[mi].setColorAt(idx, c);
    perMeshCount[mi]++;
    count++;
  }
  for (let i = 0; i < meshes.length; i++) {
    meshes[i].count = perMeshCount[i];
    meshes[i].instanceMatrix.needsUpdate = true;
    if (meshes[i].instanceColor) meshes[i].instanceColor.needsUpdate = true;
  }

  // --- larger accent stones (placed by layout, kept off the creature routes) -------------------
  const stoneMat = new THREE.MeshStandardMaterial({ map: mottleTexture(256, 8, { lo: 0.6, hi: 1.05, tint: [0.9, 0.95, 1.0] }), roughness: 0.85, metalness: 0.02 });
  enhanceMaterial(stoneMat, { id: 'stone', caustics: 1.0, vertexHead: 'varying float vLocalY;', vertexBody: 'vLocalY = position.y;', fragmentHead: 'varying float vLocalY;', fragmentColor: 'diffuseColor.rgb *= mix(0.45, 1.0, smoothstep(-1.0, 0.3, vLocalY));' });
  const bigShape = makePebbleGeometry(777, 3);
  const stoneMesh = new THREE.InstancedMesh(bigShape, stoneMat, LAYOUT.stones.length);
  stoneMesh.castShadow = true; stoneMesh.receiveShadow = true; stoneMesh.name = 'accent-stones';
  const stonePalette = [[0.56, 0.58, 0.6], [0.36, 0.37, 0.39], [0.68, 0.62, 0.54], [0.72, 0.70, 0.66]];
  LAYOUT.stones.forEach((st, i) => {
    const ry = st.r * st.squash;
    const h = substrateHeight(st.x, st.z);
    const cy = h + ry * 0.55;
    p.set(st.x, cy, st.z);
    e.set(rng.range(-0.2, 0.2), rng.range(0, Math.PI), rng.range(-0.2, 0.2)); q.setFromEuler(e);
    s.set(st.r, ry, st.r * rng.range(0.85, 1.0));
    m.compose(p, q, s);
    stoneMesh.setMatrixAt(i, m);
    const col = stonePalette[i % stonePalette.length];
    stoneMesh.setColorAt(i, c.setRGB(col[0], col[1], col[2]));
    ACCENT_STONES.push({ x: st.x, z: st.z, cy, r: st.r, ry, index: i });
  });
  stoneMesh.instanceMatrix.needsUpdate = true;
  stoneMesh.instanceColor.needsUpdate = true;
  parent.add(stoneMesh);

  return { substrate, meshes, count, stoneMesh };
}

// Simplified ground surface for bottom animals: substrate plus the tops of the accent stones.
function groundHeightAt(x, z) {
  let h = substrateHeight(x, z);
  for (let i = 0; i < ACCENT_STONES.length; i++) {
    const st = ACCENT_STONES[i];
    const dx = x - st.x, dz = z - st.z;
    const rr = st.r * 0.95;
    const d2 = dx * dx + dz * dz;
    if (d2 < rr * rr) {
      const top = st.cy + st.ry * Math.sqrt(1 - d2 / (rr * rr));
      if (top > h) h = top;
    }
  }
  return h;
}


// ─────────────────────────── 85_castle.js ───────────────────────────
// Stage 5 — a weathered miniature stone castle ornament with a real arched gateway.

function weatherCylinder(geo, amount, seed) {
  const noise = makeNoise2D(seed);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = Math.atan2(v.z, v.x);
    const n = fbm(noise, Math.cos(a) * 2 + 3, v.y * 3 + Math.sin(a) * 2, 2);
    const k = 1 + amount * n;
    pos.setXYZ(i, v.x * k, v.y, v.z * k);
  }
  geo.computeVertexNormals();
  return geo;
}

function createCastle(parent) {
  const group = new THREE.Group();
  group.name = 'castle';
  const stainNoise = makeNoise2D(555);
  const tex = stoneTexture(1024, 512, 11, { courses: 7, hue: 36, sat: 9, light: 54 });
  const stone = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88, metalness: 0, vertexColors: true });
  const stonePlain = new THREE.MeshStandardMaterial({ color: 0x9a9282, roughness: 0.9, metalness: 0 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x17150f, roughness: 0.95, metalness: 0 });
  enhanceMaterial(stone, { id: 'castle-stone', caustics: 1.0 });
  enhanceMaterial(stonePlain, { id: 'castle-plain', caustics: 1.0 });
  enhanceMaterial(dark, { id: 'castle-dark', caustics: 0.25 });

  const tmpColor = new THREE.Color();
  const stainBase = new THREE.Color(0.60, 0.76, 0.56);
  // Greenish / damp staining climbing up from the base, blotchy through noise.
  function applyStain(geo, baseY, height) {
    const pos = geo.attributes.position;
    const col = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i) + baseY;
      const n = 0.5 + 0.5 * fbm(stainNoise, pos.getX(i) * 3.1 + pos.getZ(i) * 2.3, y * 3.5 + 2, 2);
      const t = smoothstep(Math.min(0.9, height * 0.6), 0.02, y);
      tmpColor.setRGB(1, 1, 1).lerp(stainBase, t * (0.5 + 0.5 * n) * 0.8);
      col[i * 3] = tmpColor.r; col[i * 3 + 1] = tmpColor.g; col[i * 3 + 2] = tmpColor.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  }
  const parts = [];
  const addMesh = (geo, mat, x, y, z, ry = 0, height = 1) => {
    applyStain(geo, y, height);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.rotation.y = ry;
    m.castShadow = true; m.receiveShadow = true;
    group.add(m); parts.push(m);
    return m;
  };
  const box = (w, h, d) => applyUnitUV(new THREE.BoxGeometry(w, h, d), 'box');
  const cyl = (rt, rb, h, seg = 16, seed = 1) => weatherCylinder(applyUnitUV(new THREE.CylinderGeometry(rt, rb, h, seg, 6), 'cyl'), 0.012, seed);

  const Y0 = 0.22;   // top of the foundation slab
  // foundation slab, partly buried by the pebbles
  addMesh(box(2.7, 0.3, 2.0), stone, 0, 0.15, 0, 0, 0.3);

  // --- curtain wall with a true arched opening (the hole is cut into the extruded shape) -----
  const shape = new THREE.Shape();
  shape.moveTo(-1.25, 0); shape.lineTo(1.25, 0); shape.lineTo(1.25, 1.08); shape.lineTo(-1.25, 1.08); shape.closePath();
  const GX = 0.18, GW = 0.21, GH = 0.52;
  const gate = new THREE.Path();
  gate.moveTo(GX - GW, 0); gate.lineTo(GX - GW, GH);
  gate.absarc(GX, GH, GW, Math.PI, 0, true);
  gate.lineTo(GX + GW, 0); gate.closePath();
  shape.holes.push(gate);
  const wallGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.26, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.014, bevelSegments: 2, curveSegments: 18 });
  const frontWall = addMesh(wallGeo, stone, 0, Y0, 0.6, 0, 1.08);
  for (let i = 0; i < 7; i++) addMesh(box(0.18, 0.16, 0.26), stone, -1.17 + 0.09 + i * 0.36, Y0 + 1.08 + 0.08, 0.73, 0, 0.16);

  // --- towers --------------------------------------------------------------------------------------
  const crenellate = (cx, cz, radius, topY, n, w = 0.14, h = 0.2) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TWO_PI;
      addMesh(box(w, h, 0.11), stone, cx + Math.cos(a) * radius, topY + h / 2, cz + Math.sin(a) * radius, -a + Math.PI / 2, h);
    }
  };
  // keep (tallest), with a flared corbel ring under the battlement
  addMesh(cyl(0.44, 0.46, 0.3, 16, 1), stone, -0.55, Y0 + 0.15, -0.15, 0, 0.3);
  addMesh(cyl(0.41, 0.44, 1.95, 16, 2), stone, -0.55, Y0 + 0.3 + 0.975, -0.15, 0, 1.95);
  addMesh(cyl(0.49, 0.41, 0.12, 16, 3), stone, -0.55, Y0 + 2.25 + 0.06, -0.15, 0, 0.12);
  crenellate(-0.55, -0.15, 0.43, Y0 + 2.37, 10);
  // right tower
  addMesh(cyl(0.33, 0.36, 0.3, 14, 4), stone, 0.9, Y0 + 0.15, 0.15, 0, 0.3);
  addMesh(cyl(0.31, 0.34, 1.45, 14, 5), stone, 0.9, Y0 + 0.3 + 0.725, 0.15, 0, 1.45);
  addMesh(cyl(0.37, 0.31, 0.1, 14, 6), stone, 0.9, Y0 + 1.75 + 0.05, 0.15, 0, 0.1);
  crenellate(0.9, 0.15, 0.32, Y0 + 1.85, 8);
  // left-rear tower
  addMesh(cyl(0.3, 0.33, 0.3, 14, 7), stone, -1.0, Y0 + 0.15, -0.6, 0, 0.3);
  addMesh(cyl(0.28, 0.31, 1.15, 14, 8), stone, -1.0, Y0 + 0.3 + 0.575, -0.6, 0, 1.15);
  addMesh(cyl(0.34, 0.28, 0.1, 14, 9), stone, -1.0, Y0 + 1.45 + 0.05, -0.6, 0, 0.1);
  crenellate(-1.0, -0.6, 0.29, Y0 + 1.55, 8);

  // --- connecting walls ------------------------------------------------------------------------------
  addMesh(box(1.9, 0.95, 0.22), stone, -0.1, Y0 + 0.475, -0.88, 0, 0.95);
  for (let i = 0; i < 5; i++) addMesh(box(0.18, 0.15, 0.22), stone, -0.9 + 0.09 + i * 0.42, Y0 + 0.95 + 0.075, -0.88, 0, 0.15);
  addMesh(box(0.22, 0.7, 1.05), stone, -1.14, Y0 + 0.35, 0.0, 0, 0.7);      // ruined west wall
  addMesh(box(0.2, 0.3, 0.3), stone, -1.14, Y0 + 0.85, -0.3, 0.2, 0.3);     // broken stub
  addMesh(box(0.22, 0.82, 0.5), stone, 1.14, Y0 + 0.41, 0.32, 0, 0.82);      // east wall to the gate wall

  // --- recessed arched windows: a dark arch inside a lighter stone frame ---------------------------
  function archShape(w, h) {
    const s = new THREE.Shape();
    s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h - w / 2);
    s.absarc(0, h - w / 2, w / 2, 0, Math.PI, false);
    s.lineTo(-w / 2, 0);
    return s;
  }
  const frameGeo = new THREE.ShapeGeometry(archShape(0.16, 0.28), 10);
  const paneGeo = new THREE.ShapeGeometry(archShape(0.1, 0.22), 10);
  const windows = [
    [-0.55, -0.15, 0.41, 0.0, 0.95], [-0.55, -0.15, 0.41, 1.3, 1.35], [-0.55, -0.15, 0.41, 2.6, 1.75], [-0.55, -0.15, 0.41, 4.1, 1.1],
    [0.9, 0.15, 0.31, 0.5, 0.75], [0.9, 0.15, 0.31, 2.3, 1.2], [0.9, 0.15, 0.31, 4.4, 0.95],
    [-1.0, -0.6, 0.28, 1.0, 0.7], [-1.0, -0.6, 0.28, 3.4, 1.1],
  ];
  for (const [cx, cz, r, ang, y] of windows) {
    const nx = Math.cos(ang), nz = Math.sin(ang);
    const frame = new THREE.Mesh(frameGeo, stonePlain);
    frame.position.set(cx + nx * (r + 0.002), Y0 + y - 0.03, cz + nz * (r + 0.002));
    frame.rotation.y = -ang + Math.PI / 2;
    const pane = new THREE.Mesh(paneGeo, dark);
    pane.position.set(cx + nx * (r + 0.006), Y0 + y, cz + nz * (r + 0.006));
    pane.rotation.y = -ang + Math.PI / 2;
    group.add(frame, pane);
  }

  // --- placement and collision volumes ---------------------------------------------------------------
  const L = LAYOUT.castle;
  group.position.set(L.x, substrateHeight(L.x, L.z) - 0.12, L.z);
  group.rotation.y = L.rotY;
  parent.add(group);
  group.updateMatrixWorld(true);

  const localBoxes = [
    [-1.0, -0.15, 0.92, 2.7, 0.92],          // keep
    [0.9, 0.15, 0.74, 2.2, 0.74],            // right tower
    [-1.0, -0.6, 0.68, 1.9, 0.68],           // left tower
    [-0.1, -0.88, 1.9, 1.1, 0.22],           // rear wall
    [-1.14, 0.0, 0.22, 1.0, 1.05],           // west wall
    [1.14, 0.32, 0.22, 1.1, 0.5],            // east wall
    [-0.64, 0.73, 1.22, 1.4, 0.26],          // gate wall, west of the opening
    [0.82, 0.73, 0.86, 1.4, 0.26],           // gate wall, east of the opening
  ];
  const obstacles = localBoxes.map(([cx, cz, w, h, d]) => new THREE.Box3(
    new THREE.Vector3(cx - w / 2, 0, cz - d / 2), new THREE.Vector3(cx + w / 2, h, cz + d / 2)
  ).applyMatrix4(group.matrixWorld));

  return { group, obstacles, parts, gate: { x: GX, z: 0.73, halfWidth: GW, height: GH + GW } };
}


// ─────────────────────────── 90_plants.js ───────────────────────────
// Stage 6 — four rooted aquatic plants with different leaf structures and motion.
//
// Every leaf/stem vertex carries a "flow frame" (aCenter, aSide, aTan) on its supporting axis and
// two parameters: aLeaf.x = distance along the organ (0 base → 1 tip), aLeaf.w = position on the
// supporting stem. The vertex shader bends the organ along that frame, so leaves stay attached.

const PLANT_DEFORM_HEAD = /* glsl */`
attribute vec4 aLeaf;
attribute vec3 aCenter;
attribute vec3 aSide;
attribute vec3 aTan;
attribute float aKind;
uniform float uTime;
uniform float uLeafAmp;
uniform float uLeafFreq;
uniform float uLeafDelay;
uniform float uPlantSeed;
varying vec2 vLeafUv;
varying vec4 vLeafData;
varying float vLeafKind;
${CURRENT_GLSL}
vec3 rotAxis( vec3 v, vec3 axis, float a ) {
  float c = cos( a ), s = sin( a );
  return v * c + cross( axis, v ) * s + axis * dot( axis, v ) * ( 1.0 - c );
}`;

const PLANT_DEFORM_BODY = /* glsl */`
{
  vLeafUv = uv;
  vLeafData = aLeaf;
  vLeafKind = aKind;
  float t = aLeaf.x;
  float s = aLeaf.w;
  float ph = aLeaf.y;
  float stiff = aLeaf.z * uLeafAmp;
  float ws = s * s;
  float wt = t * t;
  vec3 wp = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;
  vec3 cur = currentField( wp, uTime );
  float gust = 0.65 + 0.35 * sin( uTime * 0.31 + ph * 2.0 + uPlantSeed );
  float sway = sin( uTime * uLeafFreq + ph - s * uLeafDelay )
             + 0.5 * sin( uTime * uLeafFreq * 1.7 + ph * 1.3 - s * uLeafDelay * 1.6 );
  // motion of the supporting axis at this height
  vec3 follow = aSide * ( stiff * ws * sway * gust * 0.35 )
              + vec3( 0.0, 1.0, 0.0 ) * ( stiff * ws * 0.10 * sin( uTime * uLeafFreq * 0.7 + ph * 1.3 ) )
              + cur * ( stiff * ws * 1.8 );
  float tw = stiff * 0.35 * s * sin( uTime * uLeafFreq * 0.8 + ph + 1.0 );
  vec3 off = rotAxis( transformed - aCenter, aTan, tw );
  // the organ's own tip motion (leaf blades, fine whorls)
  float isStem = step( 0.5, aKind ) * ( 1.0 - step( 1.5, aKind ) );
  vec3 flutter = normal * ( stiff * wt * 0.12 * ( 1.0 - isStem ) * sin( uTime * uLeafFreq * 1.3 + ph - t * uLeafDelay ) );
  transformed = aCenter + off + follow + flutter;
}`;

const PLANT_FRAG_HEAD = /* glsl */`
varying vec2 vLeafUv;
varying vec4 vLeafData;
varying float vLeafKind;
uniform vec3 uLeafDark;
uniform vec3 uLeafLight;
uniform float uLeafVeins;
float leafHash( float n ) { return fract( sin( n * 127.1 ) * 43758.5453 ); }
vec3 leafColor() {
  float t = vLeafUv.y;
  float u = vLeafUv.x;
  float v = abs( u - 0.5 ) * 2.0;
  float ph = vLeafData.y;
  float lr = leafHash( ph );
  vec3 c = mix( uLeafDark, uLeafLight, 0.25 + 0.55 * smoothstep( 0.0, 0.85, t ) + 0.25 * lr );
  // midrib
  float mid = 1.0 - smoothstep( 0.0, 0.045 * ( 1.0 - t * 0.5 ), v );
  c = mix( c, uLeafLight * 1.12, mid * 0.55 );
  // lateral veins
  float lat = sin( ( t * uLeafVeins + v * 0.9 ) * 6.28318 );
  float lines = smoothstep( 0.9, 1.0, lat ) * ( 1.0 - mid ) * ( 1.0 - v * 0.6 ) * step( 0.5, uLeafVeins );
  c = mix( c, uLeafLight * 1.08, lines * 0.35 );
  // edges a touch darker
  c *= mix( 0.82, 1.0, 1.0 - smoothstep( 0.8, 1.0, v ) );
  return c;
}`;

function makePlantMaterial(spec, uniforms) {
  const transparent = !!spec.transparent;
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: spec.roughness ?? 0.46, metalness: 0,
    clearcoat: spec.clearcoat ?? 0.3, clearcoatRoughness: 0.45,
    side: THREE.DoubleSide, transparent, depthWrite: !transparent,
    sheen: 0.3, sheenRoughness: 0.6, sheenColor: new THREE.Color(0.35, 0.75, 0.4),
    envMapIntensity: 0.5,
  });
  enhanceMaterial(mat, {
    id: spec.id,
    uniforms,
    caustics: spec.caustics ?? 0.7,
    vertexHead: PLANT_DEFORM_HEAD,
    vertexBody: PLANT_DEFORM_BODY,
    fragmentHead: PLANT_FRAG_HEAD + (spec.fragmentExtra || ''),
    fragmentColor: 'diffuseColor.rgb = leafColor();' + (spec.fragmentColor || ''),
    fragmentEmissive: 'totalEmissiveRadiance += diffuseColor.rgb * 0.30 * pow( 1.0 - abs( dot( normal, normalize( vViewPosition ) ) ), 2.0 );',
  });
  return mat;
}
function plantDepthMaterial(id, uniforms) {
  return deformedDepthMaterial({ id, uniforms, vertexHead: PLANT_DEFORM_HEAD, vertexBody: PLANT_DEFORM_BODY, side: THREE.DoubleSide });
}
function plantUniforms(seed, amp, freq, delay, dark, light, veins) {
  return {
    uTime: SIM_UNIFORMS.uTime, uPlume: SIM_UNIFORMS.uPlume,
    uPlantSeed: { value: seed }, uLeafAmp: { value: amp }, uLeafFreq: { value: freq }, uLeafDelay: { value: delay },
    uLeafDark: { value: new THREE.Vector3(...dark) }, uLeafLight: { value: new THREE.Vector3(...light) }, uLeafVeins: { value: veins },
  };
}
function placePlant(group, layout, parent, sink = 0.03) {
  group.position.set(layout.x, substrateHeight(layout.x, layout.z) - sink, layout.z);
  parent.add(group);
  group.updateMatrixWorld(true);
}

// Sets flow attributes on an indexed geometry whose uv.x runs along the organ.
function addFlowAttributes(g, frameFn, phase, stiffness, kind = 0, alongOwn = false) {
  const count = g.attributes.position.count;
  const aLeaf = new Float32Array(count * 4), aCenter = new Float32Array(count * 3), aSide = new Float32Array(count * 3), aTan = new Float32Array(count * 3), aKind = new Float32Array(count);
  const fr = { c: new THREE.Vector3(), s: new THREE.Vector3(), t: new THREE.Vector3() };
  for (let i = 0; i < count; i++) {
    const u = g.attributes.uv.getX(i);
    frameFn(u, fr);
    const t = alongOwn ? g.attributes.uv.getY(i) : u;
    aLeaf[i * 4] = t; aLeaf[i * 4 + 1] = phase; aLeaf[i * 4 + 2] = stiffness; aLeaf[i * 4 + 3] = u;
    aCenter.set([fr.c.x, fr.c.y, fr.c.z], i * 3); aSide.set([fr.s.x, fr.s.y, fr.s.z], i * 3); aTan.set([fr.t.x, fr.t.y, fr.t.z], i * 3);
    aKind[i] = kind;
  }
  g.setAttribute('aLeaf', new THREE.BufferAttribute(aLeaf, 4));
  g.setAttribute('aCenter', new THREE.BufferAttribute(aCenter, 3));
  g.setAttribute('aSide', new THREE.BufferAttribute(aSide, 3));
  g.setAttribute('aTan', new THREE.BufferAttribute(aTan, 3));
  g.setAttribute('aKind', new THREE.BufferAttribute(aKind, 1));
  return g;
}

// Ribbon/sheet organ: spine(t), facing(t) (desired normal), width(t), twist(t), crease, wrinkle(t, a).
function buildLeafGeometry(o) {
  const segs = o.segments ?? 24, across = o.across ?? 2;
  const rows = segs + 1, cols = across + 1, count = rows * cols;
  const pos = new Float32Array(count * 3), uv = new Float32Array(count * 2);
  const aLeaf = new Float32Array(count * 4), aCenter = new Float32Array(count * 3), aSide = new Float32Array(count * 3), aTan = new Float32Array(count * 3), aKind = new Float32Array(count);
  const C = new THREE.Vector3(), T = new THREE.Vector3(), S = new THREE.Vector3(), N = new THREE.Vector3(), P = new THREE.Vector3(), F = new THREE.Vector3(), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
  const follow = o.follow || null;
  for (let i = 0; i < rows; i++) {
    const t = i / segs;
    o.spine(t, C);
    o.spine(Math.min(1, t + 0.01), tmpA); o.spine(Math.max(0, t - 0.01), tmpB);
    T.subVectors(tmpA, tmpB);
    if (T.lengthSq() < 1e-10) T.set(0, 1, 0); else T.normalize();
    o.facing(t, F);
    S.crossVectors(F, T);
    if (S.lengthSq() < 1e-8) S.set(1, 0, 0).cross(T);
    S.normalize();
    N.crossVectors(T, S).normalize();
    const tw = o.twist ? o.twist(t) : 0;
    if (tw) { S.applyAxisAngle(T, tw); N.applyAxisAngle(T, tw); }
    const w = o.width(t);
    for (let j = 0; j < cols; j++) {
      const a = j / across - 0.5;
      const edge = Math.abs(a) * 2;
      let lift = (o.crease ?? 0) * w * Math.pow(edge, o.creasePow ?? 1.6);
      if (o.wrinkle) lift += o.wrinkle(t, a);
      P.copy(C).addScaledVector(S, a * w).addScaledVector(N, lift);
      const k = i * cols + j;
      pos[k * 3] = P.x; pos[k * 3 + 1] = P.y; pos[k * 3 + 2] = P.z;
      uv[k * 2] = a + 0.5; uv[k * 2 + 1] = t;
      const s = follow ? follow.s : t;
      aLeaf[k * 4] = t; aLeaf[k * 4 + 1] = o.phase; aLeaf[k * 4 + 2] = o.stiffness; aLeaf[k * 4 + 3] = s;
      if (follow) {
        aCenter.set([follow.center.x, follow.center.y, follow.center.z], k * 3);
        aSide.set([follow.side.x, follow.side.y, follow.side.z], k * 3);
        aTan.set([follow.tan.x, follow.tan.y, follow.tan.z], k * 3);
      } else {
        aCenter.set([C.x, C.y, C.z], k * 3); aSide.set([S.x, S.y, S.z], k * 3); aTan.set([T.x, T.y, T.z], k * 3);
      }
      aKind[k] = o.kind ?? 0;
    }
  }
  const idx = [];
  for (let i = 0; i < segs; i++) for (let j = 0; j < across; j++) {
    const a = i * cols + j, b = a + cols;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('aLeaf', new THREE.BufferAttribute(aLeaf, 4));
  g.setAttribute('aCenter', new THREE.BufferAttribute(aCenter, 3));
  g.setAttribute('aSide', new THREE.BufferAttribute(aSide, 3));
  g.setAttribute('aTan', new THREE.BufferAttribute(aTan, 3));
  g.setAttribute('aKind', new THREE.BufferAttribute(aKind, 1));
  g.computeVertexNormals();
  return g;
}

function mergePlant(geos) {
  const g = BufferGeometryUtils.mergeGeometries(geos, false);
  for (const x of geos) x.dispose();
  return g;
}

const UP = new THREE.Vector3(0, 1, 0);

// ---------------------------------------------------------------------------------------------
// Plant 1 — Vallisneria: a rear-corner clump of long, narrow, twisting ribbon leaves.
// ---------------------------------------------------------------------------------------------
function createVallisneria(parent) {
  const rng = new Rng(101);
  const group = new THREE.Group();
  group.name = 'plant-vallisneria';
  const geos = [];
  const n = 11;
  for (let i = 0; i < n; i++) {
    const az = (i / n) * TWO_PI + rng.range(-0.35, 0.35);
    const L = i < 3 ? rng.range(3.9, 4.3) : rng.range(2.3, 3.8);
    const lean = rng.range(0.2, 0.6);
    const dir = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
    const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);
    const baseOff = dir.clone().multiplyScalar(rng.range(0.0, 0.14));
    const twistTotal = rng.range(-1.3, 1.3);
    const wBase = rng.range(0.06, 0.088);
    const wave = rng.range(0, TWO_PI);
    geos.push(buildLeafGeometry({
      spine: (t, out) => {
        const y = L * (t - 0.08 * t * t);
        const r = lean * t * t;
        const s = 0.05 * Math.sin(t * 3.1 + wave) * t;
        return out.set(baseOff.x + dir.x * r + sideDir.x * s, y, baseOff.z + dir.z * r + sideDir.z * s);
      },
      facing: (t, out) => out.copy(sideDir),
      width: (t) => wBase * (0.7 + 0.45 * Math.sin(Math.min(1, t * 2.2) * Math.PI * 0.5)) * (1 - smoothstep(0.6, 1.0, t)) + 0.004,
      twist: (t) => twistTotal * t * t,
      crease: 0.35, creasePow: 1.4,
      segments: 40, across: 4,
      phase: rng.float() * TWO_PI, stiffness: rng.range(0.8, 1.2),
    }));
  }
  const geo = mergePlant(geos);
  const uniforms = plantUniforms(0.3, 1.0, 1.5, 1.1, [0.07, 0.27, 0.08], [0.34, 0.68, 0.18], 0);
  const mesh = new THREE.Mesh(geo, makePlantMaterial({ id: 'vallisneria', clearcoat: 0.2, fragmentExtra: '', fragmentColor: 'diffuseColor.rgb *= 1.0 + 0.18 * (1.0 - smoothstep(0.0, 0.12, abs(vLeafUv.x - 0.5)));' }, uniforms));
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.customDepthMaterial = plantDepthMaterial('vallisneria', uniforms);
  group.add(mesh);
  placePlant(group, LAYOUT.plants.vallisneria, parent);
  return { group, mesh };
}

// ---------------------------------------------------------------------------------------------
// Plant 2 — Anubias: thick oval leaves on petioles above a visible rhizome. Stiff, small motion.
// ---------------------------------------------------------------------------------------------
function createRhizome(group, rng, length, radius, color, parts) {
  const pts = [];
  const a = rng.range(0, TWO_PI);
  const dir = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
  for (let i = 0; i <= 6; i++) {
    const u = i / 6;
    pts.push(new THREE.Vector3().copy(dir).multiplyScalar((u - 0.5) * length).add(new THREE.Vector3(rng.range(-0.03, 0.03), radius * 0.9 + rng.range(-0.01, 0.02), rng.range(-0.03, 0.03))));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 24, radius, 10, false);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0 });
  enhanceMaterial(mat, { id: 'rhizome-' + color, caustics: 0.8 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  group.add(mesh);
  // leaf scars / nodules
  for (let i = 0; i < 6; i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(radius * rng.range(0.35, 0.55), 8, 6), mat);
    curve.getPointAt(rng.range(0.1, 0.9), b.position);
    b.position.y += radius * 0.6;
    b.castShadow = true;
    group.add(b);
    parts.push(b);
  }
  return { mesh, curve, dir };
}

function createAnubias(parent) {
  const rng = new Rng(202);
  const group = new THREE.Group();
  group.name = 'plant-anubias';
  const rhizomeParts = [];
  createRhizome(group, rng, 0.46, 0.055, 0x4a4a2a, rhizomeParts);
  const geos = [];
  const n = 7, PT = 0.42;
  for (let i = 0; i < n; i++) {
    const az = (i / n) * TWO_PI + rng.range(-0.4, 0.4);
    const petLen = rng.range(0.2, 0.36), bladeLen = rng.range(0.3, 0.44), W = rng.range(0.17, 0.25);
    const tilt = rng.range(0.25, 0.7), tiltB = tilt + rng.range(0.35, 0.6);
    const dir = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
    const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);
    const p0 = dir.clone().multiplyScalar(rng.range(0.02, 0.14));
    p0.y = 0.07;
    const p1 = p0.clone().addScaledVector(dir, petLen * Math.sin(tilt)).addScaledVector(UP, petLen * Math.cos(tilt));
    const droop = rng.range(0.06, 0.14);
    const roll = rng.range(-0.25, 0.25);
    geos.push(buildLeafGeometry({
      spine: (t, out) => {
        if (t < PT) {
          const u = t / PT;
          out.lerpVectors(p0, p1, u);
          out.y += 0.03 * Math.sin(u * Math.PI);           // slight bow
        } else {
          const u = (t - PT) / (1 - PT);
          out.copy(p1).addScaledVector(dir, bladeLen * u * Math.sin(tiltB)).addScaledVector(UP, bladeLen * u * Math.cos(tiltB) - droop * u * u);
          out.addScaledVector(sideDir, roll * bladeLen * u * u);
        }
        return out;
      },
      facing: (t, out) => out.copy(sideDir).lerp(UP, smoothstep(0.3, 0.62, t)).normalize(),
      width: (t) => (t < PT ? 0.02 + 0.012 * (1 - t / PT) : W * Math.pow(Math.sin(Math.PI * (0.02 + 0.98 * (t - PT) / (1 - PT))), 1.05)),
      crease: -0.22, creasePow: 2.0,
      twist: (t) => roll * 0.4 * smoothstep(PT, 1, t),
      segments: 30, across: 6,
      phase: rng.float() * TWO_PI, stiffness: rng.range(0.8, 1.2),
    }));
  }
  const geo = mergePlant(geos);
  const uniforms = plantUniforms(1.7, 0.14, 3.2, 2.0, [0.015, 0.10, 0.035], [0.06, 0.28, 0.09], 7);
  const mesh = new THREE.Mesh(geo, makePlantMaterial({ id: 'anubias', clearcoat: 0.7, roughness: 0.42, fragmentExtra: '', fragmentColor: 'diffuseColor.rgb *= 0.92 + 0.16 * leafHash( floor( vLeafUv.y * 9.0 ) * 3.1 + floor( vLeafUv.x * 7.0 ) );' }, uniforms));
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.customDepthMaterial = plantDepthMaterial('anubias', uniforms);
  group.add(mesh);
  placePlant(group, LAYOUT.plants.anubias, parent);
  return { group, mesh };
}

// ---------------------------------------------------------------------------------------------
// Plant 3 — Java fern: lance-shaped fronds with uneven outlines from a single anchored base.
// ---------------------------------------------------------------------------------------------
function createJavaFern(parent) {
  const rng = new Rng(303);
  const group = new THREE.Group();
  group.name = 'plant-javafern';
  createRhizome(group, rng, 0.4, 0.045, 0x3a3220, []);
  const geos = [];
  const n = 9, PT = 0.16;
  for (let i = 0; i < n; i++) {
    const az = (i / n) * TWO_PI + rng.range(-0.5, 0.5);
    const petLen = rng.range(0.08, 0.16), bladeLen = rng.range(0.75, 1.45), W = rng.range(0.13, 0.2);
    const tilt = rng.range(0.3, 0.7);                       // from vertical
    const dir = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
    const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);
    const p0 = dir.clone().multiplyScalar(rng.range(0.0, 0.12)); p0.y = 0.06;
    const p1 = p0.clone().addScaledVector(dir, petLen * Math.sin(tilt)).addScaledVector(UP, petLen * Math.cos(tilt));
    const droop = rng.range(0.15, 0.4) * bladeLen;
    const roll = rng.range(-0.5, 0.5);
    const bumps = rng.range(28, 42), bp = rng.range(0, TWO_PI);
    geos.push(buildLeafGeometry({
      spine: (t, out) => {
        if (t < PT) {
          out.lerpVectors(p0, p1, t / PT);
        } else {
          const u = (t - PT) / (1 - PT);
          out.copy(p1).addScaledVector(dir, bladeLen * (u * Math.sin(tilt) + droop * u * u * 0.5)).addScaledVector(UP, bladeLen * (u * Math.cos(tilt) - droop * u * u * 0.35));
          out.addScaledVector(sideDir, roll * 0.15 * bladeLen * u * u);
        }
        return out;
      },
      facing: (t, out) => out.copy(sideDir).lerp(UP, 0.6).normalize(),
      width: (t) => {
        if (t < PT) return 0.016;
        const u = (t - PT) / (1 - PT);
        return W * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.75) * (1 + 0.13 * Math.sin(u * bumps + bp)) + 0.003;
      },
      wrinkle: (t, a) => (t > PT ? 0.006 * Math.sin(t * 70 + a * 9) * (1 - Math.abs(a) * 1.6) : 0),
      crease: 0.12, creasePow: 1.5,
      twist: (t) => roll * 0.5 * smoothstep(PT, 1, t),
      segments: 36, across: 6,
      phase: rng.float() * TWO_PI, stiffness: rng.range(0.75, 1.15),
    }));
  }
  const geo = mergePlant(geos);
  const uniforms = plantUniforms(2.9, 0.55, 2.2, 3.6, [0.09, 0.23, 0.07], [0.30, 0.52, 0.19], 9);
  const mesh = new THREE.Mesh(geo, makePlantMaterial({ id: 'javafern', clearcoat: 0.25, fragmentExtra: '', fragmentColor: 'diffuseColor.rgb = mix( diffuseColor.rgb, diffuseColor.rgb * vec3( 1.25, 1.05, 0.7 ), 0.5 * step( 0.55, leafHash( floor( vLeafUv.y * 14.0 ) * 7.7 + floor( vLeafUv.x * 5.0 ) ) ) );' }, uniforms));
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.customDepthMaterial = plantDepthMaterial('javafern', uniforms);
  group.add(mesh);
  placePlant(group, LAYOUT.plants.javafern, parent);
  return { group, mesh };
}

// ---------------------------------------------------------------------------------------------
// Plant 4 — Cabomba: branching fine stems carrying feathery fan-like leaf whorls.
// ---------------------------------------------------------------------------------------------
function createCabomba(parent) {
  const rng = new Rng(404);
  const group = new THREE.Group();
  group.name = 'plant-cabomba';
  const geos = [];
  const stems = [];
  const nStems = 6;
  for (let k = 0; k < nStems; k++) {
    const az = (k / nStems) * TWO_PI + rng.range(-0.4, 0.4);
    const H = rng.range(1.7, 2.7);
    const lean = rng.range(0.15, 0.45);
    const dir = new THREE.Vector3(Math.cos(az), 0, Math.sin(az));
    const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);
    const baseOff = dir.clone().multiplyScalar(rng.range(0.0, 0.16));
    const wave = rng.range(0, TWO_PI);
    stems.push({
      baseOff, dir, sideDir, wave, H, lean,
      fn: (u, out) => out.copy(baseOff).addScaledVector(UP, H * u).addScaledVector(dir, lean * u * u).addScaledVector(sideDir, 0.09 * Math.sin(u * 3.5 + wave) * u),
      phase: rng.float() * TWO_PI, stiffness: 1.0, radius: 0.012,
    });
  }
  // two side branches emerging from mid-stem nodes
  const branchSeeds = [stems[1], stems[4]];
  for (const s of branchSeeds) {
    const d = s.dir.clone().addScaledVector(s.sideDir, rng.range(-1, 1)).normalize();
    const side2 = new THREE.Vector3(-d.z, 0, d.x);
    const origin = s.fn(0.5, new THREE.Vector3());
    const H = s.H * rng.range(0.45, 0.6);
    const lean = rng.range(0.3, 0.6);
    stems.push({
      baseOff: origin, dir: d, sideDir: side2, wave: rng.range(0, TWO_PI), H, lean,
      fn: (u, out) => out.copy(origin).addScaledVector(UP, H * u).addScaledVector(d, lean * u * u + 0.25 * u).addScaledVector(side2, 0.06 * Math.sin(u * 4) * u),
      phase: rng.float() * TWO_PI, stiffness: 1.15, radius: 0.009, branch: true,
    });
  }

  const tmp = { c: new THREE.Vector3(), s: new THREE.Vector3(), t: new THREE.Vector3() };
  for (const st of stems) {
    const pts = [];
    for (let i = 0; i <= 12; i++) pts.push(st.fn(i / 12, new THREE.Vector3()));
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.TubeGeometry(curve, 28, st.radius, 6, false);
    const frameFn = (u, out) => {
      curve.getPointAt(u, out.c);
      curve.getTangentAt(u, out.t);
      out.s.set(-out.t.z, 0, out.t.x);
      if (out.s.lengthSq() < 1e-6) out.s.set(1, 0, 0);
      out.s.normalize();
    };
    addFlowAttributes(tube, frameFn, st.phase, st.stiffness, 1);
    geos.push(tube);

    // whorls: at every node two opposing flat fans of finely serrated segments
    let u = st.branch ? 0.25 : 0.14;
    let nodeIdx = 0;
    while (u < 0.97) {
      frameFn(u, tmp);
      const center = tmp.c.clone();
      const nodeScale = (st.branch ? 0.8 : 1) * (1 - 0.38 * Math.abs(u - 0.6));
      const fanAz = u * 9.0 + nodeIdx * 1.3 + st.phase;
      for (let f = 0; f < 2; f++) {
        const fa = fanAz + f * Math.PI;
        const nf = 6;
        for (let j = 0; j < nf; j++) {
          const spread = (j / (nf - 1) - 0.5) * 1.9;
          const el = 0.28 + 0.3 * Math.abs(spread);
          const a = fa + spread;
          const d = new THREE.Vector3(Math.cos(a) * Math.cos(el), Math.sin(el), Math.sin(a) * Math.cos(el));
          const Lw = 0.32 * nodeScale * (1 - 0.45 * Math.abs(spread) / 0.95) * rng.range(0.9, 1.1);
          const curl = rng.range(0.25, 0.5);
          const phase = st.phase + nodeIdx * 1.7 + j * 0.9 + f * 2.3;
          geos.push(buildLeafGeometry({
            spine: (t, out) => out.copy(center).addScaledVector(d, Lw * t).addScaledVector(UP, curl * Lw * t * t),
            facing: (t, out) => out.copy(UP),
            width: (t) => (0.024 * (1 - smoothstep(0.55, 1.0, t)) + 0.002) * (1 + 0.6 * Math.abs(Math.sin(t * 9.0 * Math.PI))),
            segments: 16, across: 1,
            phase, stiffness: rng.range(1.0, 1.4),
            follow: { s: u, center, side: tmp.s.clone(), tan: tmp.t.clone() },
            kind: 2,
          }));
        }
      }
      u += rng.range(0.085, 0.125);
      nodeIdx++;
    }
    // terminal tuft
    frameFn(0.99, tmp);
    const tip = tmp.c.clone();
    for (let j = 0; j < 4; j++) {
      const a = (j / 4) * TWO_PI + st.phase;
      const d = new THREE.Vector3(Math.cos(a) * 0.35, 1, Math.sin(a) * 0.35).normalize();
      geos.push(buildLeafGeometry({
        spine: (t, out) => out.copy(tip).addScaledVector(d, 0.14 * t),
        facing: (t, out) => out.set(-Math.sin(a), 0, Math.cos(a)),
        width: (t) => 0.02 * (1 - smoothstep(0.5, 1.0, t)) + 0.002,
        segments: 6, across: 1, phase: st.phase + j, stiffness: 1.2,
        follow: { s: 0.99, center: tip, side: tmp.s.clone(), tan: tmp.t.clone() }, kind: 2,
      }));
    }
  }
  const geo = mergePlant(geos);
  const uniforms = plantUniforms(4.1, 1.5, 4.4, 4.2, [0.22, 0.55, 0.17], [0.56, 0.88, 0.36], 0);
  const mesh = new THREE.Mesh(geo, makePlantMaterial({
    id: 'cabomba', transparent: true, clearcoat: 0.15, roughness: 0.5,
    fragmentExtra: '',
    fragmentColor: `
      if ( vLeafKind > 0.5 ) diffuseColor.rgb = mix( vec3( 0.20, 0.46, 0.17 ), vec3( 0.30, 0.60, 0.22 ), vLeafUv.y );   // darker stems
      diffuseColor.a = vLeafKind > 0.5 ? 1.0 : 1.0 - 0.55 * pow( abs( vLeafUv.x - 0.5 ) * 2.0, 2.0 ) - 0.25 * smoothstep( 0.7, 1.0, vLeafUv.y );`,
  }, uniforms));
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.renderOrder = 6;
  mesh.customDepthMaterial = plantDepthMaterial('cabomba', uniforms);
  group.add(mesh);
  placePlant(group, LAYOUT.plants.cabomba, parent);
  return { group, mesh };
}

function createPlants(parent) {
  return {
    vallisneria: createVallisneria(parent),
    anubias: createAnubias(parent),
    javafern: createJavaFern(parent),
    cabomba: createCabomba(parent),
  };
}


// ─────────────────────────── 95_fish_models.js ───────────────────────────
// Stages 7–10 — four fish. Fish local frame: +X forward (nose), +Y up, +Z right side.
//
// Every fish is two merged meshes: an opaque body and a translucent fin sheet. Vertices carry
// aFlow = (s: distance along the body 0 nose → 1 peduncle, u: distance along a fin ray from its
// base, mode: 0 body / 1.x fin kinds / 2 pectoral / 3 filament, phase) plus aDir (flutter
// direction) and aBase (attachment point). The vertex shader runs a travelling wave from head to
// tail and lets fins flutter with a phase delay that grows toward their free edges.

const FISH_DEFORM_HEAD = /* glsl */`
attribute vec4 aFlow;
attribute vec3 aDir;
attribute vec3 aBase;
uniform float uTime;
uniform float uBeat;
uniform float uAmp;
uniform float uTurn;
uniform float uLen;
uniform float uFinAmp;
uniform float uPectFreq;
varying vec2 vAUv;
varying vec3 vAPos;
varying vec4 vAFlow;`;

const FISH_DEFORM_NORMAL = /* glsl */`
{
  float s = aFlow.x;
  float ph = uBeat - s * 4.5;
  float bodyA = uAmp * ( 0.03 + s * s );
  float dbend = bodyA * 4.5 * cos( ph ) + uTurn * 0.7 * s;
  float yaw = atan( dbend / max( uLen, 0.1 ) );
  float cy = cos( yaw ), sy = sin( yaw );
  objectNormal = vec3( cy * objectNormal.x + sy * objectNormal.z, objectNormal.y, -sy * objectNormal.x + cy * objectNormal.z );
}`;

const FISH_DEFORM_BODY = /* glsl */`
{
  vAUv = uv;
  vAPos = position;
  vAFlow = aFlow;
  float s = aFlow.x, fu = aFlow.y, mode = aFlow.z, ph2 = aFlow.w;
  vec3 p = position;
  float bodyA = uAmp * ( 0.03 + s * s );
  float ph = uBeat - s * 4.5;
  p.z += bodyA * sin( ph ) + uTurn * 0.35 * s * s;
  if ( mode > 0.5 ) {
    if ( mode < 1.5 ) {
      // fin: the wave enters at the attachment and grows toward the free edge
      p += aDir * ( uFinAmp * fu * fu * sin( uBeat - fu * 3.0 + ph2 * 6.2832 + s * 4.5 ) * ( 0.25 + 0.75 * uAmp ) );
    } else if ( mode < 2.5 ) {
      // pectoral: sculls around a vertical hinge through its base
      float a = ( 0.25 + 0.5 * uAmp ) * sin( uTime * uPectFreq + ph2 * 6.2832 );
      float c = cos( a ), sn = sin( a );
      vec3 q = p - aBase;
      q = vec3( c * q.x + sn * q.z, q.y, -sn * q.x + c * q.z );
      q += aDir * ( 0.03 * fu * sin( uTime * uPectFreq + ph2 * 6.2832 + 1.2 ) );
      p = aBase + q;
    } else {
      // filament: flowing curve, attached at its base
      p += aDir * ( 0.10 * fu * fu * sin( uTime * 1.6 - fu * 4.0 + ph2 * 6.2832 ) );
    }
  }
  transformed = p;
}`;

const FISH_FRAG_COMMON = /* glsl */`
varying vec2 vAUv;
varying vec3 vAPos;
varying vec4 vAFlow;
float hash21( vec2 p ) { return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453 ); }
float vnoise( vec2 p ) {
  vec2 i = floor( p ), f = fract( p );
  f = f * f * ( 3.0 - 2.0 * f );
  return mix( mix( hash21( i ), hash21( i + vec2( 1.0, 0.0 ) ), f.x ), mix( hash21( i + vec2( 0.0, 1.0 ) ), hash21( i + vec2( 1.0, 1.0 ) ), f.x ), f.y );
}`;

// ---------------------------------------------------------------------------------------------
// Geometry builders
// ---------------------------------------------------------------------------------------------
function profileFn(table, scale = 1) {
  return (t) => scale * sampleProfile(table, t);
}

function buildBodyGeometry(prof) {
  const { x0, x1, segs = 64, radial = 32 } = prof;
  const pos = [], uv = [], flow = [], dir = [], base = [], idx = [];
  const push = (x, y, z, t, v) => { pos.push(x, y, z); uv.push(t, v); flow.push(t, 0, 0, 0); dir.push(0, 0, 1); base.push(0, 0, 0); };
  push(x0, prof.yc(0), 0, 0, 0.5);
  for (let i = 1; i <= segs; i++) {
    const t = i / segs, x = lerp(x0, x1, t);
    const ry = prof.ry(t), rz = prof.rz(t), yc = prof.yc(t), asym = prof.asym ? prof.asym(t) : 0;
    for (let j = 0; j <= radial; j++) {
      const v = j / radial, th = v * TWO_PI;
      const sy = Math.sin(th);
      push(x, yc + ry * sy * (1 + asym * sy), rz * Math.cos(th), t, v);
    }
  }
  for (let j = 0; j < radial; j++) idx.push(0, 1 + j + 1, 1 + j);
  for (let i = 1; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = 1 + (i - 1) * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const capC = pos.length / 3;
  push(x1, prof.yc(1), 0, 1, 0.5);
  const lastRing = 1 + (segs - 1) * (radial + 1);
  for (let j = 0; j < radial; j++) idx.push(capC, lastRing + j, lastRing + j + 1);

  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aFlow', new THREE.Float32BufferAttribute(flow, 4));
  g.setAttribute('aDir', new THREE.Float32BufferAttribute(dir, 3));
  g.setAttribute('aBase', new THREE.Float32BufferAttribute(base, 3));
  g.computeVertexNormals();
  // average the normals of the duplicated seam vertices so no seam line shows
  const nrm = g.attributes.normal;
  for (let i = 1; i <= segs; i++) {
    const a = 1 + (i - 1) * (radial + 1), b = a + radial;
    const nx = (nrm.getX(a) + nrm.getX(b)) * 0.5, ny = (nrm.getY(a) + nrm.getY(b)) * 0.5, nz = (nrm.getZ(a) + nrm.getZ(b)) * 0.5;
    nrm.setXYZ(a, nx, ny, nz); nrm.setXYZ(b, nx, ny, nz);
  }
  nrm.needsUpdate = true;
  return g;
}

// rays: [{ base, tip, s, normal, phase }]
function buildFinGeometry(rays, segs, opts = {}) {
  const n = rays.length;
  const pos = [], uv = [], flow = [], dir = [], base = [], idx = [];
  const P = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const r = rays[i];
    const vf = i / (n - 1);
    const ruffle = opts.ruffle ? opts.ruffle * Math.sin(i * 2.1 + 0.5) : 0;
    for (let k = 0; k <= segs; k++) {
      const u = k / segs;
      const bulge = Math.sin(u * Math.PI) * ((opts.bulge || 0) * (0.3 + 0.7 * Math.sin(vf * Math.PI)) + ruffle * u);
      P.lerpVectors(r.base, r.tip, u).addScaledVector(r.normal, bulge);
      pos.push(P.x, P.y, P.z); uv.push(u, vf);
      flow.push(r.s, u, opts.mode ?? 1, r.phase ?? vf);
      dir.push(r.normal.x, r.normal.y, r.normal.z);
      base.push(r.base.x, r.base.y, r.base.z);
    }
  }
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < segs; k++) {
    const a = i * (segs + 1) + k, b = a + segs + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('aFlow', new THREE.Float32BufferAttribute(flow, 4));
  g.setAttribute('aDir', new THREE.Float32BufferAttribute(dir, 3));
  g.setAttribute('aBase', new THREE.Float32BufferAttribute(base, 3));
  g.computeVertexNormals();
  return g;
}

function finRays(baseFn, tipFn, n, normal, sFn, phaseOffset = 0) {
  const rays = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    rays.push({ base: baseFn(t), tip: tipFn(t), s: sFn(t), normal: normal.clone(), phase: t + phaseOffset });
  }
  return rays;
}

// A long thin tapered tube (pelvic filaments), divided so it can bend along its length.
function buildFilamentGeometry(points, radius, s, mode, dir, phase, radial = 6) {
  const curve = new THREE.CatmullRomCurve3(points);
  const segs = 18;
  const g = new THREE.TubeGeometry(curve, segs, radius, radial, false);
  const count = g.attributes.position.count;
  const flow = new Float32Array(count * 4), dirs = new Float32Array(count * 3), base = new Float32Array(count * 3), uv = g.attributes.uv;
  for (let i = 0; i < count; i++) {
    const u = uv.getX(i);
    flow[i * 4] = s; flow[i * 4 + 1] = u; flow[i * 4 + 2] = mode; flow[i * 4 + 3] = phase;
    dirs[i * 3] = dir.x; dirs[i * 3 + 1] = dir.y; dirs[i * 3 + 2] = dir.z;
    base[i * 3] = points[0].x; base[i * 3 + 1] = points[0].y; base[i * 3 + 2] = points[0].z;
    // taper
    const k = 1 - 0.75 * u;
    const c = curve.getPointAt(Math.min(1, u));
    const px = g.attributes.position.getX(i), py = g.attributes.position.getY(i), pz = g.attributes.position.getZ(i);
    g.attributes.position.setXYZ(i, c.x + (px - c.x) * k, c.y + (py - c.y) * k, c.z + (pz - c.z) * k);
  }
  g.setAttribute('aFlow', new THREE.BufferAttribute(flow, 4));
  g.setAttribute('aDir', new THREE.BufferAttribute(dirs, 3));
  g.setAttribute('aBase', new THREE.BufferAttribute(base, 3));
  g.computeVertexNormals();
  return g;
}

// Materials
// ---------------------------------------------------------------------------------------------
function fishBodyMaterial(spec, uniforms) {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: spec.roughness ?? 0.35, metalness: spec.metalness ?? 0.15,
    clearcoat: spec.clearcoat ?? 0.8, clearcoatRoughness: 0.12,
    iridescence: spec.iridescence ?? 0, iridescenceIOR: 1.3, iridescenceThicknessRange: [120, 400],
    envMapIntensity: 0.9,
  });
  return enhanceMaterial(m, {
    id: 'fish-' + spec.id + '-body', uniforms, caustics: 0.35,
    vertexHead: FISH_DEFORM_HEAD, vertexNormal: FISH_DEFORM_NORMAL, vertexBody: FISH_DEFORM_BODY,
    fragmentHead: FISH_FRAG_COMMON + GILL_GLSL + spec.bodyGLSL,
    fragmentColor: 'diffuseColor.rgb = fishBodyColor();',
  });
}
function fishFinMaterial(spec, uniforms) {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: 0.4, metalness: 0.05, clearcoat: 0.35, clearcoatRoughness: 0.3,
    side: THREE.DoubleSide, transparent: true, depthWrite: false, envMapIntensity: 0.6,
  });
  return enhanceMaterial(m, {
    id: 'fish-' + spec.id + '-fins', uniforms, caustics: 0.25,
    vertexHead: FISH_DEFORM_HEAD, vertexNormal: FISH_DEFORM_NORMAL, vertexBody: FISH_DEFORM_BODY,
    fragmentHead: FISH_FRAG_COMMON + spec.finGLSL,
    fragmentColor: 'vec4 fc = fishFinColor(); diffuseColor.rgb = fc.rgb; diffuseColor.a = fc.a;',
    // thin sheets scatter light: a soft self-lit term, strongest where the sheet is edge-on
    fragmentEmissive: 'totalEmissiveRadiance += diffuseColor.rgb * ( 0.16 + 0.22 * pow( 1.0 - abs( dot( normal, normalize( vViewPosition ) ) ), 1.5 ) );',
  });
}
function fishDepthMaterial(spec, uniforms) {
  return deformedDepthMaterial({ id: 'fish-' + spec.id, uniforms, vertexHead: FISH_DEFORM_HEAD, vertexBody: FISH_DEFORM_BODY });
}
