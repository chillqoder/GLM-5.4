<!DOCTYPE html>
<html lang="en">

<title>Aquarium (dev)</title>
<style>:root {
  color-scheme: dark;
  --ink: #dfeef5;
  --ink-dim: rgba(223, 238, 245, 0.62);
  --panel: rgba(8, 16, 24, 0.58);
  --line: rgba(190, 230, 245, 0.16);
  --accent: #6fd3e6;
  font-family: "Inter", "SF Pro Text", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #05080e;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

#boot {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
  font-size: 14px; letter-spacing: 0.02em; color: var(--ink-dim); background: #05080e; z-index: 5;
  transition: opacity 0.7s ease; pointer-events: none;
}
#boot.gone { opacity: 0; }
#boot .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 0 rgba(111, 211, 230, 0.6); animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(111,211,230,0.55); } 100% { box-shadow: 0 0 0 12px rgba(111,211,230,0); } }

#ui {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  transition: opacity 0.8s ease;
}
#ui.hidden { opacity: 0; }

#title {
  position: absolute; left: 28px; top: 24px; display: flex; flex-direction: column; line-height: 1.05;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55); user-select: none;
}
#title strong { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
#title span { font-size: 11px; font-weight: 400; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink-dim); margin-top: 3px; }

#hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  font-size: 12px; letter-spacing: 0.02em; color: var(--ink-dim); white-space: nowrap;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); user-select: none; opacity: 0.9;
  transition: opacity 1.2s ease;
}
#hint.faded { opacity: 0; }

#controls {
  position: absolute; right: 24px; bottom: 20px; display: flex; gap: 8px; pointer-events: auto;
}
#controls button {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: inherit; font-size: 12.5px; letter-spacing: 0.01em; padding: 8px 14px; border-radius: 999px;
  cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
}
#controls button:hover { background: rgba(20, 36, 50, 0.78); border-color: rgba(190, 230, 245, 0.34); }
#controls button:active { transform: scale(0.97); }
#controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#controls button[aria-pressed="true"] { border-color: rgba(111, 211, 230, 0.6); color: #bdf0fa; }

#fallback {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; text-align: center; padding: 24px; background: #05080e; z-index: 6; font-size: 15px;
}
#fallback[hidden] { display: none; }
#fallback-detail { color: var(--ink-dim); font-size: 13px; max-width: 560px; }

#preview-info {
  position: fixed; left: 16px; top: 14px; z-index: 3; font: 12px/1.45 ui-monospace, SF Mono, Menlo, monospace;
  color: #cfe8f2; background: rgba(0, 0, 0, 0.5); padding: 8px 10px; border-radius: 6px; white-space: pre;
}

@media (max-width: 640px), (max-height: 520px) {
  #title { left: 16px; top: 14px; }
  #title strong { font-size: 15px; }
  #hint { display: none; }
  #controls { right: 14px; bottom: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  #boot .dot { animation: none; }
}

    var f = document.getElementById('fallback'), d = document.getElementById('fallback-detail'), b = document.getElementById('boot');
    if (!f || !d) return;
    d.textContent = 'Three.js could not be loaded from cdn.jsdelivr.net. Check the network connection and reload.';

  }, 25000);
  window.addEventListener('error', function (e) {
    if (window.__aquariumReady || !e || !e.message) return;
    var f = document.getElementById('fallback'), d = document.getElementById('fallback-detail'), b = document.getElementById('boot');

<script type="module">

// ─────────────────────────── 00_core.js ───────────────────────────
// Living Glass Aquarium — core constants, math helpers and the simulation clock.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Tank dimensions (Y is up). Outer glass box is 8 × 5 × 4 (x, y, z), open top.
// ---------------------------------------------------------------------------
const TANK = {
  w: 8, h: 5, d: 4,          // outer width (x), height (y), depth (z)
  t: 0.08,                   // glass thickness
  waterLevel: 4.55,          // rest height of the water surface
};
TANK.xMin = -TANK.w / 2; TANK.xMax = TANK.w / 2;
TANK.zMin = -TANK.d / 2; TANK.zMax = TANK.d / 2;
TANK.yMin = 0;               // inner floor
// Inner faces of the glass (the volume that water, creatures and plants must stay inside)
TANK.ixMin = TANK.xMin + TANK.t; TANK.ixMax = TANK.xMax - TANK.t;
TANK.izMin = TANK.zMin + TANK.t; TANK.izMax = TANK.zMax - TANK.t;
TANK.cx = 0; TANK.cz = 0;

const WATER_IOR = 1.333;
const GLASS_IOR = 1.5;

// World layer = everything rendered into the scene-colour buffer.
// Optic layer = the refracting interfaces (water surface, glass panes) drawn in a second pass.
const LAYER_WORLD = 0;
const LAYER_OPTIC = 1;

// ---------------------------------------------------------------------------
// Math helpers
// ---------------------------------------------------------------------------
const TWO_PI = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const saturate = (v) => clamp(v, 0, 1);
// Frame-rate independent exponential smoothing: moves `a` toward `b` with rate `lambda` per second.
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const remap = (v, a, b, c, d) => c + (d - c) * clamp((v - a) / (b - a), 0, 1);
const angleDelta = (a, b) => { let d = (b - a) % TWO_PI; if (d > Math.PI) d -= TWO_PI; if (d < -Math.PI) d += TWO_PI; return d; };

// Deterministic PRNG so the whole aquarium is reproducible.
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Rng {
  constructor(seed = 1) { this.next = mulberry32(seed); }
  float() { return this.next(); }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  sign() { return this.next() < 0.5 ? -1 : 1; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; }
  gauss() { // approximated normal distribution in [-1, 1] (Irwin–Hall)
    return (this.next() + this.next() + this.next() + this.next() - 2) * 0.866;
  }
}

// Seeded 2D value noise in [-1, 1] plus a small fBm helper (used for the substrate and textures).
function makeNoise2D(seed) {
  const rng = mulberry32(seed);
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const grad = new Float32Array(256);
  for (let i = 0; i < 256; i++) grad[i] = rng() * 2 - 1;
  const fade = (t) => t * t * (3 - 2 * t);
  return function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const v00 = grad[perm[perm[X] + Y]], v10 = grad[perm[perm[X + 1] + Y]];
    const v01 = grad[perm[perm[X] + Y + 1]], v11 = grad[perm[perm[X + 1] + Y + 1]];
    const u = fade(xf), v = fade(yf);
    return lerp(lerp(v00, v10, u), lerp(v01, v11, u), v) * 1.6;
  };
}
function fbm(noise, x, y, octaves = 4, lacunarity = 2.0, gain = 0.5) {
  let sum = 0, amp = 1, norm = 0, fx = x, fy = y;
  for (let i = 0; i < octaves; i++) {
    sum += noise(fx, fy) * amp; norm += amp;
    amp *= gain; fx *= lacunarity; fy *= lacunarity;
  }
  return sum / norm;
}

// Catmull-Rom style 1D spline through [t, value] pairs (t ascending in 0..1). Smooth body profiles.
function sampleProfile(table, t) {
  const n = table.length;
  if (t <= table[0][0]) return table[0][1];
  if (t >= table[n - 1][0]) return table[n - 1][1];
  let i = 0;
  while (i < n - 2 && t > table[i + 1][0]) i++;
  const p0 = table[Math.max(0, i - 1)], p1 = table[i], p2 = table[i + 1], p3 = table[Math.min(n - 1, i + 2)];
  const u = (t - p1[0]) / (p2[0] - p1[0]);
  // Tangents scaled to the local parameter spacing so uneven tables behave.
  const m1 = (p2[1] - p0[1]) / Math.max(1e-6, p2[0] - p0[0]) * (p2[0] - p1[0]);
  const m2 = (p3[1] - p1[1]) / Math.max(1e-6, p3[0] - p1[0]) * (p2[0] - p1[0]);
  const u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * p1[1] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * p2[1] + (u3 - u2) * m2;
}

// Orientation quaternion for a frame whose local +X is `forward`, local +Y as close to `up` as possible.
const _fwd = new THREE.Vector3(), _side = new THREE.Vector3(), _up = new THREE.Vector3(), _m4 = new THREE.Matrix4();
function quaternionFromForward(forward, up, out) {
  _fwd.copy(forward).normalize();
  if (_fwd.lengthSq() < 1e-8) _fwd.set(1, 0, 0);
  _side.crossVectors(up, _fwd);
  if (_side.lengthSq() < 1e-6) { _side.set(0, 0, 1).cross(_fwd); if (_side.lengthSq() < 1e-6) _side.set(0, 1, 0); }
  _side.normalize();
  _up.crossVectors(_fwd, _side).normalize();
  _m4.makeBasis(_fwd, _up, _side);
  return out.setFromRotationMatrix(_m4);
}

// ---------------------------------------------------------------------------
// Simulation clock. Everything animated registers an updater and reads SIM.time,
// so pausing freezes the whole world (fish, plants, bubbles, ripples, caustics…).
// ---------------------------------------------------------------------------
const SIM = {
  time: 0,
  paused: false,
  updaters: [],
  add(fn) { this.updaters.push(fn); return fn; },
  step(dt) {
    if (dt <= 0) return;
    this.time += dt;
    for (let i = 0; i < this.updaters.length; i++) this.updaters[i](dt, this.time);
  },
};

// Filled by the main chunk; the devtools chunk (dev builds only) inspects it.
const APP = {};

// Runs after everything is constructed: gives every system one consistent first state.
function warmUp(seconds = 0.5) {
  const n = 6;
  for (let i = 0; i < n; i++) SIM.step(seconds / n);
}


// ─────────────────────────── 100_crab.js ───────────────────────────
// Stage 12 — one bottom-walking crab. Local frame: +Z forward (rostrum), +X right, +Y up.
// Eight legs are two-link IK chains: feet are planted in world space during stance and follow a
// lifted arc during swing, in alternating tetrapod groups. The body rides on the ground height.

const CRAB_BODY_H = 0.13;
const CRAB_STRIDE = 0.12;
const _cv = Array.from({ length: 8 }, () => new THREE.Vector3());
const _cq1 = new THREE.Quaternion();
const _cbox = new THREE.Box3();

function createCrab(parent, env) {
  const rng = new Rng(707);
  const group = new THREE.Group();
  group.name = 'crab';
  const shellTex = mottleTexture(256, 12, { lo: 0.5, hi: 1.0, tint: [1.0, 0.82, 0.72] });
  const shell = new THREE.MeshPhysicalMaterial({ color: 0xa2472a, map: shellTex, roughness: 0.48, metalness: 0.05, clearcoat: 0.4, clearcoatRoughness: 0.3 });
  const shellDark = new THREE.MeshPhysicalMaterial({ color: 0x6b2e1a, roughness: 0.55, metalness: 0.02, clearcoat: 0.25, clearcoatRoughness: 0.35 });
  const jointMat = new THREE.MeshStandardMaterial({ color: 0x3a1a10, roughness: 0.7 });
  const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x050507, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02 });
  enhanceMaterial(shell, { id: 'crab-shell', caustics: 0.6 });
  enhanceMaterial(shellDark, { id: 'crab-shell-dark', caustics: 0.6 });
  enhanceMaterial(jointMat, { id: 'crab-joint', caustics: 0.4 });

  // --- carapace: low rounded dome with subtle radial ridges and a wider front --------------------
  const carapaceGeo = new THREE.SphereGeometry(1, 48, 24);
  {
    const p = carapaceGeo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const a = Math.atan2(v.z, v.x);
      const ridge = 1 + 0.03 * Math.sin(a * 6.0) * Math.max(0, v.y);
      const asym = 1 + 0.03 * Math.sin(a * 2.0 + 1.0);                 // small natural asymmetry
      p.setXYZ(i, v.x * 0.25 * ridge * asym, Math.max(v.y, -0.55) * 0.085 + 0.14, v.z * 0.2 * (1 + 0.08 * Math.max(0, v.z)) * ridge);
    }
    carapaceGeo.computeVertexNormals();
  }
  const carapace = new THREE.Mesh(carapaceGeo, shell);
  carapace.castShadow = true; carapace.receiveShadow = true;
  group.add(carapace);
  // rostrum teeth
  for (const sx of [-1, 1]) {
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.035, 6), shellDark);
    tooth.position.set(sx * 0.07, 0.13, 0.2); tooth.rotation.x = Math.PI / 2;
    group.add(tooth);
  }

  // --- eyes and mouthparts -------------------------------------------------------------------------
  const eyeStalks = [];
  for (const side of [1, -1]) {
    const stalk = new THREE.Object3D();
    stalk.position.set(side * 0.055, 0.19, 0.165);
    const stalkMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.013, 0.08, 8).translate(0, 0.04, 0), shellDark);
    stalkMesh.castShadow = true;
    stalk.add(stalkMesh);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 12), eyeMat);
    eye.position.y = 0.085;
    stalk.add(eye);
    stalk.rotation.set(-0.25, 0, side * 0.12);
    group.add(stalk);
    eyeStalks.push({ stalk, side, phase: rng.range(0, 6) });
  }
  const mouthparts = [];
  for (const side of [1, -1]) {
    const mp = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.04, 0.012), shellDark);
    mp.position.set(side * 0.017, 0.1, 0.195); mp.rotation.y = side * 0.35;
    group.add(mp); mouthparts.push(mp);
  }

  // --- walking legs ------------------------------------------------------------------------------------
  const L1 = 0.21, L2 = 0.23;
  const upperGeo = new THREE.CylinderGeometry(0.013, 0.019, L1, 8).rotateZ(-Math.PI / 2).translate(L1 / 2, 0, 0);
  const lowerGeo = new THREE.CylinderGeometry(0.006, 0.013, L2, 8).rotateZ(-Math.PI / 2).translate(L2 / 2, 0, 0);
  const kneeGeo = new THREE.SphereGeometry(0.018, 10, 8);
  const tipGeo = new THREE.SphereGeometry(0.008, 8, 6);
  const legs = [];
  const legZ = [0.13, 0.045, -0.04, -0.125];
  for (const side of [1, -1]) for (let i = 0; i < 4; i++) {
    const hip = new THREE.Object3D();
    hip.position.set(side * 0.2, 0.1, legZ[i]);
    const upper = new THREE.Object3D(); hip.add(upper);
    const upperMesh = new THREE.Mesh(upperGeo, shellDark); upperMesh.castShadow = true; upper.add(upperMesh);
    const knee = new THREE.Object3D(); knee.position.x = L1; upper.add(knee);
    const kneeBall = new THREE.Mesh(kneeGeo, jointMat); knee.add(kneeBall);
    const lowerMesh = new THREE.Mesh(lowerGeo, shellDark); lowerMesh.castShadow = true; knee.add(lowerMesh);
    const tip = new THREE.Mesh(tipGeo, jointMat); tip.position.x = L2; knee.add(tip);
    group.add(hip);
    legs.push({
      side, hip, upper, knee, baseYaw: side > 0 ? 0 : Math.PI,
      group: ((i % 2 === 0) === (side > 0)) ? 0 : 1,
      home: new THREE.Vector3(side * 0.37, 0, legZ[i] * 1.9 - 0.03),
      foot: new THREE.Vector3(), from: new THREE.Vector3(), to: new THREE.Vector3(), swinging: false, planted: false,
    });
  }

  // --- claws on articulated front arms -----------------------------------------------------------------
  const claws = [];
  const merusGeo = new THREE.CylinderGeometry(0.018, 0.024, 0.16, 10).rotateZ(-Math.PI / 2).translate(0.08, 0, 0);
  const carpusGeo = new THREE.CylinderGeometry(0.02, 0.018, 0.06, 10).rotateZ(-Math.PI / 2).translate(0.03, 0, 0);
  const handGeo = new THREE.SphereGeometry(1, 18, 12).scale(0.068, 0.036, 0.042).translate(0.06, 0, 0);
  const fingerGeo = new THREE.CylinderGeometry(0.004, 0.015, 0.08, 8).rotateZ(-Math.PI / 2).translate(0.04, 0, 0);
  for (const side of [1, -1]) {
    const shoulder = new THREE.Object3D();
    shoulder.position.set(side * 0.16, 0.1, 0.14);
    shoulder.rotation.y = side > 0 ? -0.6 : Math.PI + 0.6;
    const upper = new THREE.Object3D(); shoulder.add(upper);
    const merus = new THREE.Mesh(merusGeo, shell); merus.castShadow = true; upper.add(merus);
    const elbow = new THREE.Object3D(); elbow.position.x = 0.16; upper.add(elbow);
    elbow.add(new THREE.Mesh(kneeGeo, jointMat));
    const carpus = new THREE.Mesh(carpusGeo, shell); carpus.castShadow = true; elbow.add(carpus);
    const wrist = new THREE.Object3D(); wrist.position.x = 0.06; elbow.add(wrist);
    const hand = new THREE.Mesh(handGeo, shell); hand.castShadow = true; wrist.add(hand);
    const fixedFinger = new THREE.Mesh(fingerGeo, shellDark); fixedFinger.position.set(0.11, -0.012, 0); wrist.add(fixedFinger);
    const dactylPivot = new THREE.Object3D(); dactylPivot.position.set(0.105, 0.014, 0); wrist.add(dactylPivot);
    const dactyl = new THREE.Mesh(fingerGeo, shellDark); dactyl.rotation.z = 0.2; dactylPivot.add(dactyl);
    upper.rotation.z = -0.35; elbow.rotation.z = 0.6;
    group.add(shoulder);
    claws.push({ side, upper, elbow, dactylPivot, rest: { upper: -0.35, elbow: 0.6, dactyl: 0.2 } });
  }

  // --- route and behaviour -----------------------------------------------------------------------------
  const ROUTE = [
    { x: -1.9, z: 1.45, pause: [1.2, 2.6] },
    { x: 0.1, z: 1.25, pause: [2.5, 4.5], gesture: true },     // in front of the castle gateway
    { x: 1.0, z: 0.85, pause: [0.6, 1.6] },
    { x: 2.45, z: 1.05, pause: [2.0, 4.0], gesture: true },
    { x: 3.1, z: 0.95, pause: [1.5, 3.0], forward: true },
  ];
  const state = { wp: 1, dir: 1, pause: 0, yaw: 0, speed: 0, phase: 0, moveDir: new THREE.Vector3(1, 0, 0), gesture: null, gestureT: 0, lastYaw: 0 };
  group.position.set(ROUTE[0].x, groundHeightAt(ROUTE[0].x, ROUTE[0].z) + CRAB_BODY_H, ROUTE[0].z);
  // plant the feet at their home positions
  group.updateMatrixWorld(true);
  for (const leg of legs) {
    _cv[0].copy(leg.home).add(group.position);
    leg.foot.set(_cv[0].x, groundHeightAt(_cv[0].x, _cv[0].z), _cv[0].z);
  }

  const obstacles = [];
  function setObstacles(list) { obstacles.length = 0; obstacles.push(...list); }
  let snailProbe = null;   // () => Vector3 | null, set once the bottom snail exists

  function startGesture() {
    const claw = claws[rng.float() < 0.5 ? 0 : 1];
    state.gesture = { claw, t: 0, dur: rng.range(1.4, 2.2), open: rng.range(0.35, 0.6), lift: rng.range(0.25, 0.6) };
  }

  function update(dt) {
    const pos = group.position;
    let turning = 0;
    if (state.pause > 0) {
      state.pause -= dt;
      state.speed = damp(state.speed, 0, 6, dt);
    } else {
      const wp = ROUTE[state.wp];
      _cv[1].set(wp.x - pos.x, 0, wp.z - pos.z);
      const dist = _cv[1].length();
      if (dist < 0.05) {
        state.pause = rng.range(wp.pause[0], wp.pause[1]);
        if (wp.gesture && rng.float() < 0.8) startGesture();
        state.wp += state.dir;
        if (state.wp >= ROUTE.length || state.wp < 0) { state.dir *= -1; state.wp += 2 * state.dir; }
        state.wp = clamp(state.wp, 0, ROUTE.length - 1);
      } else {
        _cv[1].divideScalar(dist);
        state.moveDir.copy(_cv[1]);
        const desiredYaw = wp.forward ? Math.atan2(_cv[1].x, _cv[1].z) : 0;   // sideways by default: rostrum to the viewer
        const dy = angleDelta(state.yaw, desiredYaw);
        const step = clamp(dy, -1.3 * dt, 1.3 * dt);
        state.yaw += step;
        turning = Math.abs(step);
        const blocked = snailProbe && snailProbe() && _cv[2].copy(snailProbe()).sub(pos).length() < 0.45 && _cv[2].normalize().dot(_cv[1]) > 0.3;
        if (Math.abs(dy) > 0.15 || blocked) state.speed = damp(state.speed, 0, 8, dt);
        else state.speed = damp(state.speed, 0.13, 2.5, dt);
        if (state.speed > 0.004) {
          _cv[3].set(pos.x + _cv[1].x * state.speed * dt, 0, pos.z + _cv[1].z * state.speed * dt);
          let hit = false;
          for (const o of obstacles) {
            if (o.isBox3) { if (_cbox.copy(o).expandByScalar(0.22).containsPoint(_cv[3])) { hit = true; break; } }
            else if (_cv[4].set(_cv[3].x, o.center.y, _cv[3].z).distanceTo(o.center) < o.radius + 0.22) { hit = true; break; }
          }
          _cv[3].x = clamp(_cv[3].x, TANK.ixMin + 0.35, TANK.ixMax - 0.35);
          _cv[3].z = clamp(_cv[3].z, TANK.izMin + 0.3, TANK.izMax - 0.3);
          if (!hit) { pos.x = _cv[3].x; pos.z = _cv[3].z; state.blockedT = 0; }
          else { state.pause = Math.max(state.pause, 0.8); state.blockedT = (state.blockedT || 0) + dt; if (state.blockedT > 4) { state.blockedT = 0; state.wp = clamp(state.wp + state.dir, 0, ROUTE.length - 1); } }
        }
      }
    }
    group.rotation.y = state.yaw;
    pos.y = damp(pos.y, groundHeightAt(pos.x, pos.z) + CRAB_BODY_H, 10, dt);

    // gait phase: driven by distance travelled (plus turning), and finishing a swing when stopped
    const moving = state.speed > 0.004 || turning > 1e-4;
    let canStart = moving;
    if (moving) state.phase += (state.speed * dt) / CRAB_STRIDE + turning * 0.22 / CRAB_STRIDE;
    else {
      // let any leg that is mid-swing finish its step, then hold
      const anySwing = legs.some((l) => l.swinging);
      if (anySwing) {
        canStart = true;
        const frac = state.phase % 0.5;
        state.phase += Math.min(dt * 1.6, 0.5 - frac);
      }
    }
    updateLegs(canStart);
    // claw gesture
    if (state.gesture) {
      const g = state.gesture; g.t += dt;
      const k = Math.min(1, g.t / g.dur);
      const env = Math.sin(Math.PI * k);                     // rise, hold, release
      g.claw.upper.rotation.z = g.claw.rest.upper + g.lift * env;
      g.claw.elbow.rotation.z = g.claw.rest.elbow - 0.3 * env;
      g.claw.dactylPivot.rotation.z = g.open * env * (0.7 + 0.3 * Math.sin(g.t * 9));
      if (k >= 1) { g.claw.upper.rotation.z = g.claw.rest.upper; g.claw.elbow.rotation.z = g.claw.rest.elbow; g.claw.dactylPivot.rotation.z = 0; state.gesture = null; }
    } else {
      const idle = Math.sin(SIM.time * 0.8) * 0.03;
      for (const c of claws) { c.upper.rotation.z = c.rest.upper + idle * c.side; c.dactylPivot.rotation.z = 0.04 + 0.03 * Math.sin(SIM.time * 1.3 + c.side); }
    }
    // eyes and mouthparts
    for (const e of eyeStalks) {
      e.stalk.rotation.y = 0.3 * Math.sin(SIM.time * 1.7 + e.phase);
      e.stalk.rotation.x = -0.25 + 0.12 * Math.sin(SIM.time * 2.3 + e.phase * 2.0);
    }
    for (let i = 0; i < 2; i++) mouthparts[i].rotation.x = 0.15 * Math.sin(SIM.time * 6 + i * Math.PI);
  }

  function updateLegs(canStart) {
    const pos = group.position;
    const quat = group.quaternion;
    const half = state.phase % 1;
    const active = half < 0.5 ? 0 : 1;
    const tau = (half % 0.5) / 0.5;
    const speedK = clamp(state.speed / 0.13, 0, 1);
    for (const leg of legs) {
      if (leg.group === active && (canStart || leg.swinging)) {
        if (!leg.swinging) {
          leg.swinging = true;
          leg.from.copy(leg.foot);
          _cv[5].copy(leg.home).applyQuaternion(quat).add(pos);
          _cv[5].addScaledVector(state.moveDir, CRAB_STRIDE * 0.5 * speedK);
          _cv[5].x = clamp(_cv[5].x, TANK.ixMin + 0.05, TANK.ixMax - 0.05);
          _cv[5].z = clamp(_cv[5].z, TANK.izMin + 0.05, TANK.izMax - 0.05);
          leg.to.set(_cv[5].x, groundHeightAt(_cv[5].x, _cv[5].z), _cv[5].z);
        }
        const k = smoothstep(0, 1, tau);
        leg.foot.lerpVectors(leg.from, leg.to, k);
        leg.foot.y = lerp(leg.from.y, leg.to.y, k) + Math.sin(tau * Math.PI) * 0.035;
        if (tau >= 0.999) { leg.foot.copy(leg.to); leg.swinging = false; }
      } else {
        leg.swinging = false;     // stance: the foot stays planted where it landed
      }
      // two-link IK
      _cv[6].copy(leg.foot).sub(pos).applyQuaternion(_cq1.copy(quat).invert()).sub(leg.hip.position);
      const dx = leg.side > 0 ? _cv[6].x : -_cv[6].x;
      const theta = Math.atan2(_cv[6].z, dx);
      const d = Math.hypot(dx, _cv[6].z);
      let r = Math.hypot(d, _cv[6].y);
      r = clamp(r, 0.1, L1 + L2 - 0.012);
      const phi = Math.atan2(_cv[6].y, d);
      const A = Math.acos(clamp((L1 * L1 + r * r - L2 * L2) / (2 * L1 * r), -1, 1));
      const B = Math.acos(clamp((L1 * L1 + L2 * L2 - r * r) / (2 * L1 * L2), -1, 1));
      leg.hip.rotation.y = leg.baseYaw + (leg.side > 0 ? -theta : theta);
      leg.upper.rotation.z = phi + A;
      leg.knee.rotation.z = -(Math.PI - B);
    }
  }

  parent.add(group);
  SIM.add((dt) => update(dt));
  return { group, legs, claws, state, setObstacles, setSnailProbe(fn) { snailProbe = fn; }, update };
}


// ─────────────────────────── 105_snails.js ───────────────────────────
// Stage 13 — two snails. Shared shell/body builders, different patterns and different surfaces:
// one crawls over the substrate (and a small stone), the other clings to the inside of the front glass.
// Snail local frame: +Z forward (head), +Y up (away from the surface the foot rests on).

function buildShellGeometry({ turns = 3.3, R = 0.07, growth = 2.6, segs = 220, radial = 20, spire = 0.42 } = {}) {
  const k = Math.log(growth) / TWO_PI;
  const c = (growth - 1) / 2;
  const pos = [], uv = [], idx = [];
  const aMax = TWO_PI * turns;
  for (let i = 0; i <= segs; i++) {
    const u = i / segs, a = u * aMax;
    const rc = R * Math.exp(k * (a - aMax));
    const z = spire * R * (1 - rc / R);
    const rt = c * rc * (1 + 0.4 * smoothstep(0.94, 1.0, u));
    const ca = Math.cos(a), sa = Math.sin(a);
    for (let j = 0; j <= radial; j++) {
      const th = (j / radial) * TWO_PI;
      const ct = Math.cos(th), st = Math.sin(th);
      pos.push((rc + rt * ct) * ca, (rc + rt * ct) * sa, z + rt * st * 0.85);
      uv.push(u, j / radial);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}

function buildSnailBodyGeometry(length = 0.4) {
  const segs = 44, radial = 22;
  const pos = [], uv = [], idx = [];
  // s: 0 tail → 1 head tip. width / height / centre height along the body
  const w = profileFn([[0, 0.05], [0.08, 0.5], [0.25, 0.92], [0.45, 1.0], [0.62, 0.9], [0.78, 0.6], [0.86, 0.5], [0.93, 0.62], [0.97, 0.5], [1, 0.02]], 0.052);
  const h = profileFn([[0, 0.3], [0.1, 0.75], [0.3, 1.0], [0.55, 0.95], [0.75, 0.6], [0.85, 0.45], [0.93, 0.55], [1, 0.05]], 0.085);
  for (let i = 0; i <= segs; i++) {
    const s = i / segs;
    const z = lerp(-0.2, 0.2, s) * (length / 0.4);
    const ww = w(s), hh = h(s);
    for (let j = 0; j <= radial; j++) {
      const th = (j / radial) * TWO_PI;
      const sy = Math.sin(th), cx = Math.cos(th);
      // flat sole: clamp the lower part of the ellipse
      const y = Math.max(sy, -0.12) * hh + hh * 0.12;
      const x = cx * ww * (1 - 0.1 * Math.max(0, sy));
      pos.push(x, y, z); uv.push(s, j / radial);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}

const SNAIL_FOOT_VS_HEAD = /* glsl */`
uniform float uTime;
varying vec2 vSUv;`;
const SNAIL_FOOT_VS_BODY = /* glsl */`
{
  vSUv = uv;
  // muscular foot: a slow wave runs along the sole edges
  float edge = pow( abs( position.x ) / 0.052, 2.0 );
  transformed.y += 0.0035 * edge * sin( uv.x * 28.0 - uTime * 5.0 ) * smoothstep( 0.02, 0.1, uv.x );
}`;

function snailMaterials(palette) {
  const shell = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.28, metalness: 0.05, clearcoat: 0.8, clearcoatRoughness: 0.15, envMapIntensity: 0.8 });
  enhanceMaterial(shell, {
    id: 'snail-shell-' + palette.id, caustics: 0.5, varyWorld: false,
    vertexHead: 'varying vec2 vShellUv;', vertexBody: 'vShellUv = uv;',
    fragmentHead: `varying vec2 vShellUv; uniform vec3 uBase; uniform vec3 uBand; uniform vec3 uCrest;`,
    fragmentColor: palette.shellGLSL,
    uniforms: palette.uniforms,
  });
  const body = new THREE.MeshPhysicalMaterial({ color: palette.body, roughness: 0.62, metalness: 0, sheen: 0.5, sheenRoughness: 0.7, sheenColor: new THREE.Color(palette.body).multiplyScalar(1.2), clearcoat: 0.15, clearcoatRoughness: 0.6 });
  enhanceMaterial(body, { id: 'snail-body-' + palette.id, caustics: 0.5, uniforms: { uTime: SIM_UNIFORMS.uTime }, vertexHead: SNAIL_FOOT_VS_HEAD, vertexBody: SNAIL_FOOT_VS_BODY });
  return { shell, body };
}

const SNAIL_PALETTES = {
  // Snail A: warm amber-brown shell with fine growth bands
  amber: {
    id: 'amber', body: 0xb98a5a,
    shellGLSL: /* glsl */`
      diffuseColor.rgb = uBase;
      float band = smoothstep( 0.55, 0.95, sin( vShellUv.x * 6.2831853 * 46.0 + 2.0 * sin( vShellUv.x * 30.0 ) ) );
      diffuseColor.rgb = mix( diffuseColor.rgb, uBand, band * 0.55 );
      float crest = smoothstep( 0.3, 1.0, cos( vShellUv.y * 6.2831853 ) );
      diffuseColor.rgb = mix( diffuseColor.rgb, uCrest, crest * 0.35 );`,
    uniforms: { uBase: { value: new THREE.Vector3(0.62, 0.34, 0.13) }, uBand: { value: new THREE.Vector3(0.28, 0.13, 0.05) }, uCrest: { value: new THREE.Vector3(0.85, 0.62, 0.35) } },
  },
  // Snail B: cream-olive shell with dark spiral stripes
  olive: {
    id: 'olive', body: 0xcfc7a8,
    shellGLSL: /* glsl */`
      diffuseColor.rgb = uBase;
      float sp = fract( vShellUv.y * 3.0 + 0.08 * sin( vShellUv.x * 40.0 ) );
      float stripe = smoothstep( 0.42, 0.46, sp ) * ( 1.0 - smoothstep( 0.62, 0.66, sp ) );
      diffuseColor.rgb = mix( diffuseColor.rgb, uBand, stripe * 0.85 );
      float speck = step( 0.86, fract( sin( dot( floor( vShellUv * vec2( 160.0, 60.0 ) ), vec2( 12.9898, 78.233 ) ) ) * 43758.5453 ) );
      diffuseColor.rgb = mix( diffuseColor.rgb, uBand, speck * 0.5 );
      float crest = smoothstep( 0.3, 1.0, cos( vShellUv.y * 6.2831853 ) );
      diffuseColor.rgb = mix( diffuseColor.rgb, uCrest, crest * 0.3 );`,
    uniforms: { uBase: { value: new THREE.Vector3(0.80, 0.74, 0.52) }, uBand: { value: new THREE.Vector3(0.22, 0.24, 0.10) }, uCrest: { value: new THREE.Vector3(0.95, 0.92, 0.75) } },
  },
};

function buildSnail(paletteKey, scale = 1) {
  const palette = SNAIL_PALETTES[paletteKey];
  const mats = snailMaterials(palette);
  const group = new THREE.Group();
  group.name = 'snail-' + paletteKey;
  group.scale.setScalar(scale);

  const body = new THREE.Mesh(buildSnailBodyGeometry(0.4), mats.body);
  body.castShadow = true; body.receiveShadow = true;
  body.customDepthMaterial = deformedDepthMaterial({ id: 'snail-foot', uniforms: { uTime: SIM_UNIFORMS.uTime }, vertexHead: SNAIL_FOOT_VS_HEAD, vertexBody: SNAIL_FOOT_VS_BODY });
  group.add(body);

  // shell: coiled in the XY plane with its axis along Z and the spire tip at +Z.
  const turns = paletteKey === 'amber' ? 3.25 : 3.4;
  const R = paletteKey === 'amber' ? 0.068 : 0.062;
  const growth = paletteKey === 'amber' ? 2.55 : 2.9;
  const shellGeo = buildShellGeometry({ R, growth, turns, spire: paletteKey === 'amber' ? 0.45 : 0.3 });
  const shell = new THREE.Mesh(shellGeo, mats.shell);
  shell.castShadow = true; shell.receiveShadow = true;
  // Euler XYZ applies Z first (spin about the coiling axis so the aperture lands on +Y), then X
  // (tip up, aperture toward the tail).
  const aEnd = (turns % 1) * TWO_PI;
  shell.rotation.set(-Math.PI / 2, 0, Math.PI / 2 - aEnd);
  shell.position.set(0.008, 0.075, -0.02);
  group.add(shell);
  // dark interior seen through the aperture
  {
    const k = Math.log(growth) / TWO_PI;
    const a = turns * TWO_PI;
    const tan = new THREE.Vector3(-Math.sin(a) + k * Math.cos(a), Math.cos(a) + k * Math.sin(a), 0).normalize();
    const c = (growth - 1) / 2;
    const disc = new THREE.Mesh(new THREE.CircleGeometry(c * R * 1.4 * 0.92, 24), new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 0.9, side: THREE.DoubleSide }));
    disc.position.set(R * Math.cos(a), R * Math.sin(a), 0).addScaledVector(tan, -0.004);
    disc.lookAt(disc.position.clone().add(tan));
    shell.add(disc);
  }

  // head: tentacles on pivots so they can explore
  const tentMat = new THREE.MeshPhysicalMaterial({ color: palette.body, roughness: 0.55, sheen: 0.4, sheenColor: new THREE.Color(palette.body) });
  const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x0a0806, roughness: 0.1, clearcoat: 1 });
  const tentacles = [];
  for (const side of [1, -1]) {
    const pivot = new THREE.Object3D();
    pivot.position.set(side * 0.022, 0.04, 0.19);
    const geo = new THREE.CylinderGeometry(0.0025, 0.0055, 0.075, 8).translate(0, 0.0375, 0);
    const t = new THREE.Mesh(geo, tentMat);
    t.castShadow = true;
    pivot.add(t);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0065, 10, 8), eyeMat);
    eye.position.y = 0.077;
    pivot.add(eye);
    pivot.rotation.set(0.5, 0, side * 0.45);
    group.add(pivot);
    tentacles.push({ pivot, side });
  }
  return { group, body, shell, tentacles, palette };
}

// ---------------------------------------------------------------------------------------------
// Behaviour
// ---------------------------------------------------------------------------------------------
const _nq = new THREE.Quaternion(), _nm = new THREE.Matrix4(), _nv = Array.from({ length: 6 }, () => new THREE.Vector3());

function createBottomSnail(parent, crab) {
  const snail = buildSnail('amber', 1.0);
  const group = snail.group;
  parent.add(group);
  const stone = LAYOUT.stones[2];
  const speed = 0.035;
  let theta = 0.6;
  const normal = new THREE.Vector3(0, 1, 0);
  let wait = 0;
  SIM.add((dt) => {
    // stay clear of the crab: wait if it is close
    const crabPos = crab ? crab.group.position : null;
    const distCrab = crabPos ? Math.hypot(crabPos.x - group.position.x, crabPos.z - group.position.z) : 99;
    if (distCrab < 0.45) wait = Math.max(wait, 0.6);
    if (wait > 0) wait -= dt; else theta += (speed / 0.3) * dt;
    // a slow Lissajous loop that crosses the small stone, so the snail climbs over it
    const x = stone.x + 0.32 * Math.sin(theta) + 0.08;
    const z = stone.z + 0.26 * Math.sin(2 * theta + 0.7) + 0.06;
    const y = groundHeightAt(x, z);
    group.position.set(x, y + 0.002, z);
    // heading = path tangent
    const x2 = stone.x + 0.32 * Math.sin(theta + 0.02) + 0.08, z2 = stone.z + 0.26 * Math.sin(2 * (theta + 0.02) + 0.7) + 0.06;
    _nv[0].set(x2 - x, 0, z2 - z);
    if (_nv[0].lengthSq() < 1e-8) _nv[0].set(1, 0, 0);
    _nv[0].normalize();
    substrateNormal(x, z, _nv[1]);
    // include the stone's slope
    if (Math.hypot(x - stone.x, z - stone.z) < stone.r * 0.95) { _nv[1].set(x - stone.x, 0.9 * stone.r * stone.squash, z - stone.z).normalize(); }
    normal.lerp(_nv[1], 1 - Math.exp(-3 * dt)).normalize();
    // forward projected onto the surface plane
    _nv[0].addScaledVector(normal, -_nv[0].dot(normal)).normalize();
    _nv[2].crossVectors(normal, _nv[0]);
    _nm.makeBasis(_nv[2], normal, _nv[0]);
    _nq.setFromRotationMatrix(_nm);
    group.quaternion.slerp(_nq, 1 - Math.exp(-4 * dt));
    animateTentacles(snail, 1);
  });
  return snail;
}

function createGlassSnail(parent) {
  const snail = buildSnail('olive', 0.95);
  const group = snail.group;
  parent.add(group);
  const glassZ = TANK.izMax;                  // inner face of the front pane
  const A = new THREE.Vector2(1.15, 0.62), B = new THREE.Vector2(1.62, 1.42);
  const speed = 0.02;
  let t = 0, dir = 1, turning = 0, heading = new THREE.Vector2(), targetHeading = new THREE.Vector2();
  heading.set(B.x - A.x, B.y - A.y).normalize();
  targetHeading.copy(heading);
  SIM.add((dt) => {
    if (turning > 0) {
      // rotate in place toward the way back
      turning -= dt;
      heading.lerp(targetHeading, 1 - Math.exp(-0.35 * dt)).normalize();
      if (turning <= 0) heading.copy(targetHeading);
    } else {
      t += (speed / 0.94) * dir * dt;
      if (t >= 1) { t = 1; dir = -1; turning = 9; targetHeading.set(A.x - B.x, A.y - B.y).normalize(); }
      else if (t <= 0) { t = 0; dir = 1; turning = 9; targetHeading.set(B.x - A.x, B.y - A.y).normalize(); }
    }
    const px = lerp(A.x, B.x, t), py = lerp(A.y, B.y, t);
    // foot exactly on the pane, shell pointing into the water
    group.position.set(px, py, glassZ);
    _nv[0].set(heading.x, heading.y, 0).normalize();          // forward, in the pane plane
    _nv[1].set(0, 0, -1);                                       // up = away from the glass
    _nv[2].crossVectors(_nv[1], _nv[0]);                        // right
    _nm.makeBasis(_nv[2], _nv[1], _nv[0]);
    group.quaternion.slerp(_nq.setFromRotationMatrix(_nm), 1 - Math.exp(-6 * dt));
    animateTentacles(snail, 1.4);
  });
  return snail;
}

function animateTentacles(snail, amount) {
  const t = SIM.time;
  for (const tc of snail.tentacles) {
    const k = tc.side;
    tc.pivot.rotation.x = 0.5 + amount * (0.12 * Math.sin(t * 1.1 + k) + 0.05 * Math.sin(t * 3.7 + k * 2));
    tc.pivot.rotation.z = -k * (0.45 + 0.1 * Math.sin(t * 0.9 + k * 1.5));
  }
}


// ─────────────────────────── 10_textures.js ───────────────────────────
// Procedural textures — everything is drawn at runtime on canvases (no image assets).

function makePeriodicNoise(seed, period) {
  const rng = mulberry32(seed);
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const grad = new Float32Array(256);
  for (let i = 0; i < 256; i++) grad[i] = rng() * 2 - 1;
  const fade = (t) => t * t * (3 - 2 * t);
  const wrap = (v) => ((v % period) + period) % period;
  return function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const X = wrap(xi), Y = wrap(yi), X1 = wrap(xi + 1), Y1 = wrap(yi + 1);
    const v00 = grad[perm[perm[X] + Y] & 255], v10 = grad[perm[perm[X1] + Y] & 255];
    const v01 = grad[perm[perm[X] + Y1] & 255], v11 = grad[perm[perm[X1] + Y1] & 255];
    const u = fade(x - xi), v = fade(y - yi);
    return lerp(lerp(v00, v10, u), lerp(v01, v11, u), v) * 1.6;
  };
}

function makeCanvasTexture(w, h, draw, { srgb = true, repeat = [1, 1], anisotropy = 8 } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = anisotropy;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Seamless fBm mottling, used as a multiply map for stone, shells and pebbles.
function mottleTexture(size = 256, seed = 7, { octaves = 5, scale = 3, lo = 0.62, hi = 1.0, tint = [1, 1, 1] } = {}) {
  const noises = [];
  for (let i = 0; i < octaves; i++) noises.push(makePeriodicNoise(seed * 31 + i, scale << i));
  const img = new ImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let sum = 0, amp = 1, norm = 0;
      for (let o = 0; o < octaves; o++) { sum += noises[o]((x / size) * (scale << o), (y / size) * (scale << o)) * amp; norm += amp; amp *= 0.55; }
      const n = clamp(0.5 + 0.5 * (sum / norm) * 1.9, 0, 1);
      const v = lerp(lo, hi, n);
      const i = (y * size + x) * 4;
      d[i] = Math.min(255, v * tint[0] * 255); d[i + 1] = Math.min(255, v * tint[1] * 255); d[i + 2] = Math.min(255, v * tint[2] * 255); d[i + 3] = 255;
    }
  }
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  canvas.getContext('2d').putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// Fine gravel seen between the pebbles.
function gravelTexture(size = 512, seed = 3) {
  const rng = new Rng(seed);
  // low-contrast palette: the lighting (shadows, caustics) should carry the detail, not the albedo
  const palette = [[150, 138, 116], [132, 128, 122], [104, 104, 106], [92, 86, 80], [128, 110, 92], [166, 160, 146], [84, 80, 76]];
  return makeCanvasTexture(size, size, (ctx, w, h) => {
    ctx.fillStyle = '#5a5044';
    ctx.fillRect(0, 0, w, h);
    const count = Math.floor((size * size) / 70);
    for (let i = 0; i < count; i++) {
      const c = rng.pick(palette);
      const jitter = rng.range(-10, 10);
      const fill = `rgb(${c[0] + jitter},${c[1] + jitter},${c[2] + jitter})`;
      const x = rng.range(0, w), y = rng.range(0, h);
      const rx = rng.range(2.6, 7.0), ry = rx * rng.range(0.65, 1.0), rot = rng.range(0, Math.PI);
      for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
        const px = x + ox, py = y + oy;
        if (px < -8 || py < -8 || px > w + 8 || py > h + 8) continue;
        ctx.save(); ctx.translate(px, py); ctx.rotate(rot);
        const g = ctx.createRadialGradient(-rx * 0.3, -ry * 0.35, rx * 0.1, 0, 0, rx * 1.1);
        g.addColorStop(0, 'rgba(255,250,240,0.22)');
        g.addColorStop(0.4, fill);
        g.addColorStop(1, 'rgba(40,32,26,0.75)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TWO_PI); ctx.fill();
        ctx.restore();
      }
    }
  }, { repeat: [5, 3] });
}

// Coursed, weathered stone blocks for the castle.
function stoneTexture(w = 1024, h = 512, seed = 11, { courses = 7, hue = 36, sat = 9, light = 52 } = {}) {
  const rng = new Rng(seed);
  const grain = makePeriodicNoise(seed + 5, 64);
  return makeCanvasTexture(w, h, (ctx) => {
    ctx.fillStyle = `hsl(${hue}, 8%, 24%)`;
    ctx.fillRect(0, 0, w, h);
    const rowH = h / courses;
    for (let r = 0; r < courses; r++) {
      const y0 = r * rowH;
      let x = -rng.range(0, 180);
      while (x < w) {
        const bw = rng.range(95, 190);
        const l = light + rng.range(-9, 8), s = sat + rng.range(-3, 5);
        ctx.fillStyle = `hsl(${hue + rng.range(-6, 6)}, ${s}%, ${l}%)`;
        ctx.fillRect(x + 2, y0 + 2, bw - 4, rowH - 4);
        // bevel: light top/left edge, dark bottom/right edge
        ctx.fillStyle = 'rgba(255,246,228,0.22)';
        ctx.fillRect(x + 2, y0 + 2, bw - 4, 3); ctx.fillRect(x + 2, y0 + 2, 3, rowH - 4);
        ctx.fillStyle = 'rgba(20,16,12,0.30)';
        ctx.fillRect(x + 2, y0 + rowH - 6, bw - 4, 4); ctx.fillRect(x + bw - 6, y0 + 2, 4, rowH - 4);
        // pitting
        const pits = rng.int(2, 7);
        for (let k = 0; k < pits; k++) {
          const px = x + rng.range(8, bw - 8), py = y0 + rng.range(8, rowH - 8), pr = rng.range(1.5, 5);
          const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
          g.addColorStop(0, 'rgba(30,24,18,0.45)'); g.addColorStop(1, 'rgba(30,24,18,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, TWO_PI); ctx.fill();
        }
        x += bw;
      }
    }
    // grain
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const n = grain((x / w) * 64, (y / h) * 32) * 0.10 + grain((x / w) * 256, (y / h) * 128) * 0.05;
      d[i] = clamp(d[i] * (1 + n), 0, 255); d[i + 1] = clamp(d[i + 1] * (1 + n), 0, 255); d[i + 2] = clamp(d[i + 2] * (1 + n), 0, 255);
    }
    ctx.putImageData(img, 0, 0);
    // cracks
    ctx.strokeStyle = 'rgba(24,18,14,0.55)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (let c = 0; c < 9; c++) {
      let px = rng.range(0, w), py = rng.range(0, h);
      ctx.beginPath(); ctx.moveTo(px, py);
      const segs = rng.int(3, 7);
      for (let s = 0; s < segs; s++) { px += rng.range(-30, 30); py += rng.range(8, 34); ctx.lineTo(px, py); }
      ctx.stroke();
    }
    // weathering stains (cool / greenish)
    for (let c = 0; c < 14; c++) {
      const px = rng.range(0, w), py = rng.range(0, h), pr = rng.range(40, 150);
      const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
      const greenish = rng.float() < 0.5;
      g.addColorStop(0, greenish ? 'rgba(70,96,60,0.22)' : 'rgba(40,52,62,0.20)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(px - pr, py - pr, pr * 2, pr * 2);
    }
  });
}

// Black filter sponge: dark rubber with lighter ridges and dark pores.
function spongeTexture(size = 256, seed = 5) {
  const rng = new Rng(seed);
  return makeCanvasTexture(size, size, (ctx, w, h) => {
    ctx.fillStyle = '#1b1b1d'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 1500; i++) {
      const x = rng.range(0, w), y = rng.range(0, h), r = rng.range(1.2, 5.5);
      for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
        const px = x + ox, py = y + oy;
        if (px < -8 || py < -8 || px > w + 8 || py > h + 8) continue;
        ctx.fillStyle = 'rgba(70,70,74,0.9)'; ctx.beginPath(); ctx.arc(px, py + 0.8, r, 0, TWO_PI); ctx.fill();
        ctx.fillStyle = 'rgba(3,3,4,1)'; ctx.beginPath(); ctx.arc(px, py, r * 0.78, 0, TWO_PI); ctx.fill();
      }
    }
  }, { repeat: [2, 2] });
}

// Small soft disc used by suspended particles (rendered as points).
function softDiscTexture(size = 64) {
  return makeCanvasTexture(size, size, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }, { srgb: false });
}


// ─────────────────────────── 110_particles.js ───────────────────────────
// Suspended particles: a few hundred faint specks that reveal depth and the shared current.
function createParticles(parent, count = 260) {
  const rng = new Rng(808);
  const pos = new Float32Array(count * 3), seed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = rng.range(TANK.ixMin + 0.1, TANK.ixMax - 0.1);
    pos[i * 3 + 1] = rng.range(0.5, TANK.waterLevel - 0.15);
    pos[i * 3 + 2] = rng.range(TANK.izMin + 0.1, TANK.izMax - 0.1);
    seed[i] = rng.float();
  }
  const geo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', posAttr);
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: SIM_UNIFORMS.uTime, uMap: { value: softDiscTexture(64) }, uSize: { value: 2.4 }, uPixelRatio: { value: 1 }, uOpacity: { value: 0.42 } },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uSize;
      uniform float uPixelRatio;
      attribute float aSeed;
      varying float vA;
      void main() {
        vec4 mv = modelViewMatrix * vec4( position, 1.0 );
        gl_Position = projectionMatrix * mv;
        float tw = 0.55 + 0.45 * sin( uTime * 0.8 + aSeed * 30.0 );
        gl_PointSize = uSize * uPixelRatio * ( 0.6 + 0.4 * aSeed ) * tw * ( 6.0 / max( -mv.z, 0.5 ) );
        vA = tw;
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uMap;
      uniform float uOpacity;
      varying float vA;
      void main() {
        float a = texture2D( uMap, gl_PointCoord ).a;
        gl_FragColor = vec4( vec3( 0.85, 0.95, 1.0 ), a * uOpacity * vA );
      }`,
    transparent: true, depthWrite: false, depthTest: true,
  });
  const points = new THREE.Points(geo, mat);
  points.name = 'particles';
  points.frustumCulled = false;
  points.renderOrder = 21;
  parent.add(points);
  const v = new THREE.Vector3();
  SIM.add((dt, t) => {
    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      currentField(pos[i3], pos[i3 + 1], pos[i3 + 2], t, v);
      // a private slow drift keeps the specks from moving in lockstep
      v.x += 0.01 * Math.sin(t * 0.4 + seed[i] * 20.0);
      v.y += 0.006 * Math.cos(t * 0.3 + seed[i] * 11.0);
      v.z += 0.01 * Math.cos(t * 0.35 + seed[i] * 7.0);
      pos[i3] += v.x * dt; pos[i3 + 1] += v.y * dt; pos[i3 + 2] += v.z * dt;
      if (pos[i3 + 1] > TANK.waterLevel - 0.12) pos[i3 + 1] = 0.45;
      if (pos[i3 + 1] < 0.4) pos[i3 + 1] = TANK.waterLevel - 0.15;
      if (pos[i3] > TANK.ixMax - 0.08) pos[i3] = TANK.ixMin + 0.08; else if (pos[i3] < TANK.ixMin + 0.08) pos[i3] = TANK.ixMax - 0.08;
      if (pos[i3 + 2] > TANK.izMax - 0.08) pos[i3 + 2] = TANK.izMin + 0.08; else if (pos[i3 + 2] < TANK.izMin + 0.08) pos[i3 + 2] = TANK.izMax - 0.08;
    }
    posAttr.needsUpdate = true;
  });
  return points;
}


// ─────────────────────────── 125_world.js ───────────────────────────
// Assembles everything that lives inside (and around) the tank.
function buildWorld(scene, optics, env, lights) {
  const group = new THREE.Group();
  group.name = 'world';
  scene.add(group);
  const obstacles = [];           // Box3 volumes that fish must avoid

  const pebbles = createPebbleBed(group);
  const castle = createCastle(group);
  obstacles.push(...castle.obstacles);
  const filter = createFilter(group, env);
  obstacles.push(filter.obstacle);
  const bubbles = new BubbleSystem(group, env, lights);
  bubbles.setSource(filter.outletWorld, filter.outletDir, 15);
  const plants = createPlants(group);
  const plantSpheres = [];
  for (const key of Object.keys(plants)) {
    const pl = LAYOUT.plants[key];
    plantSpheres.push(new THREE.Sphere(new THREE.Vector3(pl.x, substrateHeight(pl.x, pl.z) + 0.3, pl.z), 0.42));
  }
  const stoneSpheres = ACCENT_STONES.map((st) => new THREE.Sphere(new THREE.Vector3(st.x, st.cy, st.z), st.r * 1.1));
  obstacles.push(...plantSpheres, ...stoneSpheres);

  const crab = createCrab(group, env);
  crab.setObstacles([...castle.obstacles, ...plantSpheres.map((s) => new THREE.Sphere(s.center.clone().setY(substrateHeight(s.center.x, s.center.z)), 0.3)), ...stoneSpheres]);
  const snailA = createBottomSnail(group, crab);
  const snailB = createGlassSnail(group);
  crab.setSnailProbe(() => snailA.group.position);

  const fish = createFishSchool(group, obstacles);
  const particles = createParticles(group);

  return { group, obstacles, pebbles, castle, filter, bubbles, plants, crab, snailA, snailB, fish, particles };
}


// ─────────────────────────── 20_water.js ───────────────────────────
// Water state shared by the GPU (surface, glass, caustics) and the CPU (bubbles, ripples).
// One wave model drives displacement, normals, refraction and the caustic light pattern.

const WAVE_COUNT = 8;
const CAUSTIC_WAVE_COUNT = 5;
const RIPPLE_MAX = 24;
const RIPPLE_LIFE = 3.0;
const RIPPLE_SPEED = 0.85;      // ring expansion (units / s)
const MENISCUS_HEIGHT = 0.022;
const MENISCUS_WIDTH = 0.09;

const WAVES = [];
(function initWaves() {
  const rng = new Rng(2024);
  const lambda = [2.7, 1.75, 1.25, 0.92, 0.66, 0.47, 0.19, 0.12];
  const ampScale = [1, 1, 1, 1, 1, 1, 0.075, 0.05];
  for (let i = 0; i < WAVE_COUNT; i++) {
    const k = TWO_PI / lambda[i];
    const omega = Math.sqrt(9.81 * k) * 0.9;        // deep-water dispersion, slowed for an indoor tank
    const ang = rng.range(0, TWO_PI);
    WAVES.push({
      dx: Math.cos(ang), dz: Math.sin(ang), k, omega,
      amp: 0.0058 * Math.pow(lambda[i], 1.05) * ampScale[i],
      phase: rng.range(0, TWO_PI),
      // light focusing is driven by the longer waves so the caustic net stays readable (~0.6 u cells)
      caustic: [1.6, 1.5, 1.3, 0.9, 0.35, 0, 0, 0][i],
    });
  }
})();

const waveUniforms = {
  uWaveA: { value: WAVES.map((w) => new THREE.Vector4(w.dx, w.dz, w.k, w.omega)) },
  uWaveB: { value: WAVES.map((w) => new THREE.Vector4(w.amp, w.phase, w.caustic, 0)) },
};

// --- expanding rings where bubbles reach the surface ---------------------------------------
const RIPPLES = {
  items: [],
  vecs: Array.from({ length: RIPPLE_MAX }, () => new THREE.Vector4(0, 0, -100, 0)),
  uniforms: { uRipples: { value: null }, uRippleCount: { value: 0 } },
};
function spawnRipple(x, z, time, strength = 1) {
  // Aggregate arrivals that land together so the surface stays calm and the loop stays short.
  let best = null, bestD = 0.17;
  for (const r of RIPPLES.items) {
    if (time - r.start > 0.35) continue;
    const d = Math.hypot(r.x - x, r.z - z);
    if (d < bestD) { best = r; bestD = d; }
  }
  if (best) { best.strength = Math.min(1.5, best.strength + strength * 0.45); return; }
  if (RIPPLES.items.length >= RIPPLE_MAX) {
    let oldest = 0;
    for (let i = 1; i < RIPPLES.items.length; i++) if (RIPPLES.items[i].start < RIPPLES.items[oldest].start) oldest = i;
    RIPPLES.items.splice(oldest, 1);
  }
  RIPPLES.items.push({ x, z, start: time, strength });
}
function updateRipples(time) {
  RIPPLES.items = RIPPLES.items.filter((r) => time - r.start < RIPPLE_LIFE);
  for (let i = 0; i < RIPPLES.items.length; i++) {
    const r = RIPPLES.items[i];
    RIPPLES.vecs[i].set(r.x, r.z, r.start, r.strength);
  }
  RIPPLES.uniforms.uRipples.value = RIPPLES.vecs;
  RIPPLES.uniforms.uRippleCount.value = RIPPLES.items.length;
}
RIPPLES.uniforms.uRipples.value = RIPPLES.vecs;

// --- CPU mirror of the shader height field --------------------------------------------------
function waveHeightAt(x, z, t) {
  let h = 0;
  for (let i = 0; i < WAVE_COUNT; i++) {
    const w = WAVES[i];
    h += w.amp * Math.sin((w.dx * x + w.dz * z) * w.k - w.omega * t + w.phase);
  }
  for (let i = 0; i < RIPPLES.items.length; i++) {
    const r = RIPPLES.items[i];
    const age = t - r.start;
    const dist = Math.hypot(x - r.x, z - r.z);
    const q = (dist - age * RIPPLE_SPEED) / (0.05 + age * 0.09);
    h += 0.02 * r.strength * Math.exp(-q * q) * Math.exp(-age * 1.5) * Math.cos(q * Math.PI);
  }
  const edge = Math.min(Math.min(x - TANK.ixMin, TANK.ixMax - x), Math.min(z - TANK.izMin, TANK.izMax - z));
  h += MENISCUS_HEIGHT * smoothstep(MENISCUS_WIDTH, 0, edge);
  return TANK.waterLevel + h;          // absolute height (the shader adds the same h to the rest level)
}

// --- layout of everything that sits on the substrate -----------------------------------------
const LAYOUT = {
  castle: { x: -0.35, z: -0.95, rotY: 0.10 },
  filter: { x: 2.95, z: -1.25 },
  plants: {
    vallisneria: { x: -3.3, z: -1.35 },
    anubias: { x: -2.8, z: 1.15 },
    javafern: { x: -2.2, z: -0.2 },
    cabomba: { x: 2.65, z: 0.35 },
  },
  // Larger accent stones (indices are stable; the bottom snail climbs stone 2)
  stones: [
    { x: 1.15, z: -0.5, r: 0.34, squash: 0.72 },
    { x: 1.6, z: 1.55, r: 0.27, squash: 0.62 },
    { x: -1.0, z: 0.62, r: 0.17, squash: 0.82 },
    { x: 3.25, z: 1.45, r: 0.21, squash: 0.68 },
    { x: -3.55, z: 0.3, r: 0.23, squash: 0.7 },
  ],
};

// --- substrate height field (also the simplified collision surface for bottom animals) ------
const SUBSTRATE = {
  noise: makeNoise2D(77),
  mounds: [
    { x: LAYOUT.plants.vallisneria.x, z: LAYOUT.plants.vallisneria.z, r: 0.75, h: 0.10 },
    { x: LAYOUT.plants.anubias.x, z: LAYOUT.plants.anubias.z, r: 0.55, h: 0.07 },
    { x: LAYOUT.plants.javafern.x, z: LAYOUT.plants.javafern.z, r: 0.5, h: 0.06 },
    { x: LAYOUT.plants.cabomba.x, z: LAYOUT.plants.cabomba.z, r: 0.55, h: 0.07 },
    { x: LAYOUT.castle.x, z: LAYOUT.castle.z, r: 1.3, h: 0.09 },
    { x: LAYOUT.filter.x, z: LAYOUT.filter.z, r: 0.6, h: 0.04 },
    { x: -1.0, z: 0.62, r: 0.4, h: 0.05 },
    { x: 1.15, z: -0.5, r: 0.55, h: 0.06 },
  ],
};
function substrateHeight(x, z) {
  // Gently sloped toward the viewer, with fine unevenness and mounds around plantings.
  let h = 0.17 + 0.10 * smoothstep(2.0, -2.0, z);
  h += 0.022 * fbm(SUBSTRATE.noise, x * 1.1 + 10, z * 1.1 + 10, 3);
  for (let i = 0; i < SUBSTRATE.mounds.length; i++) {
    const m = SUBSTRATE.mounds[i];
    const dx = x - m.x, dz = z - m.z;
    h += m.h * Math.exp(-(dx * dx + dz * dz) / (m.r * m.r));
  }
  return h;
}
function substrateNormal(x, z, out) {
  const e = 0.03;
  const hx = substrateHeight(x + e, z) - substrateHeight(x - e, z);
  const hz = substrateHeight(x, z + e) - substrateHeight(x, z - e);
  return out.set(-hx / (2 * e), 1, -hz / (2 * e)).normalize();
}

// --- the shared current: a gentle drift everywhere plus a localized updraft at the plume ---
const PLUME = new THREE.Vector3(LAYOUT.filter.x, 1.9, LAYOUT.filter.z);   // airlift outlet (updated by the filter)
const currentField = (function () {
  const tmp = new THREE.Vector3();
  return function currentField(x, y, z, t, out) {
    const sx = 0.035 * Math.sin(0.21 * t + z * 0.8) + 0.022 * Math.sin(0.13 * t + 1.7 + y * 0.5);
    const sz = 0.03 * Math.cos(0.17 * t + x * 0.6) + 0.016 * Math.cos(0.11 * t + 0.4);
    const dx = x - PLUME.x, dz = z - PLUME.z, dy = y - PLUME.y;
    const spread = 0.14 + 0.17 * Math.max(0, dy);
    const radial = Math.exp(-(dx * dx + dz * dz) / (spread * spread));
    const up = 0.95 * radial * smoothstep(-0.15, 0.45, dy);
    // weak inward entrainment near the base of the plume
    const d = Math.hypot(dx, dz);
    const pull = 0.06 * Math.exp(-(d * d) / 0.5) * (1 - smoothstep(-0.2, 0.9, dy)) * (d > 1e-4 ? 1 / d : 0);
    return out.set(sx - dx * pull, up, sz - dz * pull);
  };
})();

// GLSL twin of the CPU field (plants, particles and fins sample it on the GPU).
const CURRENT_GLSL = /* glsl */`
uniform vec3 uPlume;
vec3 currentField(vec3 p, float t) {
  float sx = 0.035 * sin(0.21 * t + p.z * 0.8) + 0.022 * sin(0.13 * t + 1.7 + p.y * 0.5);
  float sz = 0.03 * cos(0.17 * t + p.x * 0.6) + 0.016 * cos(0.11 * t + 0.4);
  vec2 dp = p.xz - uPlume.xz;
  float dy = p.y - uPlume.y;
  float spread = 0.14 + 0.17 * max(dy, 0.0);
  float radial = exp(-dot(dp, dp) / (spread * spread));
  float up = 0.95 * radial * smoothstep(-0.15, 0.45, dy);
  float d = length(dp);
  float pull = 0.06 * exp(-(d * d) / 0.5) * (1.0 - smoothstep(-0.2, 0.9, dy)) / max(d, 1e-3);
  return vec3(sx - dp.x * pull, up, sz - dp.y * pull);
}`;


// ─────────────────────────── 30_environment.js ───────────────────────────
// Renderer, camera, controls, lights, studio environment and the room the tank stands in.

const RENDER_BUDGET_PIXELS = 4.6e6;   // cap on internal resolution (device pixels)

function createRenderer(container) {
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;   // the optics pipeline triggers exactly one shadow update per frame
  renderer.autoClear = false;
  container.appendChild(renderer.domElement);
  renderer.domElement.tabIndex = 0;
  return renderer;
}

function createCamera() {
  const camera = new THREE.PerspectiveCamera(34, 1, 0.4, 140);
  camera.layers.enable(LAYER_WORLD);
  camera.layers.enable(LAYER_OPTIC);
  return camera;
}

const VIEW_HOME = { target: new THREE.Vector3(0.1, 2.3, 0.15), azimuth: 0.62, polar: 1.12, distance: 11.5 };

// Keeps the camera outside the tank and above the floor while panning / zooming.
const CAMERA_LIMITS = {
  targetMin: new THREE.Vector3(-1.6, 1.0, -0.9),
  targetMax: new THREE.Vector3(1.6, 3.6, 0.9),
  minDistance: 5.2,
  maxDistance: 23,
  minPolar: 0.30,
  maxPolar: 1.50,
  tankBox: new THREE.Box3(new THREE.Vector3(TANK.xMin - 0.35, -0.5, TANK.zMin - 0.35), new THREE.Vector3(TANK.xMax + 0.35, TANK.h + 0.45, TANK.zMax + 0.35)),
  minY: 0.9,
};

function createControls(camera, dom) {
  const controls = new OrbitControls(camera, dom);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.8;
  controls.panSpeed = 0.55;
  controls.screenSpacePanning = true;
  controls.minDistance = CAMERA_LIMITS.minDistance;
  controls.maxDistance = CAMERA_LIMITS.maxDistance;
  controls.minPolarAngle = CAMERA_LIMITS.minPolar;
  controls.maxPolarAngle = CAMERA_LIMITS.maxPolar;
  controls.zoomToCursor = false;
  return controls;
}

// Distance needed so the whole tank fits, depending on the viewport aspect.
function homeDistance(aspect, fovDeg) {
  const fov = THREE.MathUtils.degToRad(fovDeg);
  const base = VIEW_HOME.distance * (Math.tan(THREE.MathUtils.degToRad(17)) / Math.tan(fov / 2));
  // narrow screens need to back off so the 8-unit width still fits
  const narrow = aspect < 1.5 ? Math.pow(1.5 / Math.max(aspect, 0.45), 0.8) : 1;
  return clamp(base * narrow, 9.5, 30);
}

function applyHomeView(camera, controls, aspect) {
  const d = homeDistance(aspect, camera.fov);
  const sph = new THREE.Spherical(d, VIEW_HOME.polar, VIEW_HOME.azimuth);
  camera.position.setFromSpherical(sph).add(VIEW_HOME.target);
  controls.target.copy(VIEW_HOME.target);
  controls.update();
}

const _boxClamp = new THREE.Vector3();
function enforceCameraLimits(camera, controls) {
  const t = controls.target;
  t.x = clamp(t.x, CAMERA_LIMITS.targetMin.x, CAMERA_LIMITS.targetMax.x);
  t.y = clamp(t.y, CAMERA_LIMITS.targetMin.y, CAMERA_LIMITS.targetMax.y);
  t.z = clamp(t.z, CAMERA_LIMITS.targetMin.z, CAMERA_LIMITS.targetMax.z);
  // Never let the eye point sit inside the tank (or its margin), nor under the floor line.
  const box = CAMERA_LIMITS.tankBox;
  if (box.containsPoint(camera.position)) {
    _boxClamp.copy(camera.position).sub(controls.target);
    // push out along the dominant horizontal axis, or upward
    const p = camera.position;
    const dx = p.x > 0 ? box.max.x - p.x + 0.05 : p.x - box.min.x + 0.05;
    const dz = p.z > 0 ? box.max.z - p.z + 0.05 : p.z - box.min.z + 0.05;
    const dy = box.max.y - p.y + 0.05;
    if (dy <= dx && dy <= dz) p.y = box.max.y + 0.05;
    else if (dx < dz) p.x = p.x > 0 ? box.max.x + 0.05 : box.min.x - 0.05;
    else p.z = p.z > 0 ? box.max.z + 0.05 : box.min.z - 0.05;
  }
  if (camera.position.y < CAMERA_LIMITS.minY) camera.position.y = CAMERA_LIMITS.minY;
}

function createLights(scene) {

// A procedural studio: navy-teal gradient with a warm softbox overhead and cool side cards.
function buildStudioScene() {
  const scene = new THREE.Scene();
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(50, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: /* glsl */`varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        varying vec3 vDir;
        void main(){
          vec3 d = normalize(vDir);
          vec3 c = mix(vec3(0.012, 0.014, 0.02), vec3(0.05, 0.065, 0.075), smoothstep(-0.5, 0.9, d.y));
          // soft glow behind the tank
          float g = exp(-pow(acos(clamp(dot(d, normalize(vec3(0.0, 0.12, -1.0))), -1.0, 1.0)) * 1.5, 2.0));
          c += vec3(0.05, 0.12, 0.13) * g;
          gl_FragColor = vec4(c, 1.0);
        }`,
    })
  );
  scene.add(dome);
  const panel = (w, h, color, pos, lookAt) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(lookAt); scene.add(m); return m;
  };
  panel(7.5, 3.6, new THREE.Color(11.0, 10.2, 9.2), new THREE.Vector3(0, 12, 0), new THREE.Vector3(0, 0, 0));   // key softbox
  panel(5, 7, new THREE.Color(0.35, 0.5, 0.7), new THREE.Vector3(-18, 6, 4), new THREE.Vector3(0, 2, 0));          // cool card left
  panel(5, 7, new THREE.Color(0.25, 0.4, 0.55), new THREE.Vector3(18, 6, 2), new THREE.Vector3(0, 2, 0));          // cooler card right
  panel(12, 5, new THREE.Color(0.12, 0.16, 0.2), new THREE.Vector3(0, 4, 22), new THREE.Vector3(0, 2, 0));         // dim front card
  return scene;
}

function createStudioEnvironment(renderer, scene) {
  const studio = buildStudioScene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envRT = pmrem.fromScene(studio, 0.03, 0.1, 100);
  scene.environment = envRT.texture;
  scene.environmentIntensity = 0.8;
  const cubeRT = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
  const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
  cubeCam.update(renderer, studio);
  pmrem.dispose();
  // Studio meshes are only needed for the bake.
  studio.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  return { cube: cubeRT.texture, pmrem: envRT.texture };
}

// Background dome shared by the scene and the model inspector.

// ─────────────────────────── 40_optics.js ───────────────────────────
// Optics pipeline: refraction / reflection for the water surface and the glass panes.
//
//  pass 1  world (everything except the refracting interfaces)  -> rtWorld (HDR colour + depth)
//  pass 2  copy colour and linearised depth                      -> rtCopy   (never bound as a draw target afterwards)
//  pass 3  interfaces, back-to-front, sampling rtCopy             -> rtWorld  (depth from pass 1 is kept for occlusion)
//  pass 4  bloom + tone mapping                                   -> canvas
//
// The copy target is what prevents the recursive feedback that you would get from sampling a
// texture that is still attached to the active draw framebuffer.

const WATER_GLSL = /* glsl */`
#define NUM_WAVES ${WAVE_COUNT}
#define NUM_CAUSTIC_WAVES ${CAUSTIC_WAVE_COUNT}
#define MAX_RIPPLES ${RIPPLE_MAX}
uniform float uTime;
uniform vec4 uWaveA[NUM_WAVES];      // dir.x, dir.z, wavenumber, angular frequency
uniform vec4 uWaveB[NUM_WAVES];      // amplitude, phase, caustic weight, -
uniform vec4 uRipples[MAX_RIPPLES];  // x, z, start time, strength (active first)
uniform int uRippleCount;
uniform vec4 uInner;                 // inner glass faces: xMin, xMax, zMin, zMax
uniform float uWaterLevel;

float rippleShape(float dist, float age, float strength) {
  float q = (dist - age * ${RIPPLE_SPEED.toFixed(3)}) / (0.05 + age * 0.09);
  return 0.02 * strength * exp(-q * q) * exp(-age * 1.5) * cos(q * 3.14159265);
}

float waveHeight(vec2 p, float t) {
  float h = 0.0;
  for (int i = 0; i < NUM_WAVES; i++) {
    vec4 a = uWaveA[i]; vec4 b = uWaveB[i];
    h += b.x * sin(dot(a.xy, p) * a.z - a.w * t + b.y);
  }
  for (int i = 0; i < MAX_RIPPLES; i++) {
    if (i >= uRippleCount) break;
    vec4 r = uRipples[i];
    h += rippleShape(length(p - r.xy), t - r.z, r.w);
  }
  float edge = min(min(p.x - uInner.x, uInner.y - p.x), min(p.y - uInner.z, uInner.w - p.y));
  h += ${MENISCUS_HEIGHT.toFixed(3)} * smoothstep(${MENISCUS_WIDTH.toFixed(3)}, 0.0, edge);
  return h;
}

vec3 waveNormal(vec2 p, float t) {
  float e = 0.012;
  float h = waveHeight(p, t);
  float hx = waveHeight(p + vec2(e, 0.0), t);
  float hz = waveHeight(p + vec2(0.0, e), t);
  return normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
}

// Light focused by the surface, to first order: the curvature (Laplacian) of the same wave field
// sampled at the floor point. Concave-up crests concentrate light into bright ridges that travel
// with the waves; the effect is softer for objects that sit closer to the surface.
float causticLight(vec2 p, float t, float depth) {
  float lap = 0.0, norm = 0.0;
  for (int i = 0; i < NUM_CAUSTIC_WAVES; i++) {
    vec4 a = uWaveA[i]; vec4 b = uWaveB[i];
    float w = b.z * b.x * a.z * a.z;                 // amplitude · k² : how strongly a crest focuses
    lap += w * ( -sin( dot( a.xy, p ) * a.z - a.w * t + b.y ) );
    norm += w;
  }
  float f = clamp( ( lap / norm ) * 1.25, -1.0, 1.0 );   // -1 (defocusing) .. 1 (focusing)
  float k = clamp( depth / 4.3, 0.15, 1.0 );
  float I = pow( max( f * 0.5 + 0.5, 0.0 ), 3.0 ) * 1.5;    // soft net of bright ridges
  float shim = 0.0;
  for (int i = 0; i < MAX_RIPPLES; i++) {
    if (i >= uRippleCount) break;
    vec4 r = uRipples[i];
    shim += rippleShape( length( p - r.xy ), t - r.z, r.w ) * 14.0;
  }
  return 1.0 + I * 1.7 * k - 0.06 + shim * k;
}
`;

const OPTIC_COMMON_GLSL = /* glsl */`
uniform sampler2D uSceneCopy;     // rgb: world colour (linear HDR)   a: linear view-space depth
uniform samplerCube uEnvCube;
uniform mat4 uProj;                      // same object as camera.projectionMatrix
uniform float uEnvIntensity;
uniform vec2 uResolution;
uniform vec3 uAbsorb;             // per-unit extinction of the water
uniform vec3 uScatter;            // faint in-scattered water colour
uniform float uMaxPath;

float fresnelDielectric(float cosI, float eta) {   // eta = n_incident / n_transmitted
  float sinT2 = eta * eta * (1.0 - cosI * cosI);
  if (sinT2 >= 1.0) return 1.0;                     // total internal reflection
  float cosT = sqrt(1.0 - sinT2);
  float rs = (eta * cosI - cosT) / (eta * cosI + cosT);
  float rp = (eta * cosT - cosI) / (eta * cosT + cosI);
  return clamp(0.5 * (rs * rs + rp * rp), 0.0, 1.0);
}

vec2 edgeFade(vec2 uv, float w) {
  return smoothstep(vec2(0.0), vec2(w), uv) * (1.0 - smoothstep(vec2(1.0 - w), vec2(1.0), uv));
}

// Shades the water surface at world point P seen along V (surface -> eye). 'suv' is the screen
// position of the eye ray (S lies on the same ray as the fragment that calls this).
vec3 shadeWaterSurface(vec3 P, vec3 V, vec2 suv, float surfDepth) {
  vec3 N = waveNormal(P.xz, uTime);
  float side = dot(N, V) >= 0.0 ? 1.0 : -1.0;      // +1 seen from above, -1 from below
  vec3 n = N * side;
  float cosI = clamp(dot(n, V), 1e-4, 1.0);
  float eta = side > 0.0 ? ${(1 / WATER_IOR).toFixed(5)} : ${WATER_IOR.toFixed(3)};
  float F = fresnelDielectric(cosI, eta);

  vec3 rv = reflect(-V, n);
  vec3 env = textureLod(uEnvCube, rv, 1.1).rgb * uEnvIntensity;
  if (side < 0.0) env *= vec3(0.08, 0.14, 0.17);   // from below the surface mirrors the dark tank interior

  vec3 trans = vec3(0.0);
  if (F < 0.999) {
    vec3 R = refract(-V, n, eta);
    vec3 Pv = (viewMatrix * vec4(P, 1.0)).xyz;
    vec3 Rv = normalize((viewMatrix * vec4(R, 0.0)).xyz);
    if (Rv.z < -0.02) {
      // March the refracted ray through the depth buffer (coarse steps + bisection) so what we see
      // through the surface is where the bent ray really lands — stable at grazing angles and
      // along depth discontinuities.
      float straight = clamp(texture2D(uSceneCopy, suv).a - surfDepth, 0.0, uMaxPath);
      float Lmax = min(uMaxPath * 1.2, straight * 1.6 + 0.6);
      const int STEPS = 18;
      float dL = Lmax / float(STEPS);
      float L = 0.0, Lprev = 0.0;
      vec2 uv = suv, uvPrev = suv, cand = suv;
      bool hit = false;
      for (int i = 1; i <= STEPS; i++) {
        L = dL * float(i);
        vec4 cp = uProj * vec4(Pv + Rv * L, 1.0);
        cand = cp.xy / cp.w * 0.5 + 0.5;
        if (cand.x < 0.0 || cand.x > 1.0 || cand.y < 0.0 || cand.y > 1.0) break;
        float bufDepth = texture2D(uSceneCopy, cand).a;
        if (bufDepth < surfDepth + 0.02) break;                        // ran into something in front of the surface
        if (surfDepth + (-Rv.z) * L >= bufDepth) { hit = true; break; }  // crossed an opaque surface
        uvPrev = cand; Lprev = L;
      }
      if (hit) {
        uv = cand;
        for (int k = 0; k < 4; k++) {
          float Lm = 0.5 * (Lprev + L);
          vec4 cm = uProj * vec4(Pv + Rv * Lm, 1.0);
          vec2 cu = cm.xy / cm.w * 0.5 + 0.5;
          if (surfDepth + (-Rv.z) * Lm >= texture2D(uSceneCopy, cu).a) { L = Lm; uv = cu; } else { Lprev = Lm; uvPrev = cu; }
        }
      } else {
        uv = Lprev > 0.0 ? uvPrev : suv;
        L = max(Lprev, straight * 0.5);
      }
      vec3 bg = texture2D(uSceneCopy, uv).rgb;
      vec3 atten = exp(-uAbsorb * L);
      trans = bg * atten + uScatter * (1.0 - atten.r);
    } else {
      vec3 bg = texture2D(uSceneCopy, suv).rgb;
      trans = bg * exp(-uAbsorb * (uMaxPath * 0.4));
    }
  }
  return mix(trans, env, F);
}
`;

const FULLSCREEN_VS = /* glsl */`
varying vec2 vUv;
void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const COPY_FS = /* glsl */`
#include <packing>
uniform sampler2D tColor;
uniform sampler2D tDepth;
uniform float uNear;
uniform float uFar;
varying vec2 vUv;
void main() {
  vec3 c = texture2D(tColor, vUv).rgb;
  float d = texture2D(tDepth, vUv).x;
  gl_FragColor = vec4(c, -perspectiveDepthToViewZ(d, uNear, uFar));
}`;

const BRIGHT_FS = /* glsl */`
uniform sampler2D tSrc;
uniform vec2 uTexel;
uniform float uThreshold;
varying vec2 vUv;
void main() {
  vec3 c = (texture2D(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb + texture2D(tSrc, vUv + uTexel * vec2(1.0, -1.0)).rgb
          + texture2D(tSrc, vUv + uTexel * vec2(-1.0, 1.0)).rgb + texture2D(tSrc, vUv + uTexel * vec2(1.0, 1.0)).rgb) * 0.25;
  float l = max(c.r, max(c.g, c.b));
  float knee = 0.35;
  float s = clamp(l - uThreshold + knee, 0.0, 2.0 * knee);
  s = s * s / (4.0 * knee);
  float w = max(s, l - uThreshold) / max(l, 1e-4);
  gl_FragColor = vec4(c * w, 1.0);
}`;

const BLUR_FS = /* glsl */`
uniform sampler2D tSrc;
uniform vec2 uDir;
varying vec2 vUv;
void main() {
  vec3 c = texture2D(tSrc, vUv).rgb * 0.227027;
  c += (texture2D(tSrc, vUv + uDir * 1.3846).rgb + texture2D(tSrc, vUv - uDir * 1.3846).rgb) * 0.316216;
  c += (texture2D(tSrc, vUv + uDir * 3.2308).rgb + texture2D(tSrc, vUv - uDir * 3.2308).rgb) * 0.070270;
  gl_FragColor = vec4(c, 1.0);
}`;

const FINAL_FS = /* glsl */`
uniform sampler2D tColor;
uniform sampler2D tBloom;
uniform float uBloom;
uniform float uVignette;
varying vec2 vUv;
void main() {
  vec3 c = texture2D(tColor, vUv).rgb;
  c += texture2D(tBloom, vUv).rgb * uBloom;
  vec2 q = vUv - 0.5;
  c *= 1.0 - uVignette * dot(q, q) * 1.6;
  gl_FragColor = vec4(max(c, vec3(0.0)), 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

// Uniform objects shared by every material that needs the water state (GPU side of the simulation).
const SIM_UNIFORMS = {
  uTime: { value: 0 },
  uWaveA: waveUniforms.uWaveA,
  uWaveB: waveUniforms.uWaveB,
  uRipples: RIPPLES.uniforms.uRipples,
  uRippleCount: RIPPLES.uniforms.uRippleCount,
  uWaterLevel: { value: TANK.waterLevel },
  uPlume: { value: new THREE.Vector3(PLUME.x, PLUME.y, PLUME.z) },
};

class OpticsPipeline {
  constructor(renderer, scene, camera, env) {
    this.renderer = renderer;
    this.scene = scene;
    this.camera = camera;
    this.optics = [];                 // { mesh, center, outward, material }
    this.useBloom = true;

    const hdr = { type: THREE.HalfFloatType, depthBuffer: false, stencilBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false };
    this.rtWorld = new THREE.WebGLRenderTarget(4, 4, { ...hdr, depthBuffer: true });
    this.rtWorld.depthTexture = new THREE.DepthTexture(4, 4, THREE.UnsignedIntType);
    this.rtCopy = new THREE.WebGLRenderTarget(4, 4, hdr);
    this.rtBloomA = new THREE.WebGLRenderTarget(4, 4, hdr);
    this.rtBloomB = new THREE.WebGLRenderTarget(4, 4, hdr);

    // Shared uniform objects (same references are handed to every interface material).
    this.shared = {
      ...SIM_UNIFORMS,
      uSceneCopy: { value: this.rtCopy.texture },
      uProj: { value: camera.projectionMatrix },
      uEnvCube: { value: env.cube },
      uEnvIntensity: { value: 1.0 },
      uResolution: { value: new THREE.Vector2(4, 4) },
      uAbsorb: { value: new THREE.Vector3(0.032, 0.013, 0.008) },
      uScatter: { value: new THREE.Vector3(0.006, 0.02, 0.026) },
      uMaxPath: { value: 9.0 },
      uInner: { value: new THREE.Vector4(TANK.ixMin, TANK.ixMax, TANK.izMin, TANK.izMax) },
    };

    const fs = (fragmentShader, uniforms, extra = {}) => new THREE.ShaderMaterial({ uniforms, vertexShader: FULLSCREEN_VS, fragmentShader, depthTest: false, depthWrite: false, ...extra });
    this.copyMat = fs(COPY_FS, { tColor: { value: null }, tDepth: { value: null }, uNear: { value: camera.near }, uFar: { value: camera.far } });
    this.brightMat = fs(BRIGHT_FS, { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() }, uThreshold: { value: 1.7 } });
    this.blurMat = fs(BLUR_FS, { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } });
    this.finalMat = fs(FINAL_FS, { tColor: { value: null }, tBloom: { value: null }, uBloom: { value: 0.2 }, uVignette: { value: 0.12 } }, { depthTest: true, depthWrite: true });

    const tri = new THREE.BufferGeometry();
    tri.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
    this.tri = new THREE.Mesh(tri, this.copyMat);
    this.tri.frustumCulled = false;
    this.fsScene = new THREE.Scene();
    this.fsScene.add(this.tri);
    this.fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    this._c = new THREE.Vector3();
    this._o = new THREE.Vector3();
  }

  addOptic(mesh, center, outward) {
    mesh.layers.set(LAYER_OPTIC);
    this.optics.push({ mesh, center, outward, material: mesh.material });
  }

  setSize(width, height, pixelRatio) {
    const w = Math.max(2, Math.round(width * pixelRatio));
    const h = Math.max(2, Math.round(height * pixelRatio));
    this.rtWorld.setSize(w, h);
    this.rtCopy.setSize(w, h);
    const bw = Math.max(2, Math.round(w / 2)), bh = Math.max(2, Math.round(h / 2));
    this.rtBloomA.setSize(bw, bh);
    this.rtBloomB.setSize(bw, bh);
    this.shared.uResolution.value.set(w, h);
    this.width = w; this.height = h;
    this.brightMat.uniforms.uTexel.value.set(1 / w, 1 / h);
    this.bloomTexel = new THREE.Vector2(1 / bw, 1 / bh);
  }

  // Far panes first, then the surface, then near panes. The camera is always outside, so this
  // yields a correct back-to-front order for the interfaces.
  updateOpticOrder() {
    const cam = this.camera.position;
    const dWater = cam.distanceTo(this._o.set(0, TANK.waterLevel, 0));
    for (let i = 0; i < this.optics.length; i++) {
      const o = this.optics[i];
      const d = cam.distanceTo(o.center);
      o.mesh.renderOrder = d > dWater ? 1 : 3;
      if (o.material.uniforms.uEntry) o.material.uniforms.uEntry.value = this._c.copy(cam).sub(o.center).dot(o.outward) > 0 ? 1 : 0;
    }
  }

  blit(material, target) {
    this.tri.material = material;
    this.renderer.setRenderTarget(target);
    this.renderer.render(this.fsScene, this.fsCam);
  }

  render(time) {
    const r = this.renderer, cam = this.camera;
    this.shared.uTime.value = time;

    // pass 1 — world
    r.shadowMap.needsUpdate = true;
    cam.layers.set(LAYER_WORLD);
    r.setRenderTarget(this.rtWorld);
    r.setClearColor(0x000000, 1);
    r.clear(true, true, true);
    r.render(this.scene, cam);

    // pass 2 — colour + linear depth into the read-only copy
