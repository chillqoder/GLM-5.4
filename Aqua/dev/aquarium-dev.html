const GILL_GLSL = /* glsl */`
vec3 applyGill( vec3 c, float s, float ang, float at, float strength ) {
  float up = sin( ang ), side = cos( ang );
  float g = exp( -pow( ( s - at - 0.02 * up ) / 0.008, 2.0 ) ) * smoothstep( 0.15, 0.6, abs( side ) );
  c *= 1.0 - 0.35 * strength * g;
  c += vec3( 0.10 ) * strength * exp( -pow( ( s - at - 0.018 - 0.02 * up ) / 0.006, 2.0 ) ) * smoothstep( 0.15, 0.6, abs( side ) );
  c *= 1.0 - 0.5 * exp( -pow( s / 0.012, 2.0 ) ) * smoothstep( 0.1, 0.7, -up );   // mouth crease
  return c;
}`;

const GUPPY_BODY_GLSL = /* glsl */`
vec3 fishBodyColor() {
  float s = vAUv.x; float ang = vAUv.y * 6.2831853; float up = sin( ang );
  vec3 c = vec3( 0.58, 0.70, 0.82 );
  c = mix( c, vec3( 0.88, 0.93, 0.97 ), smoothstep( -0.1, -0.8, up ) );
  c = mix( c, vec3( 0.22, 0.33, 0.48 ), smoothstep( 0.35, 0.9, up ) );
  float n = vnoise( vec2( s * 7.0, ang * 1.6 ) ) * 0.6 + vnoise( vec2( s * 15.0 + 3.0, ang * 3.0 ) ) * 0.4;
  float pt = smoothstep( 0.56, 0.74, n ) * smoothstep( 0.36, 0.55, s );
  vec3 iri = mix( vec3( 0.05, 0.75, 0.65 ), vec3( 0.25, 0.9, 0.45 ), vnoise( vec2( s * 4.0, ang ) ) );
  c = mix( c, iri, pt * 0.8 );
  return applyGill( c, s, ang, 0.23, 1.0 );
}`;
const GUPPY_FIN_GLSL = /* glsl */`
vec4 fishFinColor() {
  float u = vAUv.x, v = vAUv.y; float mode = vAFlow.z;
  if ( mode > 1.5 && mode < 2.5 ) return vec4( 0.80, 0.88, 0.92, 0.55 - 0.35 * u );
  if ( mode < 0.9 ) {
    vec3 c = mix( vec3( 1.0, 0.28, 0.04 ), vec3( 1.0, 0.52, 0.1 ), u );
    float ray = smoothstep( 0.75, 1.0, abs( sin( v * 16.0 * 3.14159 ) ) );
    c *= 1.0 - 0.14 * ray;
    float sp = step( 0.82, hash21( floor( vec2( u, v ) * vec2( 24.0, 44.0 ) ) ) );
    c = mix( c, vec3( 0.3, 0.05, 0.03 ), sp * 0.7 * smoothstep( 0.1, 0.4, u ) );
    return vec4( c, 0.96 - 0.4 * smoothstep( 0.88, 1.0, u ) );
  }
  return vec4( mix( vec3( 0.9, 0.5, 0.22 ), vec3( 0.95, 0.68, 0.4 ), u ), 0.6 - 0.35 * u );
}`;

const CLOWN_BODY_GLSL = /* glsl */`
vec3 fishBodyColor() {
  float s = vAUv.x; float ang = vAUv.y * 6.2831853; float up = sin( ang );
  vec3 c = mix( vec3( 1.0, 0.36, 0.05 ), vec3( 1.0, 0.52, 0.14 ), smoothstep( -0.2, -0.9, up ) );
  c *= 1.0 - 0.12 * smoothstep( 0.5, 1.0, up );
  float wob = 0.022 * sin( ang * 3.0 + 1.0 ) + 0.012 * sin( ang * 7.0 + 2.0 );
  float d1 = abs( s - 0.19 - wob ), d2 = abs( s - 0.52 - wob - 0.03 * max( up, 0.0 ) ), d3 = abs( s - 0.88 - wob * 0.5 );
  float white = clamp( step( d1, 0.065 ) + step( d2, 0.075 ) + step( d3, 0.05 ), 0.0, 1.0 );
  float black = clamp( step( d1, 0.085 ) + step( d2, 0.095 ) + step( d3, 0.07 ), 0.0, 1.0 );
  c = mix( c, vec3( 0.02, 0.02, 0.02 ), black );
  c = mix( c, vec3( 0.98, 0.97, 0.95 ), white );
  return applyGill( c, s, ang, 0.3, 0.5 );
}`;
const CLOWN_FIN_GLSL = /* glsl */`
vec4 fishFinColor() {
  float u = vAUv.x, v = vAUv.y; float mode = vAFlow.z;
  if ( mode > 1.5 && mode < 2.5 ) { vec3 c = mix( vec3( 1.0, 0.45, 0.08 ), vec3( 1.0, 0.6, 0.2 ), u ); return vec4( c, 0.78 - 0.2 * u - 0.35 * smoothstep( 0.9, 1.0, u ) * 0.6 ); }
  vec3 c = mix( vec3( 1.0, 0.38, 0.06 ), vec3( 1.0, 0.5, 0.12 ), u );
  // dark edging
  float edge = smoothstep( 0.86, 0.96, u );
  c = mix( c, vec3( 0.03, 0.03, 0.03 ), edge * 0.9 );
  if ( mode < 0.9 ) {            // caudal: peduncle band continues onto the fin base
    float b = smoothstep( 0.0, 0.03, 0.3 - u );
    float k = smoothstep( 0.0, 0.03, 0.36 - u );
    c = mix( c, vec3( 0.02 ), k ); c = mix( c, vec3( 0.98, 0.97, 0.95 ), b );
  } else if ( mode > 1.0 && mode < 1.15 ) {   // dorsal: head band reaches its front base
    float b = smoothstep( 0.1, 0.06, v ) * ( 1.0 - smoothstep( 0.35, 0.5, u ) );
    c = mix( c, vec3( 0.98, 0.97, 0.95 ), b );
    c = mix( c, vec3( 0.02 ), smoothstep( 0.16, 0.12, v ) * ( 1.0 - smoothstep( 0.35, 0.5, u ) ) * ( 1.0 - b ) );
  }
  return vec4( c, 0.85 - 0.35 * smoothstep( 0.8, 1.0, u ) );
}`;

const ANGEL_BODY_GLSL = /* glsl */`
vec3 fishBodyColor() {
  float s = vAUv.x; float ang = vAUv.y * 6.2831853; float up = sin( ang );
  vec3 c = mix( vec3( 0.80, 0.82, 0.84 ), vec3( 0.95, 0.95, 0.93 ), smoothstep( 0.2, -0.6, up ) );
  c = mix( c, vec3( 0.42, 0.45, 0.5 ), smoothstep( 0.4, 1.0, up ) );
  float b = smoothstep( 0.035, 0.025, abs( s - 0.1 ) ) + smoothstep( 0.075, 0.06, abs( s - 0.45 - 0.02 * up ) ) + smoothstep( 0.05, 0.04, abs( s - 0.9 ) );
  c = mix( c, vec3( 0.06, 0.07, 0.08 ), clamp( b, 0.0, 1.0 ) * 0.92 );
  c += 0.05 * vnoise( vec2( s * 60.0, ang * 8.0 ) );

}`;
const ANGEL_FIN_GLSL = /* glsl */`
vec4 fishFinColor() {
  float u = vAUv.x, v = vAUv.y; float mode = vAFlow.z; float s = vAFlow.x;
  if ( mode > 2.5 ) return vec4( vec3( 0.32, 0.34, 0.38 ), 0.95 );
  if ( mode > 1.5 && mode < 2.5 ) return vec4( 0.8, 0.82, 0.84, 0.55 - 0.3 * u );
  vec3 c = vec3( 0.78, 0.80, 0.82 );
  float ray = smoothstep( 0.7, 1.0, sin( v * 11.0 * 3.14159 ) );
  c *= 1.0 - 0.22 * ray;
  float band = smoothstep( 0.075, 0.055, abs( s - 0.45 ) ) * ( 1.0 - smoothstep( 0.6, 1.0, u ) );

  c *= 1.0 - 0.25 * smoothstep( 0.85, 1.0, u );

const BETTA_BODY_GLSL = /* glsl */`
vec3 fishBodyColor() {
  float s = vAUv.x; float ang = vAUv.y * 6.2831853; float up = sin( ang );
  vec3 body = mix( vec3( 0.10, 0.12, 0.55 ), vec3( 0.35, 0.08, 0.5 ), vnoise( vec2( s * 5.0, ang * 2.0 ) ) * 0.8 + 0.1 );
  body = mix( body, vec3( 0.05, 0.06, 0.3 ), smoothstep( 0.5, 1.0, up ) );
  vec3 head = vec3( 0.08, 0.72, 0.78 );
  vec3 c = mix( body, head, smoothstep( 0.38, 0.12, s ) );
  float sc = sin( ang * 20.0 + s * 50.0 ) * sin( ang * 20.0 - s * 50.0 + 1.3 );
  c *= 0.92 + 0.16 * smoothstep( -0.2, 0.6, sc );
  c *= 1.0 - 0.12 * smoothstep( 0.0, -0.3, sc );
  return applyGill( c, s, ang, 0.26, 0.7 );

const BETTA_FIN_GLSL = /* glsl */`
vec4 fishFinColor() {
  float u = vAUv.x, v = vAUv.y; float mode = vAFlow.z;
  if ( mode > 2.5 ) return vec4( vec3( 0.12, 0.18, 0.55 ), 0.95 );
  if ( mode > 1.5 && mode < 2.5 ) return vec4( mix( vec3( 0.15, 0.6, 0.7 ), vec3( 0.4, 0.3, 0.75 ), u ), 0.6 - 0.25 * u );

// Species builders
// ---------------------------------------------------------------------------------------------
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const SIDE_R = V3(0, 0, 1), UP_V = V3(0, 1, 0);

function buildGuppy() {
  const x0 = 0.26, x1 = -0.26;
  const ry = profileFn([[0, 0], [0.02, 0.22], [0.05, 0.48], [0.1, 0.72], [0.2, 0.9], [0.34, 1.0], [0.5, 0.9], [0.7, 0.58], [0.85, 0.3], [1, 0.1]], 0.066);
  const rz = profileFn([[0, 0], [0.02, 0.28], [0.05, 0.55], [0.1, 0.78], [0.2, 0.94], [0.34, 1.0], [0.5, 0.92], [0.7, 0.65], [0.85, 0.38], [1, 0.13]], 0.046);
  const yc = profileFn([[0, 0], [0.3, -0.008], [0.6, 0], [1, 0.012]], 1);
  const body = buildBodyGeometry({ x0, x1, ry, rz, yc, asym: () => 0.12 });
  const xAt = (s) => lerp(x0, x1, s);
  const fins = [];
  // large triangular fan tail
  fins.push(buildFinGeometry(finRays(
    (t) => V3(x1 + 0.015, yc(1) + lerp(-0.024, 0.024, t), 0),
    (t) => { const fan = Math.sin(Math.PI * t); return V3(x1 - 0.33 * (0.74 + 0.26 * fan), yc(1) + lerp(-0.2, 0.2, t) * (0.8 + 0.2 * fan), 0); },
    16, SIDE_R, () => 1.0), 10, { bulge: 0.004, mode: 1.0 }));
  // dorsal
  fins.push(buildFinGeometry(finRays(
    (t) => { const s = lerp(0.5, 0.7, t); return V3(xAt(s), yc(s) + ry(s) * 0.92, 0); },
    (t) => { const s = lerp(0.5, 0.7, t); const tri = Math.sin(Math.PI * t); return V3(xAt(s) - 0.03 - 0.04 * t, yc(s) + ry(s) + 0.12 * tri, 0); },
    10, SIDE_R, (t) => lerp(0.5, 0.7, t)), 6, { bulge: 0.002, mode: 1.1 }));
  // anal
  fins.push(buildFinGeometry(finRays(
    (t) => { const s = lerp(0.58, 0.74, t); return V3(xAt(s), yc(s) - ry(s) * 0.92, 0); },
    (t) => { const s = lerp(0.58, 0.74, t); const tri = Math.sin(Math.PI * t); return V3(xAt(s) - 0.02 - 0.03 * t, yc(s) - ry(s) - 0.09 * tri, 0); },
    8, SIDE_R, (t) => lerp(0.58, 0.74, t)), 6, { bulge: 0.002, mode: 1.2 }));
  for (const side of [1, -1]) {
    // pelvic
    const s = 0.42;
    fins.push(buildFinGeometry(finRays(
      (t) => V3(xAt(s) - 0.02 + 0.03 * t, yc(s) - ry(s) * 0.85, side * 0.02),
      (t) => V3(xAt(s) - 0.08 - 0.03 * t, yc(s) - ry(s) - 0.075, side * (0.02 + 0.035 * t)),
      4, UP_V, () => s, 0.3 * side), 5, { mode: 1.3 }));
    // pectoral
    const sp = 0.3;
    const bp = V3(xAt(sp), yc(sp) - ry(sp) * 0.15, side * rz(sp) * 0.8);
    fins.push(buildFinGeometry(finRays(
      (t) => V3(bp.x + 0.02 * (t - 0.5), bp.y + 0.015 * (t - 0.5), bp.z),
      (t) => V3(bp.x - 0.1 - 0.04 * Math.sin(Math.PI * t), bp.y - 0.035 + 0.03 * t, bp.z + side * (0.06 + 0.05 * t)),
      6, UP_V, () => sp, 0.5 * side), 5, { mode: 2, bulge: 0.002 }));
  }
  return { body, fins: BufferGeometryUtils.mergeGeometries(fins, false), x0, x1, ry, rz, yc };
}

function buildClownfish() {
  const x0 = 0.41, x1 = -0.41;
  const ry = profileFn([[0, 0], [0.03, 0.5], [0.08, 0.78], [0.16, 0.95], [0.3, 1.0], [0.5, 0.97], [0.68, 0.78], [0.85, 0.45], [1, 0.14]], 0.155);
  const rz = profileFn([[0, 0], [0.03, 0.55], [0.08, 0.8], [0.16, 0.95], [0.3, 1.0], [0.5, 0.96], [0.68, 0.75], [0.85, 0.42], [1, 0.14]], 0.1);
  const yc = profileFn([[0, 0.01], [0.3, 0], [0.7, 0.0], [1, 0.02]], 1);
  const body = buildBodyGeometry({ x0, x1, ry, rz, yc, asym: () => 0.1 });
  const xAt = (s) => lerp(x0, x1, s);
  const fins = [];
  // rounded fan tail
  fins.push(buildFinGeometry(finRays(
    (t) => V3(x1 + 0.015, yc(1) + lerp(-0.03, 0.03, t), 0),
    (t) => { const q = (t - 0.5) * 2; return V3(x1 - 0.2 * (0.82 + 0.18 * Math.sqrt(Math.max(0, 1 - q * q))), yc(1) + lerp(-0.16, 0.16, t), 0); },
    16, SIDE_R, () => 1.0), 10, { bulge: 0.004, mode: 1.0 }));
  // dorsal
  fins.push(buildFinGeometry(finRays(
    (t) => { const s = lerp(0.26, 0.84, t); return V3(xAt(s), yc(s) + ry(s) * 0.93, 0); },
    (t) => { const s = lerp(0.26, 0.84, t); const h = Math.sin(Math.PI * Math.pow(t, 0.8)) * 0.13 + 0.02; return V3(xAt(s) - 0.03 * t, yc(s) + ry(s) + h, 0); },
    16, SIDE_R, (t) => lerp(0.26, 0.84, t)), 6, { bulge: 0.003, mode: 1.1 }));
  // anal
  fins.push(buildFinGeometry(finRays(
    (t) => { const s = lerp(0.52, 0.86, t); return V3(xAt(s), yc(s) - ry(s) * 0.93, 0); },
    (t) => { const s = lerp(0.52, 0.86, t); const h = Math.sin(Math.PI * Math.pow(t, 0.8)) * 0.1 + 0.02; return V3(xAt(s) - 0.03 * t, yc(s) - ry(s) - h, 0); },
    12, SIDE_R, (t) => lerp(0.52, 0.86, t)), 6, { bulge: 0.003, mode: 1.2 }));
  for (const side of [1, -1]) {
    const s = 0.4;
    fins.push(buildFinGeometry(finRays(
      (t) => V3(xAt(s) - 0.02 + 0.03 * t, yc(s) - ry(s) * 0.85, side * 0.025),
      (t) => V3(xAt(s) - 0.1 - 0.04 * t, yc(s) - ry(s) - 0.09, side * (0.025 + 0.04 * t)),
      4, UP_V, () => s, 0.3 * side), 5, { mode: 1.3 }));
    const sp = 0.25;
    const bp = V3(xAt(sp), yc(sp) - ry(sp) * 0.12, side * rz(sp) * 0.8);
    fins.push(buildFinGeometry(finRays(
      (t) => V3(bp.x + 0.025 * (t - 0.5), bp.y + 0.02 * (t - 0.5), bp.z),
      (t) => V3(bp.x - 0.13 - 0.05 * Math.sin(Math.PI * t), bp.y - 0.03 + 0.06 * (t - 0.5), bp.z + side * (0.08 + 0.06 * t)),
      7, UP_V, () => sp, 0.5 * side), 6, { mode: 2, bulge: 0.003 }));
  }
  return { body, fins: BufferGeometryUtils.mergeGeometries(fins, false), x0, x1, ry, rz, yc };
}

function buildAngelfish() {
  const x0 = 0.45, x1 = -0.45;
  const ry = profileFn([[0, 0], [0.02, 0.3], [0.05, 0.62], [0.1, 0.85], [0.2, 0.98], [0.38, 1.0], [0.55, 0.9], [0.7, 0.62], [0.85, 0.3], [1, 0.08]], 0.46);
  const rz = profileFn([[0, 0], [0.03, 0.5], [0.1, 0.9], [0.3, 1.0], [0.5, 0.85], [0.7, 0.55], [0.85, 0.3], [1, 0.12]], 0.075);
  const yc = profileFn([[0, 0.02], [0.4, 0], [1, 0.03]], 1);
  const body = buildBodyGeometry({ x0, x1, ry, rz, yc, asym: () => 0.05 });
  const xAt = (s) => lerp(x0, x1, s);
  const fins = [];
  // modest rounded tail
  fins.push(buildFinGeometry(finRays(
    (t) => V3(x1 + 0.015, yc(1) + lerp(-0.035, 0.035, t), 0),
    (t) => { const q = (t - 0.5) * 2; return V3(x1 - 0.22 * (0.8 + 0.2 * Math.sqrt(Math.max(0, 1 - q * q))), yc(1) + lerp(-0.17, 0.17, t), 0); },
    14, SIDE_R, () => 1.0), 8, { bulge: 0.003, mode: 1.0 }));
  // tall sail-like dorsal and anal fins
  const dorsalBase = (t) => { const s = lerp(0.24, 0.62, t); return V3(xAt(s), yc(s) + ry(s) * 0.9, 0); };
  const dorsalTip = (t) => V3(lerp(-0.02, -0.5, t), lerp(0.76, 0.62, t) - 0.08 * Math.sin(Math.PI * t), 0);
  fins.push(buildFinGeometry(finRays(dorsalBase, dorsalTip, 14, SIDE_R, (t) => lerp(0.24, 0.62, t)), 8, { bulge: 0.006, mode: 1.1 }));
  const analBase = (t) => { const s = lerp(0.3, 0.62, t); return V3(xAt(s), yc(s) - ry(s) * 0.9, 0); };
  const analTip = (t) => V3(lerp(-0.02, -0.5, t), lerp(-0.72, -0.58, t) + 0.08 * Math.sin(Math.PI * t), 0);

function buildBetta() {

    (t) => V3(x1 + 0.015, yc(1) + lerp(-0.03, 0.03, t), 0),
    (t) => { const a = lerp(-1.35, 1.35, t); const r = 0.5 * (1 + 0.06 * Math.sin(t * 9 * Math.PI)); return V3(x1 - 0.05 - r * Math.cos(a) * 0.92, yc(1) + r * Math.sin(a), 0); },

    20, SIDE_R, (t) => lerp(0.3, 0.96, t)), 10, { bulge: 0.01, ruffle: 0.02, mode: 1.1 }));

    18, SIDE_R, (t) => lerp(0.44, 0.97, t)), 10, { bulge: 0.01, ruffle: 0.02, mode: 1.2 }));

  }
  return { body, fins: BufferGeometryUtils.mergeGeometries(fins, false), x0, x1, ry, rz, yc };

function createFish(kind, seed = 1) {
  const spec = FISH_SPECS[kind];
  const geos = spec.build();
  const uniforms = {
    uTime: SIM_UNIFORMS.uTime,
    uBeat: { value: seed * 1.7 }, uAmp: { value: 0.5 }, uTurn: { value: 0 },
    uLen: { value: geos.x0 - geos.x1 }, uFinAmp: { value: spec.finAmp }, uPectFreq: { value: spec.pectFreq },
  };
  const root = new THREE.Group();
  root.name = 'fish-' + kind;
  const body = new THREE.Mesh(geos.body, fishBodyMaterial(spec, uniforms));
  body.castShadow = true; body.receiveShadow = true;
  body.customDepthMaterial = fishDepthMaterial(spec, uniforms);
  const fins = new THREE.Mesh(geos.fins, fishFinMaterial(spec, uniforms));
  fins.castShadow = false; fins.receiveShadow = false;
  fins.renderOrder = 8;
  root.add(body, fins);

  // glossy eyes with a metallic iris ring
  const s = spec.eyeS;
  const ex = lerp(geos.x0, geos.x1, s), ey = geos.yc(s) + geos.ry(s) * 0.4, ez = geos.rz(s) * 0.78, r = spec.eyeR;
  const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x07080a, roughness: 0.06, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03 });
  const irisMat = new THREE.MeshPhysicalMaterial({ color: spec.iris, roughness: 0.3, metalness: 0.85 });
  const eyeGeo = new THREE.SphereGeometry(r, 18, 14), irisGeo = new THREE.SphereGeometry(r * 1.14, 18, 14);
  for (const side of [1, -1]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat); eye.position.set(ex, ey, side * ez);
    const iris = new THREE.Mesh(irisGeo, irisMat); iris.position.set(ex - r * 0.4, ey, side * (ez - r * 0.3));
    root.add(eye, iris);
  }
  return { kind, spec, root, body, fins, uniforms, dims: { x0: geos.x0, x1: geos.x1 } };
}


// ─────────────────────────── 97_fish_behavior.js ───────────────────────────
// Stage 11 — autonomous swimming. Each fish has its own state machine, wander targets,
// acceleration / turn-rate limits, predictive wall and obstacle avoidance, separation from the
// other fish, banking, and a tail beat coupled to swimming effort.

const FISH_AGENTS = [];
const _X_AXIS = new THREE.Vector3(1, 0, 0);
const _sv1 = new THREE.Vector3(), _sv2 = new THREE.Vector3(), _sv3 = new THREE.Vector3(), _sv4 = new THREE.Vector3(), _sv5 = new THREE.Vector3(), _sv6 = new THREE.Vector3(), _sv7 = new THREE.Vector3();
const _sq1 = new THREE.Quaternion(), _sq2 = new THREE.Quaternion();
const _sray = new THREE.Ray();
const _sbox = new THREE.Box3();
const _ssphere = new THREE.Sphere();

// Does the segment a → b (inflated by radius) pass through any solid volume?
function segmentBlocked(a, b, radius, obstacles) {
  _sv7.subVectors(b, a);
  const len = _sv7.length();
  if (len < 1e-6) return false;
  _sray.set(a, _sv7.divideScalar(len));
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.isBox3) {
      _sbox.copy(o).expandByScalar(radius);
      const hit = _sray.intersectBox(_sbox, _sv6);
      if (hit && hit.distanceTo(a) <= len) return true;
    } else {
      _ssphere.set(o.center ?? o, (o.radius ?? 0) + radius);
      if (_sray.intersectSphere(_ssphere, _sv6) && _sv6.distanceTo(a) <= len) return true;
    }
  }
  return false;
}

// Steering force that keeps a point out of every solid volume (inflated by radius).
function avoidanceForce(point, radius, obstacles, out) {
  out.set(0, 0, 0);
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.isBox3) {
      _sbox.copy(o).expandByScalar(radius);
      if (_sbox.containsPoint(point)) {
        // push out along the axis of least penetration
        const dx1 = point.x - _sbox.min.x, dx2 = _sbox.max.x - point.x;
        const dy1 = point.y - _sbox.min.y, dy2 = _sbox.max.y - point.y;
        const dz1 = point.z - _sbox.min.z, dz2 = _sbox.max.z - point.z;
        const m = Math.min(dx1, dx2, dy1, dy2, dz1, dz2);
        if (m === dx1) out.x -= 3; else if (m === dx2) out.x += 3; else if (m === dy1) out.y -= 3; else if (m === dy2) out.y += 3; else if (m === dz1) out.z -= 3; else out.z += 3;
      } else {
        _sv6.set(clamp(point.x, _sbox.min.x, _sbox.max.x), clamp(point.y, _sbox.min.y, _sbox.max.y), clamp(point.z, _sbox.min.z, _sbox.max.z));
        const d = point.distanceTo(_sv6);
        if (d < radius) out.addScaledVector(_sv7.subVectors(point, _sv6).normalize(), (radius - d) * 2.5);
      }
    } else {
      const c = o.center ?? o;
      const rr = (o.radius ?? 0) + radius;
      const d = point.distanceTo(c);
      if (d < rr) out.addScaledVector(_sv7.subVectors(point, c).normalize(), (rr - d) * 3.0 + 0.5);
    }
  }
  return out;
}

class FishAgent {
  constructor(model, cfg, obstacles) {
    this.model = model;
    this.cfg = cfg;
    this.obstacles = obstacles;
    this.root = model.root;
    this.vel = new THREE.Vector3(1, 0, 0);
    this.target = new THREE.Vector3();
    this.heading = new THREE.Quaternion();     // yaw + pitch only (no bank)
    this.state = 'cruise';
    this.stateTimer = cfg.rng ? 0 : 0;
    this.retargetTimer = 0;
    this.turn = 0;
    this.speed = 0;
    this.stuck = 0;
    this.rng = new Rng(cfg.seed);
    this.beat = this.rng.range(0, TWO_PI);
    this._bounds = new THREE.Box3();
    this._inner = new THREE.Box3();
    // start somewhere sensible inside the preferred zone
    const b = this.bounds();
    this.root.position.set(
      this.rng.range(lerp(b.min.x, b.max.x, 0.3), lerp(b.min.x, b.max.x, 0.7)),
      this.rng.range(lerp(b.min.y, b.max.y, cfg.zone[0]), lerp(b.min.y, b.max.y, cfg.zone[1])),
      this.rng.range(lerp(b.min.z, b.max.z, 0.3), lerp(b.min.z, b.max.z, 0.7)),
    );
    this.vel.set(this.rng.sign(), 0, this.rng.range(-0.4, 0.4)).normalize().multiplyScalar(cfg.cruise);
    quaternionFromForward(this.vel, UP, this.heading);
    this.root.quaternion.copy(this.heading);
    this.pickTarget(true);
    this.nextState(true);
    FISH_AGENTS.push(this);
    SIM.add((dt) => this.update(dt));
  }

  bounds() {
    const m = this.cfg.margin;
    const ground = 0.42 + m.bottom;
    return this._bounds.set(
      _sv1.set(TANK.ixMin + m.side, ground, TANK.izMin + m.side),
      _sv2.set(TANK.ixMax - m.side, TANK.waterLevel - 0.12 - m.top, TANK.izMax - m.side),
    );
  }

  pickTarget(initial = false) {
    const cfg = this.cfg, b = this.bounds();
    const from = this.root.position;
    const inner = this._inner.set(b.min.x + 0.3, b.min.y + 0.15, b.min.z + 0.3, b.max.x - 0.3, b.max.y - 0.15, b.max.z - 0.3);
    for (let tries = 0; tries < 12; tries++) {
      let x, z;
      const roll = this.rng.float();
      if (roll < cfg.biasCentral) {           // cross the open, well-lit middle
        x = this.rng.range(-1.3, 1.7); z = this.rng.range(0.1, 1.5);
      } else if (roll < cfg.biasCentral + (cfg.biasPoints ? cfg.biasPoints.length * 0.07 : 0) && cfg.biasPoints) {
        const p = cfg.biasPoints[this.rng.int(0, cfg.biasPoints.length - 1)];   // curious visits
        x = p[0] + this.rng.gauss() * 0.45; z = p[1] + this.rng.gauss() * 0.45;
      } else {
        x = this.rng.range(inner.min.x, inner.max.x); z = this.rng.range(inner.min.z, inner.max.z);
      }
      x = clamp(x, inner.min.x, inner.max.x); z = clamp(z, inner.min.z, inner.max.z);
      const y = this.rng.range(lerp(inner.min.y, inner.max.y, cfg.zone[0]), lerp(inner.min.y, inner.max.y, cfg.zone[1]));
      this.target.set(x, y, z);
      if (!segmentBlocked(from, this.target, cfg.radius + 0.1, this.obstacles)) break;
      if (tries === 11) {
        // fall back to a short hop toward the tank centre
        this.target.copy(from).lerp(_sv3.set(0, clamp(from.y, b.min.y, b.max.y), 0), 0.25);
      }
    }
    this.retargetTimer = this.rng.range(cfg.retarget[0], cfg.retarget[1]);
  }

  nextState(initial = false) {
    const cfg = this.cfg, r = this.rng.float();
    if (this.state === 'hover') this.state = r < cfg.burstChance ? 'burst' : 'cruise';
    else if (this.state === 'burst') this.state = 'cruise';
    else this.state = r < cfg.hoverChance ? 'hover' : (r < cfg.hoverChance + cfg.burstChance ? 'burst' : 'cruise');
    const d = cfg.durations[this.state];
    this.stateTimer = this.rng.range(d[0], d[1]) * (initial ? 0.5 : 1);
    if (this.state !== 'hover' && (this.target.distanceTo(this.root.position) < 0.4 || this.rng.float() < 0.5)) this.pickTarget();
  }

  update(dt) {
    const cfg = this.cfg, u = this.model.uniforms, pos = this.root.position;
    this.stateTimer -= dt; this.retargetTimer -= dt;
    if (this.stateTimer <= 0) this.nextState();
    if (this.retargetTimer <= 0) this.pickTarget();

    const desiredSpeed = this.state === 'hover' ? 0.03 : this.state === 'burst' ? cfg.burst : cfg.cruise;
    const des = _sv1.copy(this.target).sub(pos);
    if (des.lengthSq() > 1e-8) des.normalize();
    des.multiplyScalar(desiredSpeed);

    // predictive wall avoidance on a look-ahead point
    const look = _sv2.copy(pos).addScaledVector(this.vel, 1.2);
    const b = this.bounds();
    if (look.x < b.min.x) des.x += (b.min.x - look.x) * 9; else if (look.x > b.max.x) des.x -= (look.x - b.max.x) * 9;
    if (look.y < b.min.y) des.y += (b.min.y - look.y) * 9; else if (look.y > b.max.y) des.y -= (look.y - b.max.y) * 9;
    if (look.z < b.min.z) des.z += (b.min.z - look.z) * 9; else if (look.z > b.max.z) des.z -= (look.z - b.max.z) * 9;
    // obstacles
    avoidanceForce(look, cfg.radius, this.obstacles, _sv3);
    des.add(_sv3);
    // separation from the other fish
    for (let i = 0; i < FISH_AGENTS.length; i++) {
      const o = FISH_AGENTS[i];
      if (o === this) continue;
      const d = look.distanceTo(o.root.position);
      const want = (cfg.radius + o.cfg.radius) * 1.15;
      if (d < want) des.addScaledVector(_sv4.subVectors(look, o.root.position).normalize(), (want - d) * 1.6);
    }
    // limited acceleration
    const acc = _sv4.copy(des).sub(this.vel);
    const maxA = cfg.accel * dt;
    if (acc.lengthSq() > maxA * maxA) acc.setLength(maxA);
    this.vel.add(acc);
    let sp = this.vel.length();
    const maxSp = this.state === 'burst' ? cfg.burst * 1.1 : cfg.cruise * 1.35;
    if (sp > maxSp) { this.vel.multiplyScalar(maxSp / sp); sp = maxSp; }
    if (this.state === 'hover') { this.vel.multiplyScalar(Math.exp(-2.5 * dt)); sp = this.vel.length(); }
    else if (sp < 0.06 && this.state === 'cruise') { this.stuck += dt; if (this.stuck > 1.5) { this.pickTarget(); this.state = 'burst'; this.stateTimer = 0.4; this.stuck = 0; } }
    else this.stuck = 0;

    const horiz = Math.hypot(this.vel.x, this.vel.z);
    const maxVy = horiz * 0.45 + 0.02;
    this.vel.y = clamp(this.vel.y, -maxVy, maxVy);
    this.speed = sp;

    // orientation: turn-rate limited slerp toward the velocity direction
    const fwd = _sv5.set(1, 0, 0).applyQuaternion(this.heading);
    const dir = sp > 1e-4 ? _sv6.copy(this.vel).normalize() : fwd;
    quaternionFromForward(dir, UP, _sq1);
    const angle = this.heading.angleTo(_sq1);
    const maxStep = cfg.turnRate * dt;
    if (angle > 1e-5) this.heading.slerp(_sq1, Math.min(1, maxStep / angle));
    // banking from the signed lateral turn
    const turnSig = clamp(fwd.x * dir.z - fwd.z * dir.x, -1, 1);
    this.turn = damp(this.turn, turnSig * clamp(sp / cfg.cruise, 0, 1.5), 4, dt);
    _sq2.setFromAxisAngle(_X_AXIS, -this.turn * cfg.bank);
    this.root.quaternion.copy(this.heading).multiply(_sq2);

    // integrate, then the hard safeguards
    pos.addScaledVector(this.vel, dt);
    const bb = this.bounds();
    pos.x = clamp(pos.x, bb.min.x, bb.max.x); pos.y = clamp(pos.y, bb.min.y, bb.max.y); pos.z = clamp(pos.z, bb.min.z, bb.max.z);
    avoidanceForce(pos, cfg.radius * 0.6, this.obstacles, _sv3);
    if (_sv3.lengthSq() > 0) pos.addScaledVector(_sv3, dt);
    for (let i = 0; i < FISH_AGENTS.length; i++) {
      const o = FISH_AGENTS[i];
      if (o === this) continue;
      const d = pos.distanceTo(o.root.position);
      const minD = (cfg.radius + o.cfg.radius) * 0.9;
      if (d < minD && d > 1e-4) pos.addScaledVector(_sv4.subVectors(pos, o.root.position).normalize(), (minD - d) * 0.5);
    }
    pos.x = clamp(pos.x, bb.min.x, bb.max.x); pos.y = clamp(pos.y, bb.min.y, bb.max.y); pos.z = clamp(pos.z, bb.min.z, bb.max.z);

    // animation follows effort
    const effort = clamp(sp / cfg.cruise, 0, 1.8);
    const freq = this.state === 'hover' ? 0.9 + 0.4 * Math.sin(SIM.time * 0.7 + cfg.seed) : 1.1 + 2.4 * Math.sqrt(effort);
    this.beat += dt * TWO_PI * freq;
    u.uBeat.value = this.beat;
    u.uAmp.value = damp(u.uAmp.value, this.state === 'hover' ? 0.14 : 0.2 + 0.8 * Math.min(1.4, effort), 3, dt);
    u.uTurn.value = this.turn * 0.6;
  }
}

    hoverChance: 0.4, burstChance: 0.05, durations: { cruise: [3, 7], hover: [1.5, 3.2], burst: [0.5, 1.0] },
    retarget: [5, 10], biasCentral: 0.4, biasPoints: null,
  },
};

function createFishSchool(parent, obstacles) {
  const agents = [];
  for (const kind of Object.keys(FISH_SPECS)) {
    const model = createFish(kind, 1);
    parent.add(model.root);
    agents.push(new FishAgent(model, FISH_BEHAVIOUR[kind], obstacles));
  }
  return agents;
}


// ─────────────────────────── 130_main.js ───────────────────────────
// Boot, composition, render loop, camera constraints, UI and adaptive quality.

function computePixelRatio(width, height, scale = 1) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const budget = RENDER_BUDGET_PIXELS * scale;
  // Supersample on low-DPI screens when the budget allows; never exceed the device ratio by much.
  return clamp(Math.sqrt(budget / Math.max(1, width * height)), 0.6, Math.max(dpr, 1.5));
}

(function startAquarium() {
  const $ = (id) => document.getElementById(id);
  const container = $('stage'), boot = $('boot'), ui = $('ui'), hint = $('hint');
  const btnPause = $('btn-pause'), btnReset = $('btn-reset');

  function fail(detail) {
    $('fallback-detail').textContent = detail;
    $('fallback').hidden = false;
    boot.classList.add('gone');
    window.__aquariumReady = true;
  }

  let renderer;
  try {
    renderer = createRenderer(container);
    if (!renderer.capabilities.isWebGL2) throw new Error('This browser does not provide WebGL 2.');
  } catch (err) {
    fail('WebGL 2 could not be initialised: ' + err.message);
    return;
  }

  try {
    const scene = new THREE.Scene();
    const camera = createCamera();
    const controls = createControls(camera, renderer.domElement);
    const lights = createLights(scene);
    const env = createStudioEnvironment(renderer, scene);
    const optics = new OpticsPipeline(renderer, scene, camera, env);
    const backdrop = createBackdrop(scene);
    const tank = createTank(optics);
    scene.add(tank.group);

    const world = buildWorld(scene, optics, env, lights);

    Object.assign(APP, { renderer, scene, camera, controls, lights, env, optics, tank, world, SIM, SIM_UNIFORMS });

    // ---------------------------------------------------------------- resize / quality
    let pixelRatio = 1;
    let userMoved = false;
    let firstLayout = true;
    const perf = { ema: 16.7, scale: 1, lastChange: 0 };
    // `reframe` re-applies the home view (first layout / window resize). Quality changes resize the
    // render targets without ever moving the camera.
    function resize(reframe = false) {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      pixelRatio = computePixelRatio(w, h, perf.scale);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      optics.setSize(w, h, pixelRatio);
      if (world.particles) world.particles.material.uniforms.uPixelRatio.value = pixelRatio;
      if (!userMoved && (reframe || firstLayout)) applyHomeView(camera, controls, camera.aspect);
      firstLayout = false;
    }
    window.addEventListener('resize', () => resize(true));
    resize(true);

    // Low frame rate → cheaper optics / shadows / resolution. Creatures, refraction and
    // reflections are never removed.
    function adaptQuality(rawDt) {
      perf.ema = lerp(perf.ema, Math.min(rawDt * 1000, 120), 0.04);
      const t = performance.now();
      if (SIM.time < 2.5 || t - perf.lastChange < 2500) return;     // ignore start-up (shader compilation)
      if (perf.ema > 23 && perf.scale > 0.6) {
        perf.scale = Math.max(0.6, perf.scale - 0.15);
        perf.lastChange = t;
        perf.ema = 16.7;
        if (perf.scale < 0.8) lights.key.shadow.mapSize.set(1024, 1024);
        resize(false);
      }
    }

    // ---------------------------------------------------------------- UI
    function setPaused(p) {
      SIM.paused = p;
      btnPause.textContent = p ? 'Resume' : 'Pause';
      btnPause.setAttribute('aria-pressed', p ? 'true' : 'false');
      btnPause.setAttribute('aria-label', p ? 'Resume animation' : 'Pause animation');
    }
    btnPause.addEventListener('click', () => setPaused(!SIM.paused));
    btnReset.addEventListener('click', () => { applyHomeView(camera, controls, camera.aspect); userMoved = false; });
    controls.addEventListener('start', () => { userMoved = true; hint.classList.add('faded'); });
    window.addEventListener('keydown', (e) => {
      if (e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); setPaused(!SIM.paused); }
      else if (e.code === 'KeyR') { applyHomeView(camera, controls, camera.aspect); userMoved = false; }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });

    // ---------------------------------------------------------------- loop
    const clock = new THREE.Clock();
    let fpsAcc = 0, fpsN = 0;
    warmUp(0.6);
    updateRipples(SIM.time);
    function animate() {
      requestAnimationFrame(animate);
      const rawDt = clock.getDelta();
      const dt = SIM.paused ? 0 : Math.min(rawDt, 0.05);   // clamp after a hidden tab resumes
      SIM.step(dt);
      updateRipples(SIM.time);
      SIM_UNIFORMS.uTime.value = SIM.time;
      controls.update();
      enforceCameraLimits(camera, controls);
      optics.render(SIM.time);
      adaptQuality(rawDt);
      fpsAcc += rawDt; fpsN++;
      if (fpsAcc > 1) { APP.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    }
    animate();

    boot.classList.add('gone');
    ui.classList.remove('hidden');
    window.__aquariumReady = true;
  } catch (err) {
    console.error(err);
    fail((err && err.message) ? err.message : String(err));
  }
})();


// ─────────────────────────── devtools.js ───────────────────────────
// Development hooks (dev builds only, never part of aquarium.html).
(function installDevTools() {
  const A = () => window.__dev.APP;
  const sph = new THREE.Spherical();
  function render() { A().optics.render(SIM.time); }
  window.__dev = {
    APP,
    glsl: { WATER_GLSL, OPTIC_COMMON_GLSL, CURRENT_GLSL },
    // az: radians around Y (0 = +Z front), polar: radians from +Y
    view({ az = VIEW_HOME.azimuth, polar = VIEW_HOME.polar, dist = VIEW_HOME.distance, target = VIEW_HOME.target.toArray() } = {}) {
      const { camera, controls } = A();
      sph.set(dist, polar, az);
      camera.position.setFromSpherical(sph).add(new THREE.Vector3(...target));
      controls.target.set(...target);
      controls.update();
      render();
    },
    home() { applyHomeView(A().camera, A().controls, A().camera.aspect); render(); },
    setPaused(p) { SIM.paused = !!p; },
    // advance the simulation without waiting for real time
    step(seconds) {
      const n = Math.max(0, Math.round(seconds * 60));
      for (let i = 0; i < n; i++) { SIM.step(1 / 60); updateRipples(SIM.time); }
      SIM_UNIFORMS.uTime.value = SIM.time;
      render();
      return SIM.time;
    },
    render,
    // scale every material's caustic contribution (1 = designed strength)
    caustics(v) { for (const u of CAUSTIC_STRENGTH_UNIFORMS) u.value = v * u.base; return CAUSTIC_STRENGTH_UNIFORMS.length; },
    stats() {
      const a = A(), r = a.renderer.info.render;
      const size = a.renderer.getDrawingBufferSize(new THREE.Vector2());
      return {
        time: +SIM.time.toFixed(2), paused: SIM.paused,
        calls: r.calls, triangles: r.triangles, lines: r.lines, points: r.points,
        programs: a.renderer.info.programs.length,
        geometries: a.renderer.info.memory.geometries, textures: a.renderer.info.memory.textures,
        pixelRatio: +a.renderer.getPixelRatio().toFixed(3), buffer: size.toArray(),
        camera: a.camera.position.toArray().map((v) => +v.toFixed(2)),
        fps: A().fps ? +A().fps.toFixed(1) : null,
      };
    },
    // Runs the simulation headlessly for `seconds` and reports constraint violations.
    check(seconds = 120) {
      const app = A();
      const w = app.world, dt = 1 / 60, n = Math.round(seconds / dt);
      const report = { seconds, fish: {}, crab: {}, snails: {} };
      for (const ag of w.fish) {
        report.fish[ag.model.kind] = { minWall: 99, obstacleHits: 0, minFishDist: 99, maxSpeed: 0, stuck: 0, samples: 0 };
      }
      let crabMin = { x: 99, z: 99 }, crabMax = { x: -99, z: -99 }, crabBoxHits = 0, footBuried = 0, crabSamples = 0;
      const v = new THREE.Vector3(), b = new THREE.Box3();
      const snailA = { min: [99, 99], max: [-99, -99] }, snailB = { min: [99, 99, 99], max: [-99, -99, -99] };
      for (let i = 0; i < n; i++) {
        SIM.step(dt); updateRipples(SIM.time);
        for (const ag of w.fish) {
          const r = report.fish[ag.model.kind], p = ag.root.position, bb = ag.bounds();
          r.samples++;
          const wall = Math.min(p.x - bb.min.x, bb.max.x - p.x, p.y - bb.min.y, bb.max.y - p.y, p.z - bb.min.z, bb.max.z - p.z);
          r.minWall = Math.min(r.minWall, wall);
          r.maxSpeed = Math.max(r.maxSpeed, ag.speed);
          if (ag.stuck > 0) r.stuck++;
          for (const o of w.obstacles) {
            if (o.isBox3) { if (b.copy(o).expandByScalar(ag.cfg.radius * 0.8).containsPoint(p)) r.obstacleHits++; }
            else if (p.distanceTo(o.center) < o.radius + ag.cfg.radius * 0.8) r.obstacleHits++;
          }
          for (const o of w.fish) if (o !== ag) r.minFishDist = Math.min(r.minFishDist, p.distanceTo(o.root.position));
        }
        const cp = w.crab.group.position;
        crabSamples++;
        crabMin.x = Math.min(crabMin.x, cp.x); crabMin.z = Math.min(crabMin.z, cp.z); crabMax.x = Math.max(crabMax.x, cp.x); crabMax.z = Math.max(crabMax.z, cp.z);
        for (const leg of w.crab.legs) {
          leg.knee.getWorldPosition(v);
          const g = groundHeightAt(v.x, v.z);
          if (v.y < g - 0.01) footBuried++;
          if (v.x < TANK.ixMin || v.x > TANK.ixMax || v.z < TANK.izMin || v.z > TANK.izMax) crabBoxHits++;
        }
        const sa = w.snailA.group.position, sb = w.snailB.group.position;
        snailA.min = [Math.min(snailA.min[0], sa.x), Math.min(snailA.min[1], sa.z)]; snailA.max = [Math.max(snailA.max[0], sa.x), Math.max(snailA.max[1], sa.z)];
        snailB.min = [Math.min(snailB.min[0], sb.x), Math.min(snailB.min[1], sb.y), Math.min(snailB.min[2], sb.z)]; snailB.max = [Math.max(snailB.max[0], sb.x), Math.max(snailB.max[1], sb.y), Math.max(snailB.max[2], sb.z)];
      }
      for (const k of Object.keys(report.fish)) { const r = report.fish[k]; r.minWall = +r.minWall.toFixed(3); r.minFishDist = +r.minFishDist.toFixed(3); r.maxSpeed = +r.maxSpeed.toFixed(2); }
      report.crab = { range: [crabMin, crabMax], footOutOfBounds: crabBoxHits, footBuriedSamples: footBuried, samples: crabSamples, wp: w.crab.state.wp };
      report.snails = { A: snailA, B: snailB };
      report.bubblesAlive = w.bubbles.alive;
      report.time = +SIM.time.toFixed(1);
      SIM_UNIFORMS.uTime.value = SIM.time;
      render();
      return report;
    },
  };
})();
