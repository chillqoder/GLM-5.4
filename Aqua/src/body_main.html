<div id="stage" aria-label="Living 3D aquarium"></div>
<div id="boot" role="status"><span class="dot"></span>Filling the aquarium…</div>
<div id="ui" class="hidden" aria-hidden="false">
  <div id="title" aria-hidden="true"><strong>Living Glass</strong><span>Aquarium</span></div>
  <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  <div id="controls">
    <button id="btn-reset" type="button" title="Reset view (R)" aria-label="Reset view">Reset view</button>
    <button id="btn-pause" type="button" title="Pause or resume animation (Space)" aria-label="Pause animation" aria-pressed="false">Pause</button>
  </div>
</div>
<div id="fallback" hidden>
  <p>The aquarium could not start.</p>
  <p id="fallback-detail"></p>
</div>
